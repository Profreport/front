<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Gradient background -->
  <defs>
    <linearGradient id="fullstackGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fa709a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fee140;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#fullstackGrad)" opacity="0.1"/>

  <!-- Frontend part (top) - Browser -->
  <rect x="40" y="20" width="120" height="70" rx="6" fill="#667eea" opacity="0.2"/>
  <rect x="40" y="20" width="120" height="15" rx="6" fill="#667eea"/>
  <circle cx="50" cy="27.5" r="2.5" fill="white"/>
  <circle cx="58" cy="27.5" r="2.5" fill="white"/>
  <circle cx="66" cy="27.5" r="2.5" fill="white"/>

  <!-- Code in browser -->
  <text x="100" y="65" font-family="monospace" font-size="24" fill="#667eea" text-anchor="middle" font-weight="bold">&lt;/&gt;</text>

  <!-- Connection arrows -->
  <line x1="100" y1="95" x2="100" y2="105" stroke="#fa709a" stroke-width="3" stroke-dasharray="4,4"/>
  <polygon points="100,108 95,100 105,100" fill="#fa709a"/>

  <!-- Backend part (bottom) - Server -->
  <rect x="50" y="115" width="100" height="25" rx="4" fill="#11998e" opacity="0.3" stroke="#11998e" stroke-width="2"/>
  <circle cx="62" cy="127.5" r="2.5" fill="#38ef7d"/>
  <circle cx="70" cy="127.5" r="2.5" fill="#38ef7d"/>
  <rect x="80" y="123" width="40" height="2.5" fill="#38ef7d" rx="1"/>
  <rect x="80" y="128" width="30" height="2.5" fill="#38ef7d" rx="1"/>

  <!-- Database -->
  <ellipse cx="100" cy="155" rx="30" ry="7" fill="none" stroke="#11998e" stroke-width="2"/>
  <line x1="70" y1="155" x2="70" y2="168" stroke="#11998e" stroke-width="2"/>
  <line x1="130" y1="155" x2="130" y2="168" stroke="#11998e" stroke-width="2"/>
  <ellipse cx="100" cy="168" rx="30" ry="7" fill="#11998e" opacity="0.3" stroke="#11998e" stroke-width="2"/>

  <!-- Fullstack badge -->
  <rect x="60" y="180" width="80" height="18" rx="9" fill="#fa709a"/>
  <text x="100" y="193" font-family="Arial" font-size="12" fill="white" text-anchor="middle" font-weight="bold">FULL STACK</text>
</svg>
