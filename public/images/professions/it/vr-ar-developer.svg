<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Gradient background -->
  <defs>
    <linearGradient id="vrGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EC4899;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#vrGrad)" opacity="0.1"/>

  <!-- VR Headset (center) -->
  <rect x="55" y="50" width="90" height="75" rx="3" fill="#1E293B" opacity="0.9" stroke="#8B5CF6" stroke-width="3"/>
  <text x="100" y="43" font-family="Arial" font-size="7" fill="#8B5CF6" text-anchor="middle" font-weight="bold">UNITY VR PROJECT</text>

  <!-- Unity Editor Interface -->
  <rect x="60" y="55" width="80" height="7" rx="1" fill="#0F172A"/>
  <text x="63" y="60" font-family="Arial" font-size="4" fill="#8B5CF6" font-weight="bold">Hierarchy</text>
  <text x="85" y="60" font-family="Arial" font-size="4" fill="#6B7280">Scene</text>
  <text x="105" y="60" font-family="Arial" font-size="4" fill="#6B7280">Game</text>
  <text x="125" y="60" font-family="Arial" font-size="4" fill="#6B7280">Inspector</text>

  <!-- 3D Scene View -->
  <rect x="60" y="65" width="80" height="55" fill="#0F172A"/>

  <!-- VR Environment visualization -->
  <!-- Floor grid -->
  <line x1="65" y1="110" x2="135" y2="110" stroke="#374151" stroke-width="0.5"/>
  <line x1="70" y1="105" x2="130" y2="115" stroke="#374151" stroke-width="0.3"/>
  <line x1="75" y1="100" x2="125" y2="120" stroke="#374151" stroke-width="0.3"/>
  <line x1="80" y1="95" x2="120" y2="125" stroke="#374151" stroke-width="0.3"/>

  <!-- 3D Cube object -->
  <path d="M 90 75 L 105 82 L 105 97 L 90 90 Z" fill="#8B5CF6" opacity="0.7"/>
  <path d="M 90 75 L 100 70 L 115 77 L 105 82 Z" fill="#EC4899" opacity="0.7"/>
  <path d="M 105 82 L 115 77 L 115 92 L 105 97 Z" fill="#10B981" opacity="0.7"/>

  <!-- VR Controller representation -->
  <ellipse cx="75" cy="95" rx="4" ry="6" fill="#06B6D4" opacity="0.6" transform="rotate(-20 75 95)"/>
  <rect x="73" y="100" width="4" height="8" rx="2" fill="#06B6D4" opacity="0.6"/>
  <circle cx="75" cy="93" r="1" fill="#FFF"/>

  <!-- XR Rig icon -->
  <circle cx="120" cy="100" r="3" fill="#F59E0B" opacity="0.5"/>
  <rect x="118" y="103" width="4" height="6" rx="1" fill="#F59E0B" opacity="0.5"/>
  <line x1="116" y1="105" x2="113" y2="110" stroke="#F59E0B" stroke-width="1"/>
  <line x1="124" y1="105" x2="127" y2="110" stroke="#F59E0B" stroke-width="1"/>
  <text x="120" y="115" font-family="Arial" font-size="2" fill="#F59E0B" text-anchor="middle">XR Rig</text>

  <!-- Code snippet -->
  <text x="63" y="72" font-family="Courier" font-size="3" fill="#8B5CF6">XRController</text>
  <text x="110" y="72" font-family="Courier" font-size="2" fill="#6B7280">leftHand</text>

  <!-- Play button -->
  <circle cx="135" cy="58" r="2" fill="#10B981"/>
  <path d="M 134 57 L 136.5 58.5 L 134 60 Z" fill="#FFF"/>

  <!-- Meta Quest (top left) -->
  <rect x="15" y="15" width="35" height="55" rx="3" fill="none" stroke="#EC4899" stroke-width="2"/>
  <text x="32" y="10" font-family="Arial" font-size="5" fill="#EC4899" text-anchor="middle" font-weight="bold">META QUEST</text>

  <!-- VR Headset illustration -->
  <rect x="20" y="20" width="25" height="45" rx="1" fill="#1E293B" opacity="0.8"/>

  <!-- Headset front view -->
  <rect x="22" y="25" width="21" height="12" rx="2" fill="#0F172A" stroke="#EC4899" stroke-width="1"/>
  <circle cx="28" cy="31" r="3" fill="#8B5CF6" opacity="0.3"/>
  <circle cx="37" cy="31" r="3" fill="#8B5CF6" opacity="0.3"/>
  <text x="32" y="34" font-family="Arial" font-size="2" fill="#EC4899" text-anchor="middle">Lenses</text>

  <!-- Sensors -->
  <circle cx="24" cy="26" r="0.5" fill="#10B981"/>
  <circle cx="41" cy="26" r="0.5" fill="#10B981"/>
  <circle cx="32" cy="24" r="0.5" fill="#10B981"/>
  <text x="32" y="41" font-family="Arial" font-size="2" fill="#6B7280" text-anchor="middle">4 tracking cameras</text>

  <!-- Controllers -->
  <ellipse cx="25" cy="48" rx="3" ry="5" fill="#06B6D4" opacity="0.5"/>
  <rect x="23" y="52" width="4" height="6" rx="1" fill="#06B6D4" opacity="0.5"/>
  <circle cx="25" cy="47" r="1" fill="#FFF"/>
  <text x="25" y="61" font-family="Arial" font-size="2" fill="#06B6D4" text-anchor="middle">Left</text>

  <ellipse cx="40" cy="48" rx="3" ry="5" fill="#10B981" opacity="0.5"/>
  <rect x="38" y="52" width="4" height="6" rx="1" fill="#10B981" opacity="0.5"/>
  <circle cx="40" cy="47" r="1" fill="#FFF"/>
  <text x="40" y="61" font-family="Arial" font-size="2" fill="#10B981" text-anchor="middle">Right</text>

  <!-- HoloLens AR (top right) -->
  <rect x="150" y="15" width="35" height="55" rx="3" fill="#06B6D4" opacity="0.1" stroke="#06B6D4" stroke-width="2"/>
  <text x="167" y="10" font-family="Arial" font-size="5" fill="#06B6D4" text-anchor="middle" font-weight="bold">HOLOLENS</text>

  <!-- AR Glasses illustration -->
  <rect x="155" y="20" width="25" height="45" rx="1" fill="#1E293B" opacity="0.8"/>

  <!-- AR glasses front -->
  <rect x="157" y="25" width="21" height="8" rx="1" fill="#0F172A" stroke="#06B6D4" stroke-width="1"/>
  <rect x="159" y="27" width="8" height="4" rx="0.5" fill="#06B6D4" opacity="0.2"/>
  <rect x="170" y="27" width="8" height="4" rx="0.5" fill="#06B6D4" opacity="0.2"/>
  <text x="167" y="38" font-family="Arial" font-size="2" fill="#06B6D4" text-anchor="middle">Waveguide Display</text>

  <!-- Depth sensors -->
  <circle cx="160" cy="26" r="0.5" fill="#F59E0B"/>
  <circle cx="174" cy="26" r="0.5" fill="#F59E0B"/>
  <text x="167" y="43" font-family="Arial" font-size="2" fill="#F59E0B" text-anchor="middle">Depth sensors</text>

  <!-- AR overlay example -->
  <rect x="159" y="47" width="16" height="10" rx="1" fill="#06B6D4" opacity="0.2" stroke="#06B6D4" stroke-width="0.5"/>
  <text x="167" y="52" font-family="Arial" font-size="3" fill="#06B6D4" text-anchor="middle">AR</text>
  <text x="167" y="55" font-family="Arial" font-size="2" fill="#06B6D4" text-anchor="middle">Overlay</text>
  <circle cx="161" cy="50" r="1" fill="#10B981"/>
  <text x="163" y="51" font-family="Arial" font-size="2" fill="#10B981">+</text>

  <text x="167" y="62" font-family="Arial" font-size="2" fill="#6B7280" text-anchor="middle">Mixed Reality</text>

  <!-- 3D Modeling (bottom left) -->
  <rect x="15" y="135" width="55" height="50" rx="3" fill="none" stroke="#10B981" stroke-width="2"/>
  <text x="42" y="130" font-family="Arial" font-size="6" fill="#10B981" text-anchor="middle" font-weight="bold">3D ASSETS</text>

  <!-- 3D model showcase -->
  <rect x="20" y="140" width="45" height="40" rx="1" fill="#1E293B" opacity="0.8"/>

  <!-- Low poly 3D model -->
  <path d="M 32 150 L 42 145 L 52 150 L 52 160 L 42 165 L 32 160 Z" fill="#10B981" opacity="0.6" stroke="#10B981" stroke-width="0.5"/>
  <path d="M 32 150 L 42 145 L 42 155 L 32 160 Z" fill="#10B981" opacity="0.8"/>
  <path d="M 42 145 L 52 150 L 52 160 L 42 155 Z" fill="#10B981" opacity="0.4"/>

  <!-- Wireframe overlay -->
  <line x1="32" y1="150" x2="42" y2="145" stroke="#10B981" stroke-width="0.3"/>
  <line x1="42" y1="145" x2="52" y2="150" stroke="#10B981" stroke-width="0.3"/>
  <line x1="52" y1="150" x2="52" y2="160" stroke="#10B981" stroke-width="0.3"/>
  <line x1="52" y1="160" x2="42" y2="165" stroke="#10B981" stroke-width="0.3"/>
  <line x1="42" y1="165" x2="32" y2="160" stroke="#10B981" stroke-width="0.3"/>
  <line x1="32" y1="160" x2="32" y2="150" stroke="#10B981" stroke-width="0.3"/>
  <line x1="42" y1="145" x2="42" y2="155" stroke="#10B981" stroke-width="0.3"/>

  <!-- Poly count -->
  <text x="22" y="173" font-family="Arial" font-size="3" fill="#10B981">Vertices: 1,248</text>
  <text x="22" y="177" font-family="Arial" font-size="3" fill="#06B6D4">Triangles: 2,340</text>

  <!-- Interaction System (bottom center) -->
  <rect x="80" y="135" width="55" height="50" rx="3" fill="#F59E0B" opacity="0.1" stroke="#F59E0B" stroke-width="2"/>
  <text x="107" y="130" font-family="Arial" font-size="6" fill="#F59E0B" text-anchor="middle" font-weight="bold">INTERACTION</text>

  <!-- Hand tracking -->
  <rect x="85" y="140" width="45" height="40" rx="1" fill="#1E293B" opacity="0.8"/>

  <!-- Hand illustration -->
  <ellipse cx="107" cy="155" rx="8" ry="6" fill="#F59E0B" opacity="0.3"/>
  <!-- Fingers -->
  <rect x="105" y="149" width="2" height="6" rx="1" fill="#F59E0B" opacity="0.5"/>
  <rect x="108" y="147" width="2" height="8" rx="1" fill="#F59E0B" opacity="0.5"/>
  <rect x="111" y="148" width="2" height="7" rx="1" fill="#F59E0B" opacity="0.5"/>
  <rect x="114" y="150" width="2" height="5" rx="1" fill="#F59E0B" opacity="0.5"/>
  <rect x="100" y="152" width="2" height="4" rx="1" fill="#F59E0B" opacity="0.5"/>

  <!-- Gesture detection points -->
  <circle cx="107" cy="152" r="1" fill="#10B981"/>
  <circle cx="106" cy="149" r="0.5" fill="#10B981"/>
  <circle cx="109" cy="147" r="0.5" fill="#10B981"/>
  <circle cx="112" cy="148" r="0.5" fill="#10B981"/>
  <circle cx="115" cy="150" r="0.5" fill="#10B981"/>
  <circle cx="101" cy="152" r="0.5" fill="#10B981"/>

  <text x="107" y="165" font-family="Arial" font-size="3" fill="#F59E0B" text-anchor="middle">Hand Tracking</text>

  <!-- Interaction types -->
  <rect x="88" y="168" width="18" height="8" rx="1" fill="#8B5CF6" opacity="0.3"/>
  <text x="97" y="173" font-family="Arial" font-size="3" fill="#8B5CF6" text-anchor="middle">Grab</text>

  <rect x="109" y="168" width="18" height="8" rx="1" fill="#06B6D4" opacity="0.3"/>
  <text x="118" y="173" font-family="Arial" font-size="3" fill="#06B6D4" text-anchor="middle">Point</text>

  <!-- Performance (bottom right) -->
  <rect x="145" y="135" width="40" height="50" rx="3" fill="none" stroke="#EF4444" stroke-width="2"/>
  <text x="165" y="130" font-family="Arial" font-size="5" fill="#EF4444" text-anchor="middle" font-weight="bold">OPTIMIZE</text>

  <!-- Performance metrics -->
  <rect x="150" y="140" width="30" height="40" rx="1" fill="#1E293B" opacity="0.8"/>

  <!-- FPS meter -->
  <text x="152" y="146" font-family="Arial" font-size="4" fill="#10B981">FPS: 90</text>
  <rect x="152" y="148" width="24" height="3" fill="#374151" rx="1"/>
  <rect x="152" y="148" width="21" height="3" fill="#10B981" rx="1"/>

  <!-- Draw calls -->
  <text x="152" y="156" font-family="Arial" font-size="3" fill="#06B6D4">Draw Calls:</text>
  <text x="152" y="161" font-family="Arial" font-size="5" fill="#06B6D4">124</text>
  <circle cx="170" cy="159" r="1" fill="#10B981"/>
  <text x="173" y="161" font-family="Arial" font-size="2" fill="#10B981">Good</text>

  <!-- GPU usage -->
  <text x="152" y="169" font-family="Arial" font-size="3" fill="#8B5CF6">GPU Usage:</text>
  <rect x="152" y="171" width="24" height="3" fill="#374151" rx="1"/>
  <rect x="152" y="171" width="16" height="3" fill="#F59E0B" rx="1"/>
  <text x="165" y="178" font-family="Arial" font-size="3" fill="#F59E0B" text-anchor="middle">68%</text>

  <!-- VR Ready badge (left) -->
  <circle cx="20" cy="95" r="8" fill="none" stroke="#8B5CF6" stroke-width="2"/>
  <text x="20" y="98" font-family="Arial" font-size="6" fill="#8B5CF6" text-anchor="middle" font-weight="bold">🥽</text>
  <text x="20" y="87" font-family="Arial" font-size="3" fill="#8B5CF6" text-anchor="middle">VR</text>
  <text x="20" y="108" font-family="Arial" font-size="3" fill="#8B5CF6" text-anchor="middle">Ready</text>

  <!-- 90 FPS badge (right) -->
  <circle cx="180" cy="95" r="8" fill="#10B981" opacity="0.3"/>
  <text x="180" y="98" font-family="Arial" font-size="6" fill="#10B981" text-anchor="middle" font-weight="bold">90</text>
  <text x="180" y="87" font-family="Arial" font-size="3" fill="#10B981" text-anchor="middle">FPS</text>
  <text x="180" y="108" font-family="Arial" font-size="3" fill="#10B981" text-anchor="middle">Target</text>

  <!-- Tools badge (top) -->
  <rect x="65" y="5" width="70" height="10" rx="2" fill="#8B5CF6" opacity="0.3" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="100" y="12" font-family="Arial" font-size="6" fill="#8B5CF6" text-anchor="middle" font-weight="bold">Unity • Unreal • C# • XR SDK</text>

  <!-- "VR/AR DEVELOPER" text -->
  <text x="100" y="197" font-family="Arial" font-size="10" fill="#8B5CF6" text-anchor="middle" font-weight="bold">VR/AR DEVELOPER</text>
</svg>
