<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Gradient background -->
  <defs>
    <linearGradient id="techWriterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#techWriterGrad)" opacity="0.1"/>

  <!-- Markdown editor (center) -->
  <rect x="55" y="45" width="90" height="85" rx="3" fill="#1E293B" opacity="0.9" stroke="#10B981" stroke-width="3"/>
  <text x="100" y="38" font-family="Arial" font-size="7" fill="#10B981" text-anchor="middle" font-weight="bold">MARKDOWN EDITOR</text>

  <!-- Editor toolbar -->
  <rect x="60" y="50" width="80" height="7" rx="1" fill="#0F172A"/>
  <text x="63" y="55" font-family="Courier" font-size="4" fill="#10B981" font-weight="bold">B</text>
  <text x="68" y="55" font-family="Courier" font-size="4" fill="#10B981" font-style="italic">I</text>
  <rect x="73" y="52" width="8" height="3" rx="0.5" fill="#6B7280"/>
  <line x1="75" y1="53" x2="79" y2="53" stroke="#10B981" stroke-width="0.5"/>
  <rect x="83" y="52" width="8" height="3" rx="0.5" fill="#6B7280"/>
  <text x="85" y="55" font-family="Courier" font-size="3" fill="#06B6D4">&lt;&gt;</text>
  <text x="130" y="55" font-family="Arial" font-size="3" fill="#10B981">Preview</text>

  <!-- Markdown content -->
  <rect x="60" y="60" width="80" height="65" fill="#0F172A"/>

  <!-- Heading -->
  <text x="63" y="67" font-family="Courier" font-size="4" fill="#EC4899" font-weight="bold"># API Reference</text>

  <!-- Paragraph -->
  <text x="63" y="73" font-family="Courier" font-size="3" fill="#D1D5DB">This API allows you to</text>
  <text x="63" y="77" font-family="Courier" font-size="3" fill="#D1D5DB">manage **user accounts**</text>
  <text x="63" y="81" font-family="Courier" font-size="3" fill="#D1D5DB">and retrieve data.</text>

  <!-- Subheading -->
  <text x="63" y="88" font-family="Courier" font-size="4" fill="#F59E0B" font-weight="bold">## Authentication</text>

  <!-- Code block -->
  <rect x="63" y="92" width="72" height="20" rx="1" fill="#1E293B" stroke="#06B6D4" stroke-width="1"/>
  <text x="66" y="97" font-family="Courier" font-size="3" fill="#6B7280">```bash</text>
  <text x="66" y="101" font-family="Courier" font-size="3" fill="#10B981">curl -H "Authorization:</text>
  <text x="66" y="105" font-family="Courier" font-size="3" fill="#10B981">  Bearer YOUR_TOKEN"</text>
  <text x="66" y="109" font-family="Courier" font-size="3" fill="#06B6D4">  https://api.example.com</text>
  <text x="66" y="113" font-family="Courier" font-size="3" fill="#6B7280">```</text>

  <!-- List -->
  <text x="63" y="120" font-family="Courier" font-size="3" fill="#8B5CF6">- GET /users</text>
  <text x="63" y="124" font-family="Courier" font-size="3" fill="#8B5CF6">- POST /users</text>

  <!-- API Documentation (top left) -->
  <rect x="15" y="15" width="35" height="55" rx="3" fill="none" stroke="#06B6D4" stroke-width="2"/>
  <text x="32" y="10" font-family="Arial" font-size="6" fill="#06B6D4" text-anchor="middle" font-weight="bold">API DOCS</text>

  <!-- OpenAPI spec -->
  <rect x="20" y="20" width="25" height="45" rx="1" fill="#1E293B" opacity="0.8"/>
  <text x="22" y="26" font-family="Arial" font-size="4" fill="#06B6D4" font-weight="bold">OpenAPI 3.0</text>

  <!-- Endpoints list -->
  <rect x="22" y="30" width="21" height="3" rx="0.5" fill="#10B981" opacity="0.3"/>
  <text x="23" y="32.5" font-family="Courier" font-size="2" fill="#10B981">GET /users</text>

  <rect x="22" y="35" width="21" height="3" rx="0.5" fill="#06B6D4" opacity="0.3"/>
  <text x="23" y="37.5" font-family="Courier" font-size="2" fill="#06B6D4">POST /users</text>

  <rect x="22" y="40" width="21" height="3" rx="0.5" fill="#8B5CF6" opacity="0.3"/>
  <text x="23" y="42.5" font-family="Courier" font-size="2" fill="#8B5CF6">PUT /users/:id</text>

  <rect x="22" y="45" width="21" height="3" rx="0.5" fill="#EF4444" opacity="0.3"/>
  <text x="23" y="47.5" font-family="Courier" font-size="2" fill="#EF4444">DELETE /users/:id</text>

  <!-- Parameters -->
  <text x="22" y="54" font-family="Arial" font-size="3" fill="#F59E0B">Parameters:</text>
  <text x="22" y="58" font-family="Courier" font-size="2" fill="#D1D5DB">• id: string</text>
  <text x="22" y="61" font-family="Courier" font-size="2" fill="#D1D5DB">• name: string</text>

  <!-- Docs-as-Code (top right) -->
  <rect x="150" y="15" width="35" height="55" rx="3" fill="#10B981" opacity="0.1" stroke="#10B981" stroke-width="2"/>
  <text x="167" y="10" font-family="Arial" font-size="5" fill="#10B981" text-anchor="middle" font-weight="bold">DOCS-AS-CODE</text>

  <!-- Git workflow -->
  <rect x="155" y="20" width="25" height="45" rx="1" fill="#1E293B" opacity="0.8"/>

  <!-- GitHub icon -->
  <circle cx="167" cy="28" r="4" fill="#6B7280" opacity="0.3"/>
  <text x="167" y="31" font-family="Arial" font-size="5" fill="#E5E7EB" text-anchor="middle">⚙</text>
  <text x="167" y="36" font-family="Arial" font-size="3" fill="#10B981" text-anchor="middle">GitHub</text>

  <!-- Git commands -->
  <rect x="157" y="40" width="21" height="20" rx="1" fill="#0F172A"/>
  <text x="159" y="44" font-family="Courier" font-size="2" fill="#10B981">$ git checkout -b</text>
  <text x="159" y="47" font-family="Courier" font-size="2" fill="#10B981">  docs/update-api</text>
  <text x="159" y="51" font-family="Courier" font-size="2" fill="#06B6D4">$ git add docs/</text>
  <text x="159" y="54" font-family="Courier" font-size="2" fill="#8B5CF6">$ git commit -m</text>
  <text x="159" y="57" font-family="Courier" font-size="2" fill="#F59E0B">$ git push origin</text>

  <!-- User Guide (bottom left) -->
  <rect x="15" y="130" width="55" height="55" rx="3" fill="none" stroke="#8B5CF6" stroke-width="2"/>
  <text x="42" y="125" font-family="Arial" font-size="6" fill="#8B5CF6" text-anchor="middle" font-weight="bold">USER GUIDE</text>

  <!-- Tutorial steps -->
  <rect x="20" y="135" width="45" height="45" rx="1" fill="#1E293B" opacity="0.8"/>

  <!-- Step 1 -->
  <circle cx="24" cy="141" r="2" fill="#10B981"/>
  <text x="26" y="139" font-family="Arial" font-size="2" fill="#10B981">1</text>
  <text x="28" y="142" font-family="Arial" font-size="3" fill="#10B981">Getting Started</text>
  <text x="23" y="146" font-family="Arial" font-size="2" fill="#D1D5DB">Install the package:</text>
  <rect x="23" y="148" width="40" height="3" rx="0.5" fill="#0F172A"/>
  <text x="24" y="150.5" font-family="Courier" font-size="2" fill="#10B981">npm install my-package</text>

  <!-- Step 2 -->
  <circle cx="24" cy="156" r="2" fill="#06B6D4"/>
  <text x="26" y="154" font-family="Arial" font-size="2" fill="#06B6D4">2</text>
  <text x="28" y="157" font-family="Arial" font-size="3" fill="#06B6D4">Configuration</text>
  <text x="23" y="161" font-family="Arial" font-size="2" fill="#D1D5DB">Create config file</text>

  <!-- Step 3 -->
  <circle cx="24" cy="167" r="2" fill="#8B5CF6"/>
  <text x="26" y="165" font-family="Arial" font-size="2" fill="#8B5CF6">3</text>
  <text x="28" y="168" font-family="Arial" font-size="3" fill="#8B5CF6">First Steps</text>
  <text x="23" y="172" font-family="Arial" font-size="2" fill="#D1D5DB">Run your first command</text>

  <!-- Screenshot -->
  <rect x="23" y="175" width="40" height="3" rx="0.5" fill="#8B5CF6" opacity="0.3"/>
  <text x="43" y="177.5" font-family="Arial" font-size="2" fill="#8B5CF6" text-anchor="middle">📸 Screenshot</text>

  <!-- Release Notes (bottom center) -->
  <rect x="80" y="135" width="55" height="50" rx="3" fill="#F59E0B" opacity="0.1" stroke="#F59E0B" stroke-width="2"/>
  <text x="107" y="130" font-family="Arial" font-size="6" fill="#F59E0B" text-anchor="middle" font-weight="bold">RELEASE NOTES</text>

  <!-- Changelog -->
  <rect x="85" y="140" width="45" height="40" rx="1" fill="#1E293B" opacity="0.8"/>

  <!-- Version 2.0.0 -->
  <text x="87" y="146" font-family="Courier" font-size="4" fill="#10B981" font-weight="bold">v2.0.0</text>
  <text x="110" y="146" font-family="Arial" font-size="3" fill="#6B7280">2024-01-15</text>

  <text x="87" y="152" font-family="Arial" font-size="3" fill="#10B981">✨ New Features:</text>
  <text x="89" y="156" font-family="Arial" font-size="2" fill="#D1D5DB">• Dark mode support</text>
  <text x="89" y="159" font-family="Arial" font-size="2" fill="#D1D5DB">• Export to PDF</text>

  <text x="87" y="164" font-family="Arial" font-size="3" fill="#EF4444">🐛 Bug Fixes:</text>
  <text x="89" y="168" font-family="Arial" font-size="2" fill="#D1D5DB">• Fixed login issue</text>

  <text x="87" y="173" font-family="Arial" font-size="3" fill="#F59E0B">⚠️ Breaking:</text>
  <text x="89" y="177" font-family="Arial" font-size="2" fill="#D1D5DB">• API v1 deprecated</text>

  <!-- Knowledge Base (bottom right) -->
  <rect x="145" y="135" width="40" height="50" rx="3" fill="none" stroke="#EC4899" stroke-width="2"/>
  <text x="165" y="130" font-family="Arial" font-size="5" fill="#EC4899" text-anchor="middle" font-weight="bold">KB</text>

  <!-- Knowledge base articles -->
  <rect x="150" y="140" width="30" height="40" rx="1" fill="#1E293B" opacity="0.8"/>

  <!-- Search -->
  <rect x="152" y="143" width="26" height="4" rx="1" fill="#0F172A" stroke="#EC4899" stroke-width="0.5"/>
  <text x="154" y="146" font-family="Arial" font-size="3" fill="#6B7280">🔍 Search...</text>

  <!-- Categories -->
  <text x="152" y="152" font-family="Arial" font-size="3" fill="#EC4899">Categories:</text>

  <circle cx="154" cy="156" r="1" fill="#10B981"/>
  <text x="157" y="157" font-family="Arial" font-size="2" fill="#10B981">Getting Started (12)</text>

  <circle cx="154" cy="161" r="1" fill="#06B6D4"/>
  <text x="157" y="162" font-family="Arial" font-size="2" fill="#06B6D4">Troubleshooting (24)</text>

  <circle cx="154" cy="166" r="1" fill="#8B5CF6"/>
  <text x="157" y="167" font-family="Arial" font-size="2" fill="#8B5CF6">Advanced (8)</text>

  <circle cx="154" cy="171" r="1" fill="#F59E0B"/>
  <text x="157" y="172" font-family="Arial" font-size="2" fill="#F59E0B">FAQ (35)</text>

  <!-- Views -->
  <text x="152" y="178" font-family="Arial" font-size="2" fill="#6B7280">Total: 15,240 views</text>

  <!-- Clarity badge (left) -->
  <circle cx="20" cy="95" r="8" fill="none" stroke="#10B981" stroke-width="2"/>
  <text x="20" y="98" font-family="Arial" font-size="6" fill="#10B981" text-anchor="middle" font-weight="bold">A</text>
  <text x="20" y="87" font-family="Arial" font-size="3" fill="#10B981" text-anchor="middle">Clear</text>
  <text x="20" y="108" font-family="Arial" font-size="3" fill="#10B981" text-anchor="middle">Writing</text>

  <!-- Version control (right) -->
  <circle cx="180" cy="95" r="8" fill="#06B6D4" opacity="0.3"/>
  <text x="180" y="98" font-family="Arial" font-size="6" fill="#06B6D4" text-anchor="middle" font-weight="bold">⎇</text>
  <text x="180" y="87" font-family="Arial" font-size="3" fill="#06B6D4" text-anchor="middle">Git</text>
  <text x="180" y="108" font-family="Arial" font-size="3" fill="#06B6D4" text-anchor="middle">Versioned</text>

  <!-- Tools badge (top) -->
  <rect x="70" y="5" width="60" height="10" rx="2" fill="#10B981" opacity="0.3" stroke="#10B981" stroke-width="1.5"/>
  <text x="100" y="12" font-family="Arial" font-size="6" fill="#10B981" text-anchor="middle" font-weight="bold">Markdown • Git • Swagger</text>

  <!-- "TECHNICAL WRITER" text -->
  <text x="100" y="197" font-family="Arial" font-size="10" fill="#10B981" text-anchor="middle" font-weight="bold">TECHNICAL WRITER</text>
</svg>
