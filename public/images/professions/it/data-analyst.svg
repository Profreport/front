<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Gradient background -->
  <defs>
    <linearGradient id="analystGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0EA5E9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#analystGrad)" opacity="0.1"/>

  <!-- Dashboard/BI screen (main element) -->
  <rect x="35" y="35" width="130" height="85" rx="4" fill="none" stroke="#0EA5E9" stroke-width="3"/>
  <line x1="35" y1="50" x2="165" y2="50" stroke="#0EA5E9" stroke-width="2"/>

  <!-- Bar chart inside dashboard -->
  <rect x="45" y="80" width="8" height="25" fill="#10B981" opacity="0.6"/>
  <rect x="56" y="70" width="8" height="35" fill="#0EA5E9" opacity="0.6"/>
  <rect x="67" y="75" width="8" height="30" fill="#10B981" opacity="0.6"/>
  <rect x="78" y="65" width="8" height="40" fill="#0EA5E9" opacity="0.6"/>

  <!-- Line chart -->
  <polyline points="95,95 105,85 115,90 125,75 135,80 145,70 155,75" fill="none" stroke="#10B981" stroke-width="3"/>
  <circle cx="95" cy="95" r="2.5" fill="#10B981"/>
  <circle cx="115" cy="90" r="2.5" fill="#10B981"/>
  <circle cx="135" cy="80" r="2.5" fill="#10B981"/>
  <circle cx="155" cy="75" r="2.5" fill="#10B981"/>

  <!-- Metrics indicators -->
  <text x="48" y="62" font-family="Arial" font-size="7" fill="#0EA5E9" font-weight="bold">KPI</text>
  <text x="105" y="62" font-family="Arial" font-size="7" fill="#10B981" font-weight="bold">TREND</text>

  <!-- SQL window (bottom left) -->
  <rect x="15" y="135" width="55" height="45" rx="3" fill="none" stroke="#0EA5E9" stroke-width="2"/>
  <line x1="15" y1="145" x2="70" y2="145" stroke="#0EA5E9" stroke-width="1.5"/>
  <text x="42" y="142" font-family="Courier" font-size="8" fill="#0EA5E9" text-anchor="middle" font-weight="bold">SQL</text>
  <text x="20" y="155" font-family="Courier" font-size="6" fill="#10B981">SELECT</text>
  <text x="20" y="163" font-family="Courier" font-size="6" fill="#0EA5E9">FROM</text>
  <text x="20" y="171" font-family="Courier" font-size="6" fill="#10B981">WHERE</text>
  <line x1="20" y1="175" x2="65" y2="175" stroke="#0EA5E9" stroke-width="0.5"/>

  <!-- Excel/spreadsheet icon (bottom center) -->
  <rect x="80" y="135" width="40" height="45" rx="3" fill="#10B981" opacity="0.1" stroke="#10B981" stroke-width="2"/>
  <line x1="80" y1="145" x2="120" y2="145" stroke="#10B981" stroke-width="1"/>
  <line x1="80" y1="155" x2="120" y2="155" stroke="#10B981" stroke-width="1"/>
  <line x1="80" y1="165" x2="120" y2="165" stroke="#10B981" stroke-width="1"/>
  <line x1="80" y1="175" x2="120" y2="175" stroke="#10B981" stroke-width="1"/>
  <line x1="95" y1="135" x2="95" y2="180" stroke="#10B981" stroke-width="1"/>
  <line x1="107" y1="135" x2="107" y2="180" stroke="#10B981" stroke-width="1"/>
  <text x="100" y="143" font-family="Arial" font-size="7" fill="#10B981" text-anchor="middle" font-weight="bold">EXCEL</text>

  <!-- Tableau/Power BI logo hint (bottom right) -->
  <rect x="130" y="135" width="55" height="45" rx="3" fill="none" stroke="#0EA5E9" stroke-width="2"/>
  <rect x="138" y="148" width="18" height="25" fill="#0EA5E9" opacity="0.3"/>
  <rect x="158" y="153" width="18" height="20" fill="#10B981" opacity="0.3"/>
  <text x="157" y="143" font-family="Arial" font-size="7" fill="#0EA5E9" text-anchor="middle" font-weight="bold">BI TOOLS</text>

  <!-- Funnel icon (top left) -->
  <path d="M 15 30 L 35 30 L 30 40 L 30 50 L 28 50 L 28 40 L 20 40 L 15 30 Z" fill="none" stroke="#10B981" stroke-width="2"/>
  <text x="25" y="60" font-family="Arial" font-size="6" fill="#10B981" text-anchor="middle">Funnel</text>

  <!-- A/B test icon (top right) -->
  <circle cx="175" cy="35" r="12" fill="#10B981" opacity="0.2"/>
  <text x="175" y="40" font-family="Arial" font-size="14" fill="#10B981" text-anchor="middle" font-weight="bold">A/B</text>
  <text x="175" y="55" font-family="Arial" font-size="6" fill="#10B981" text-anchor="middle">Test</text>

  <!-- Magnifying glass (insights) -->
  <circle cx="180" cy="95" r="10" fill="none" stroke="#0EA5E9" stroke-width="2"/>
  <line x1="187" y1="102" x2="193" y2="108" stroke="#0EA5E9" stroke-width="2"/>
  <text x="180" y="99" font-family="Arial" font-size="8" fill="#0EA5E9" text-anchor="middle" font-weight="bold">?</text>

  <!-- Percentage/metrics symbols -->
  <text x="18" y="100" font-family="Arial" font-size="16" fill="#10B981" font-weight="bold">%</text>
  <text x="18" y="118" font-family="Arial" font-size="12" fill="#0EA5E9">↑42</text>

  <!-- "DATA ANALYST" text -->
  <text x="100" y="197" font-family="Arial" font-size="10" fill="#0EA5E9" text-anchor="middle" font-weight="bold">DATA ANALYST</text>
</svg>
