<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Gradient background -->
  <defs>
    <linearGradient id="solutionGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EF4444;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#solutionGrad)" opacity="0.1"/>

  <!-- Presentation screen (main element) -->
  <rect x="40" y="30" width="120" height="80" rx="4" fill="none" stroke="#F59E0B" stroke-width="3"/>
  <line x1="40" y1="45" x2="160" y2="45" stroke="#F59E0B" stroke-width="2"/>

  <!-- Business chart on presentation -->
  <polyline points="55,75 70,65 85,70 100,55 115,60 130,50 145,55" fill="none" stroke="#EF4444" stroke-width="3"/>
  <circle cx="55" cy="75" r="3" fill="#EF4444"/>
  <circle cx="85" cy="70" r="3" fill="#EF4444"/>
  <circle cx="100" cy="55" r="3" fill="#EF4444"/>
  <circle cx="130" cy="50" r="3" fill="#EF4444"/>

  <!-- Presentation stand -->
  <line x1="100" y1="110" x2="100" y2="125" stroke="#F59E0B" stroke-width="3"/>
  <line x1="90" y1="125" x2="110" y2="125" stroke="#F59E0B" stroke-width="3"/>

  <!-- Business blocks (left side) - representing business requirements -->
  <rect x="15" y="140" width="35" height="25" rx="3" fill="#F59E0B" opacity="0.2" stroke="#F59E0B" stroke-width="2"/>
  <text x="32" y="155" font-family="Arial" font-size="9" fill="#F59E0B" text-anchor="middle" font-weight="bold">BIZ</text>
  <line x1="20" y1="160" x2="45" y2="160" stroke="#F59E0B" stroke-width="1"/>

  <!-- Technical blocks (right side) - representing technical solution -->
  <rect x="150" y="140" width="35" height="25" rx="3" fill="#EF4444" opacity="0.2" stroke="#EF4444" stroke-width="2"/>
  <text x="167" y="155" font-family="Arial" font-size="9" fill="#EF4444" text-anchor="middle" font-weight="bold">TECH</text>
  <line x1="155" y1="160" x2="180" y2="160" stroke="#EF4444" stroke-width="1"/>

  <!-- Integration arrows connecting business and tech -->
  <line x1="50" y1="152" x2="80" y2="152" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrowSol)"/>
  <line x1="120" y1="152" x2="150" y2="152" stroke="#EF4444" stroke-width="2" marker-end="url(#arrowSol2)"/>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrowSol" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto">
      <polygon points="0 0, 5 3, 0 6" fill="#F59E0B"/>
    </marker>
    <marker id="arrowSol2" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto">
      <polygon points="0 0, 5 3, 0 6" fill="#EF4444"/>
    </marker>
  </defs>

  <!-- Solution hub (center) -->
  <circle cx="100" cy="152" r="18" fill="url(#solutionGrad)" opacity="0.3" stroke="#F59E0B" stroke-width="2"/>
  <text x="100" y="157" font-family="Arial" font-size="10" fill="#F59E0B" text-anchor="middle" font-weight="bold">SOL</text>

  <!-- Puzzle pieces (top left) - representing complex solutions -->
  <path d="M 20 25 L 35 25 Q 35 20, 40 20 Q 45 20, 45 25 L 45 40 L 30 40 L 30 25 Z" fill="none" stroke="#F59E0B" stroke-width="2"/>
  <path d="M 45 25 L 60 25 L 60 40 Q 55 40, 55 45 Q 55 50, 60 50 L 45 50 L 45 25 Z" fill="none" stroke="#EF4444" stroke-width="2"/>

  <!-- Document/RFP icon (top right) -->
  <rect x="165" y="20" width="25" height="35" rx="2" fill="none" stroke="#EF4444" stroke-width="2"/>
  <line x1="170" y1="28" x2="185" y2="28" stroke="#EF4444" stroke-width="1.5"/>
  <line x1="170" y1="34" x2="185" y2="34" stroke="#EF4444" stroke-width="1.5"/>
  <line x1="170" y1="40" x2="182" y2="40" stroke="#EF4444" stroke-width="1"/>
  <line x1="170" y1="45" x2="182" y2="45" stroke="#EF4444" stroke-width="1"/>
  <text x="177" y="26" font-family="Arial" font-size="7" fill="#EF4444" text-anchor="middle">RFP</text>

  <!-- Client/stakeholders icons (bottom) -->
  <circle cx="65" cy="180" r="8" fill="none" stroke="#F59E0B" stroke-width="2"/>
  <circle cx="65" cy="177" r="3" fill="#F59E0B"/>
  <path d="M 57 188 Q 65 183, 73 188" fill="none" stroke="#F59E0B" stroke-width="2"/>

  <circle cx="100" cy="180" r="8" fill="none" stroke="#F59E0B" stroke-width="2"/>
  <circle cx="100" cy="177" r="3" fill="#F59E0B"/>
  <path d="M 92 188 Q 100 183, 108 188" fill="none" stroke="#F59E0B" stroke-width="2"/>

  <circle cx="135" cy="180" r="8" fill="none" stroke="#F59E0B" stroke-width="2"/>
  <circle cx="135" cy="177" r="3" fill="#F59E0B"/>
  <path d="M 127 188 Q 135 183, 143 188" fill="none" stroke="#F59E0B" stroke-width="2"/>

  <!-- "SOLUTION" text -->
  <text x="100" y="197" font-family="Arial" font-size="10" fill="#F59E0B" text-anchor="middle" font-weight="bold">SOLUTION ARCH</text>
</svg>
