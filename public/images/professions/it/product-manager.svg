<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Gradient background -->
  <defs>
    <linearGradient id="pmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EC4899;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#pmGrad)" opacity="0.1"/>

  <!-- Roadmap/Timeline (main) -->
  <line x1="30" y1="60" x2="170" y2="60" stroke="#6366F1" stroke-width="4"/>

  <!-- Milestones -->
  <circle cx="50" cy="60" r="8" fill="#10B981" stroke="#6366F1" stroke-width="2"/>
  <circle cx="90" cy="60" r="8" fill="#6366F1" stroke="#6366F1" stroke-width="2"/>
  <circle cx="130" cy="60" r="8" fill="#6366F1" opacity="0.5" stroke="#6366F1" stroke-width="2"/>
  <circle cx="160" cy="60" r="8" fill="none" stroke="#6366F1" stroke-width="2" stroke-dasharray="2,2"/>

  <!-- Milestone labels -->
  <text x="50" y="50" font-family="Arial" font-size="7" fill="#10B981" text-anchor="middle" font-weight="bold">v1.0</text>
  <text x="90" y="50" font-family="Arial" font-size="7" fill="#6366F1" text-anchor="middle" font-weight="bold">v2.0</text>
  <text x="130" y="50" font-family="Arial" font-size="7" fill="#6366F1" text-anchor="middle">v3.0</text>

  <!-- ROADMAP label -->
  <text x="100" y="40" font-family="Arial" font-size="9" fill="#6366F1" text-anchor="middle" font-weight="bold">ROADMAP</text>

  <!-- Vision/Strategy (top left) -->
  <circle cx="35" cy="90" r="15" fill="none" stroke="#EC4899" stroke-width="2"/>
  <circle cx="35" cy="90" r="10" fill="none" stroke="#EC4899" stroke-width="1.5"/>
  <circle cx="35" cy="90" r="5" fill="#EC4899" opacity="0.3"/>
  <text x="35" y="115" font-family="Arial" font-size="7" fill="#EC4899" text-anchor="middle" font-weight="bold">VISION</text>

  <!-- User Research (top right) -->
  <circle cx="165" cy="90" r="12" fill="none" stroke="#6366F1" stroke-width="2"/>
  <circle cx="165" cy="87" r="4" fill="#6366F1"/>
  <path d="M 153 100 Q 165 95, 177 100" fill="none" stroke="#6366F1" stroke-width="2"/>
  <text x="165" y="115" font-family="Arial" font-size="7" fill="#6366F1" text-anchor="middle" font-weight="bold">USER</text>

  <!-- Team coordination (center) -->
  <circle cx="70" cy="140" r="10" fill="#6366F1" opacity="0.2" stroke="#6366F1" stroke-width="2"/>
  <text x="70" y="144" font-family="Arial" font-size="9" fill="#6366F1" text-anchor="middle" font-weight="bold">D</text>

  <circle cx="100" cy="135" r="10" fill="#EC4899" opacity="0.2" stroke="#EC4899" stroke-width="2"/>
  <text x="100" y="139" font-family="Arial" font-size="9" fill="#EC4899" text-anchor="middle" font-weight="bold">P</text>

  <circle cx="130" cy="140" r="10" fill="#6366F1" opacity="0.2" stroke="#6366F1" stroke-width="2"/>
  <text x="130" y="144" font-family="Arial" font-size="9" fill="#6366F1" text-anchor="middle" font-weight="bold">M</text>

  <!-- Connections -->
  <line x1="78" y1="137" x2="92" y2="136" stroke="#EC4899" stroke-width="1.5"/>
  <line x1="108" y1="137" x2="122" y2="139" stroke="#EC4899" stroke-width="1.5"/>

  <!-- Team labels -->
  <text x="70" y="158" font-family="Arial" font-size="6" fill="#6366F1" text-anchor="middle">Dev</text>
  <text x="100" y="153" font-family="Arial" font-size="6" fill="#EC4899" text-anchor="middle">PM</text>
  <text x="130" y="158" font-family="Arial" font-size="6" fill="#6366F1" text-anchor="middle">Mkt</text>

  <!-- Prioritization matrix (left) -->
  <rect x="15" y="120" width="35" height="35" rx="2" fill="none" stroke="#6366F1" stroke-width="2"/>
  <line x1="32" y1="120" x2="32" y2="155" stroke="#6366F1" stroke-width="1"/>
  <line x1="15" y1="137" x2="50" y2="137" stroke="#6366F1" stroke-width="1"/>

  <!-- Priority items -->
  <circle cx="22" cy="128" r="2" fill="#10B981"/>
  <circle cx="42" cy="130" r="2" fill="#EC4899"/>
  <circle cx="40" cy="147" r="2" fill="#6366F1" opacity="0.5"/>
  <text x="32" y="118" font-family="Arial" font-size="6" fill="#6366F1" text-anchor="middle">Priority</text>

  <!-- Metrics dashboard (right) -->
  <rect x="150" y="125" width="35" height="30" rx="2" fill="#EC4899" opacity="0.1" stroke="#EC4899" stroke-width="2"/>
  <rect x="154" y="138" width="4" height="12" fill="#10B981" opacity="0.6"/>
  <rect x="160" y="133" width="4" height="17" fill="#6366F1" opacity="0.6"/>
  <rect x="166" y="135" width="4" height="15" fill="#EC4899" opacity="0.6"/>
  <rect x="172" y="140" width="4" height="10" fill="#10B981" opacity="0.6"/>
  <text x="167" y="123" font-family="Arial" font-size="6" fill="#EC4899" text-anchor="middle">Metrics</text>

  <!-- Decision/Compass (bottom center) -->
  <circle cx="100" cy="175" r="12" fill="none" stroke="#6366F1" stroke-width="2"/>
  <line x1="100" y1="168" x2="100" y2="182" stroke="#EC4899" stroke-width="2"/>
  <line x1="93" y1="175" x2="107" y2="175" stroke="#EC4899" stroke-width="2"/>
  <text x="100" y="192" font-family="Arial" font-size="6" fill="#6366F1" text-anchor="middle">Decisions</text>

  <!-- "PRODUCT MANAGER" text -->
  <text x="100" y="197" font-family="Arial" font-size="9" fill="#6366F1" text-anchor="middle" font-weight="bold">PRODUCT MANAGER</text>
</svg>
