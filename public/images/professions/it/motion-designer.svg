<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Gradient background -->
  <defs>
    <linearGradient id="motionGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EC4899;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#motionGrad)" opacity="0.1"/>

  <!-- After Effects timeline (center) -->
  <rect x="55" y="55" width="90" height="70" rx="3" fill="#1E293B" opacity="0.9" stroke="#F59E0B" stroke-width="3"/>
  <text x="100" y="50" font-family="Arial" font-size="7" fill="#F59E0B" text-anchor="middle" font-weight="bold">AFTER EFFECTS</text>

  <!-- Timeline header -->
  <rect x="60" y="60" width="80" height="6" rx="1" fill="#0F172A"/>
  <text x="63" y="64" font-family="Arial" font-size="3" fill="#F59E0B">Timeline</text>
  <rect x="120" y="61" width="15" height="3" rx="0.5" fill="#10B981"/>
  <text x="122" y="63.5" font-family="Arial" font-size="2" fill="#FFF">00:02:15</text>

  <!-- Timeline tracks -->
  <rect x="60" y="68" width="80" height="52" fill="#0F172A"/>

  <!-- Track 1: Logo animation -->
  <text x="63" y="73" font-family="Arial" font-size="3" fill="#06B6D4">Logo Layer</text>
  <rect x="75" y="70" width="50" height="4" fill="#06B6D4" opacity="0.3"/>
  <rect x="80" y="70" width="30" height="4" fill="#06B6D4"/>

  <!-- Keyframe diamonds -->
  <polygon points="80,72 82,70 84,72 82,74" fill="#10B981"/>
  <polygon points="95,72 97,70 99,72 97,74" fill="#10B981"/>
  <polygon points="110,72 112,70 114,72 112,74" fill="#10B981"/>

  <!-- Track 2: Text animation -->
  <text x="63" y="81" font-family="Arial" font-size="3" fill="#8B5CF6">Text Layer</text>
  <rect x="75" y="78" width="50" height="4" fill="#8B5CF6" opacity="0.3"/>
  <rect x="85" y="78" width="35" height="4" fill="#8B5CF6"/>
  <polygon points="85,80 87,78 89,80 87,82" fill="#10B981"/>
  <polygon points="105,80 107,78 109,80 107,82" fill="#10B981"/>
  <polygon points="120,80 122,78 124,80 122,82" fill="#10B981"/>

  <!-- Track 3: Background -->
  <text x="63" y="89" font-family="Arial" font-size="3" fill="#EC4899">Background</text>
  <rect x="75" y="86" width="50" height="4" fill="#EC4899" opacity="0.3"/>
  <rect x="75" y="86" width="50" height="4" fill="#EC4899"/>

  <!-- Track 4: Shape layers -->
  <text x="63" y="97" font-family="Arial" font-size="3" fill="#F59E0B">Shapes</text>
  <rect x="75" y="94" width="50" height="4" fill="#F59E0B" opacity="0.3"/>
  <rect x="90" y="94" width="25" height="4" fill="#F59E0B"/>
  <polygon points="90,96 92,94 94,96 92,98" fill="#10B981"/>
  <polygon points="102,96 104,94 106,96 104,98" fill="#10B981"/>
  <polygon points="115,96 117,94 119,96 117,98" fill="#10B981"/>

  <!-- Playhead -->
  <line x1="100" y1="68" x2="100" y2="120" stroke="#EF4444" stroke-width="2"/>
  <polygon points="100,68 97,65 103,65" fill="#EF4444"/>

  <!-- Preview window -->
  <rect x="60" y="102" width="35" height="20" rx="1" fill="#0F172A" stroke="#06B6D4" stroke-width="1"/>
  <text x="77" y="108" font-family="Arial" font-size="8" fill="#F59E0B" text-anchor="middle">▶</text>
  <text x="77" y="118" font-family="Arial" font-size="3" fill="#06B6D4" text-anchor="middle">Preview</text>

  <!-- Controls -->
  <rect x="98" y="102" width="40" height="8" rx="1" fill="#0F172A"/>
  <circle cx="103" cy="106" r="2" fill="#10B981"/>
  <text x="107" y="108" font-family="Arial" font-size="3" fill="#10B981">Ease In/Out</text>
  <circle cx="103" cy="113" r="2" fill="#8B5CF6"/>
  <text x="107" y="115" font-family="Arial" font-size="3" fill="#8B5CF6">Motion Blur</text>

  <!-- Lottie export (top left) -->
  <rect x="15" y="15" width="50" height="50" rx="3" fill="none" stroke="#10B981" stroke-width="2"/>
  <text x="40" y="27" font-family="Arial" font-size="7" fill="#10B981" text-anchor="middle" font-weight="bold">LOTTIE</text>
  <text x="40" y="34" font-family="Arial" font-size="5" fill="#10B981" text-anchor="middle">JSON Export</text>

  <!-- Animation code snippet -->
  <rect x="20" y="38" width="40" height="22" rx="1" fill="#1E293B" opacity="0.8"/>
  <text x="22" y="43" font-family="Courier" font-size="3" fill="#10B981">{</text>
  <text x="22" y="47" font-family="Courier" font-size="3" fill="#06B6D4">  "v":"5.7.4",</text>
  <text x="22" y="51" font-family="Courier" font-size="3" fill="#8B5CF6">  "fr":60,</text>
  <text x="22" y="55" font-family="Courier" font-size="3" fill="#F59E0B">  "layers":[...]</text>
  <text x="22" y="59" font-family="Courier" font-size="3" fill="#10B981">}</text>

  <!-- Micro-interactions (top right) -->
  <rect x="135" y="15" width="50" height="50" rx="3" fill="#EC4899" opacity="0.1" stroke="#EC4899" stroke-width="2"/>
  <text x="160" y="27" font-family="Arial" font-size="6" fill="#EC4899" text-anchor="middle" font-weight="bold">MICRO-</text>
  <text x="160" y="33" font-family="Arial" font-size="6" fill="#EC4899" text-anchor="middle" font-weight="bold">INTERACTIONS</text>

  <!-- Button states animation -->
  <rect x="145" y="38" width="15" height="6" rx="1" fill="#8B5CF6" opacity="0.4"/>
  <text x="152" y="42" font-family="Arial" font-size="3" fill="#FFF" text-anchor="middle">Idle</text>

  <text x="160" y="45" font-family="Arial" font-size="5" fill="#EC4899" text-anchor="middle">→</text>

  <rect x="165" y="38" width="15" height="6" rx="1" fill="#8B5CF6"/>
  <text x="172" y="42" font-family="Arial" font-size="3" fill="#FFF" text-anchor="middle">Hover</text>

  <!-- Loader animation -->
  <circle cx="152" cy="52" r="3" fill="none" stroke="#06B6D4" stroke-width="1" stroke-dasharray="3 2"/>
  <circle cx="152" cy="52" r="2" fill="#06B6D4" opacity="0.5"/>
  <text x="160" y="54" font-family="Arial" font-size="3" fill="#06B6D4">Loading</text>

  <!-- Success checkmark -->
  <circle cx="152" cy="59" r="3" fill="#10B981" opacity="0.3"/>
  <path d="M 150 59 L 151.5 60.5 L 154 57.5" stroke="#10B981" stroke-width="1" fill="none"/>
  <text x="160" y="61" font-family="Arial" font-size="3" fill="#10B981">Success</text>

  <!-- Principles of Animation (bottom left) -->
  <rect x="15" y="130" width="55" height="55" rx="3" fill="none" stroke="#F59E0B" stroke-width="2"/>
  <text x="42" y="142" font-family="Arial" font-size="6" fill="#F59E0B" text-anchor="middle" font-weight="bold">12 PRINCIPLES</text>

  <!-- Animation principles -->
  <rect x="20" y="147" width="45" height="33" rx="1" fill="#1E293B" opacity="0.8"/>
  <text x="22" y="152" font-family="Arial" font-size="3" fill="#10B981">✓ Squash & Stretch</text>
  <text x="22" y="157" font-family="Arial" font-size="3" fill="#10B981">✓ Anticipation</text>
  <text x="22" y="162" font-family="Arial" font-size="3" fill="#06B6D4">✓ Timing & Spacing</text>
  <text x="22" y="167" font-family="Arial" font-size="3" fill="#8B5CF6">✓ Ease In/Out</text>
  <text x="22" y="172" font-family="Arial" font-size="3" fill="#EC4899">✓ Follow Through</text>
  <text x="22" y="177" font-family="Arial" font-size="3" fill="#F59E0B">✓ Secondary Action</text>

  <!-- UI Animation Examples (bottom center) -->
  <rect x="80" y="130" width="55" height="55" rx="3" fill="#06B6D4" opacity="0.1" stroke="#06B6D4" stroke-width="2"/>
  <text x="107" y="142" font-family="Arial" font-size="6" fill="#06B6D4" text-anchor="middle" font-weight="bold">UI ANIMATIONS</text>

  <!-- Onboarding screens -->
  <rect x="85" y="147" width="45" height="33" rx="1" fill="#1E293B" opacity="0.8"/>

  <!-- Screen 1 -->
  <rect x="88" y="150" width="12" height="16" rx="1" fill="#8B5CF6" opacity="0.3"/>
  <circle cx="94" cy="156" r="2" fill="#8B5CF6"/>
  <text x="94" y="164" font-family="Arial" font-size="2" fill="#8B5CF6" text-anchor="middle">Step 1</text>

  <!-- Arrow -->
  <path d="M 101 158 L 106 158" stroke="#F59E0B" stroke-width="1" marker-end="url(#arrowMotion)"/>
  <defs>
    <marker id="arrowMotion" markerWidth="4" markerHeight="4" refX="2" refY="2" orient="auto">
      <polygon points="0 0, 2 2, 0 4" fill="#F59E0B"/>
    </marker>
  </defs>

  <!-- Screen 2 -->
  <rect x="107" y="150" width="12" height="16" rx="1" fill="#EC4899" opacity="0.3"/>
  <circle cx="113" cy="156" r="2" fill="#EC4899"/>
  <text x="113" y="164" font-family="Arial" font-size="2" fill="#EC4899" text-anchor="middle">Step 2</text>

  <!-- Motion path -->
  <path d="M 90 172 Q 100 168 110 172 Q 120 176 130 172" stroke="#06B6D4" stroke-width="1" fill="none" stroke-dasharray="2 1"/>
  <text x="107" y="179" font-family="Arial" font-size="3" fill="#06B6D4" text-anchor="middle">Motion Path</text>

  <!-- Explainer Video (bottom right) -->
  <rect x="145" y="130" width="40" height="55" rx="3" fill="none" stroke="#8B5CF6" stroke-width="2"/>
  <text x="165" y="142" font-family="Arial" font-size="6" fill="#8B5CF6" text-anchor="middle" font-weight="bold">VIDEO</text>

  <!-- Video frame -->
  <rect x="150" y="147" width="30" height="28" rx="1" fill="#1E293B" opacity="0.8"/>

  <!-- Character illustration -->
  <circle cx="158" cy="157" r="3" fill="#EC4899" opacity="0.4"/>
  <rect x="155" y="160" width="6" height="8" fill="#EC4899" opacity="0.4"/>

  <!-- Speech bubble -->
  <rect x="165" y="152" width="12" height="8" rx="1" fill="#06B6D4" opacity="0.3"/>
  <text x="171" y="157" font-family="Arial" font-size="3" fill="#06B6D4" text-anchor="middle">Text</text>

  <!-- Icons animated -->
  <circle cx="158" cy="169" r="2" fill="#10B981"/>
  <circle cx="164" cy="169" r="2" fill="#F59E0B"/>
  <circle cx="170" cy="169" r="2" fill="#8B5CF6"/>

  <text x="165" y="181" font-family="Arial" font-size="3" fill="#8B5CF6" text-anchor="middle">Explainer 2:30</text>

  <!-- Easing curve badge (left) -->
  <circle cx="20" cy="95" r="8" fill="none" stroke="#10B981" stroke-width="2"/>
  <path d="M 17 98 Q 20 92 23 98" stroke="#10B981" stroke-width="1.5" fill="none"/>
  <text x="20" y="87" font-family="Arial" font-size="3" fill="#10B981" text-anchor="middle">Easing</text>
  <text x="20" y="108" font-family="Arial" font-size="3" fill="#10B981" text-anchor="middle">Curves</text>

  <!-- FPS indicator (right) -->
  <circle cx="180" cy="95" r="8" fill="#F59E0B" opacity="0.3"/>
  <text x="180" y="98" font-family="Arial" font-size="7" fill="#F59E0B" text-anchor="middle" font-weight="bold">60</text>
  <text x="180" y="87" font-family="Arial" font-size="3" fill="#F59E0B" text-anchor="middle">FPS</text>
  <text x="180" y="108" font-family="Arial" font-size="3" fill="#F59E0B" text-anchor="middle">Smooth</text>

  <!-- Tools badge (top) -->
  <rect x="70" y="5" width="60" height="10" rx="2" fill="#F59E0B" opacity="0.3" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="100" y="12" font-family="Arial" font-size="6" fill="#F59E0B" text-anchor="middle" font-weight="bold">AE • Lottie • Principle</text>

  <!-- "MOTION DESIGNER" text -->
  <text x="100" y="197" font-family="Arial" font-size="10" fill="#F59E0B" text-anchor="middle" font-weight="bold">MOTION DESIGNER</text>
</svg>
