<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Gradient background -->
  <defs>
    <linearGradient id="sysArchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A8A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#sysArchGrad)" opacity="0.1"/>

  <!-- Server racks (left side) -->
  <rect x="20" y="60" width="35" height="80" rx="3" fill="none" stroke="#1E3A8A" stroke-width="2"/>
  <line x1="23" y1="70" x2="52" y2="70" stroke="#1E3A8A" stroke-width="1.5"/>
  <line x1="23" y1="80" x2="52" y2="80" stroke="#1E3A8A" stroke-width="1.5"/>
  <line x1="23" y1="90" x2="52" y2="90" stroke="#1E3A8A" stroke-width="1.5"/>
  <line x1="23" y1="100" x2="52" y2="100" stroke="#1E3A8A" stroke-width="1.5"/>
  <line x1="23" y1="110" x2="52" y2="110" stroke="#1E3A8A" stroke-width="1.5"/>
  <line x1="23" y1="120" x2="52" y2="120" stroke="#1E3A8A" stroke-width="1.5"/>
  <line x1="23" y1="130" x2="52" y2="130" stroke="#1E3A8A" stroke-width="1.5"/>
  <!-- LED indicators on servers -->
  <circle cx="27" cy="75" r="2" fill="#3B82F6"/>
  <circle cx="27" cy="85" r="2" fill="#3B82F6"/>
  <circle cx="27" cy="95" r="2" fill="#10B981"/>
  <circle cx="27" cy="105" r="2" fill="#10B981"/>

  <!-- Cloud infrastructure (top center) -->
  <path d="M 85 35 Q 85 30, 90 30 Q 95 30, 95 25 Q 100 25, 100 30 Q 115 30, 115 35 Q 115 40, 110 40 L 90 40 Q 85 40, 85 35 Z" fill="none" stroke="#3B82F6" stroke-width="2.5"/>
  <text x="100" y="55" font-family="Arial" font-size="9" fill="#3B82F6" text-anchor="middle" font-weight="bold">CLOUD</text>

  <!-- Network diagram (center) -->
  <!-- Central router/switch -->
  <rect x="85" y="85" width="30" height="30" rx="3" fill="#3B82F6" opacity="0.2" stroke="#3B82F6" stroke-width="2"/>
  <line x1="90" y1="95" x2="110" y2="95" stroke="#3B82F6" stroke-width="2"/>
  <line x1="90" y1="105" x2="110" y2="105" stroke="#3B82F6" stroke-width="2"/>
  <circle cx="100" cy="100" r="8" fill="none" stroke="#1E3A8A" stroke-width="2"/>

  <!-- Network connections -->
  <line x1="55" y1="100" x2="85" y2="100" stroke="#3B82F6" stroke-width="2"/>
  <line x1="115" y1="100" x2="145" y2="100" stroke="#3B82F6" stroke-width="2"/>
  <line x1="100" y1="70" x2="100" y2="85" stroke="#3B82F6" stroke-width="2"/>
  <line x1="100" y1="115" x2="100" y2="135" stroke="#3B82F6" stroke-width="2"/>

  <!-- Firewall (right side) -->
  <rect x="145" y="85" width="35" height="30" rx="3" fill="none" stroke="#EF4444" stroke-width="2"/>
  <text x="162" y="103" font-family="Arial" font-size="10" fill="#EF4444" text-anchor="middle" font-weight="bold">FW</text>
  <line x1="150" y1="95" x2="158" y2="95" stroke="#EF4444" stroke-width="2"/>
  <line x1="164" y1="95" x2="172" y2="95" stroke="#EF4444" stroke-width="2"/>
  <line x1="150" y1="105" x2="158" y2="105" stroke="#EF4444" stroke-width="2"/>
  <line x1="164" y1="105" x2="172" y2="105" stroke="#EF4444" stroke-width="2"/>

  <!-- Storage/NAS (bottom) -->
  <rect x="75" y="140" width="50" height="25" rx="3" fill="none" stroke="#10B981" stroke-width="2"/>
  <text x="100" y="155" font-family="Arial" font-size="9" fill="#10B981" text-anchor="middle" font-weight="bold">STORAGE</text>
  <circle cx="85" cy="160" r="2" fill="#10B981"/>
  <circle cx="95" cy="160" r="2" fill="#10B981"/>
  <circle cx="105" cy="160" r="2" fill="#10B981"/>
  <circle cx="115" cy="160" r="2" fill="#10B981"/>

  <!-- VMware/Virtualization icon (bottom left) -->
  <rect x="20" y="155" width="30" height="20" rx="2" fill="none" stroke="#1E3A8A" stroke-width="2"/>
  <line x1="25" y1="160" x2="45" y2="160" stroke="#1E3A8A" stroke-width="1"/>
  <line x1="25" y1="167" x2="45" y2="167" stroke="#1E3A8A" stroke-width="1"/>
  <text x="35" y="157" font-family="Arial" font-size="7" fill="#1E3A8A" text-anchor="middle">VM</text>

  <!-- Kubernetes/Container icon (bottom right) -->
  <circle cx="165" cy="155" r="12" fill="none" stroke="#3B82F6" stroke-width="2"/>
  <polygon points="165,148 170,152 170,158 165,162 160,158 160,152" fill="none" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="165" y="173" font-family="Arial" font-size="7" fill="#3B82F6" text-anchor="middle">K8s</text>

  <!-- Monitoring dashboard (top right) -->
  <rect x="145" y="25" width="40" height="30" rx="3" fill="none" stroke="#10B981" stroke-width="2"/>
  <line x1="150" y1="35" x2="180" y2="35" stroke="#10B981" stroke-width="1"/>
  <line x1="150" y1="38" x2="175" y2="38" stroke="#10B981" stroke-width="1"/>
  <polyline points="152,45 157,42 162,48 167,44 172,50 177,46" fill="none" stroke="#10B981" stroke-width="1.5"/>
  <text x="165" y="32" font-family="Arial" font-size="7" fill="#10B981" text-anchor="middle">Monitor</text>

  <!-- VPN tunnel icon (top left) -->
  <rect x="15" y="25" width="35" height="20" rx="2" fill="none" stroke="#3B82F6" stroke-width="2"/>
  <line x1="20" y1="32" x2="45" y2="32" stroke="#3B82F6" stroke-width="2" stroke-dasharray="3,2"/>
  <line x1="20" y1="38" x2="45" y2="38" stroke="#3B82F6" stroke-width="2" stroke-dasharray="3,2"/>
  <text x="32" y="28" font-family="Arial" font-size="7" fill="#3B82F6" text-anchor="middle">VPN</text>

  <!-- "INFRASTRUCTURE" text -->
  <text x="100" y="195" font-family="Arial" font-size="10" fill="#1E3A8A" text-anchor="middle" font-weight="bold">INFRASTRUCTURE</text>
</svg>
