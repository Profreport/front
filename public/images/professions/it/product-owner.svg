<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Gradient background -->
  <defs>
    <linearGradient id="poGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0891B2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#poGrad)" opacity="0.1"/>

  <!-- Backlog list (main) -->
  <rect x="40" y="30" width="120" height="130" rx="4" fill="none" stroke="#0891B2" stroke-width="3"/>
  <line x1="40" y1="48" x2="160" y2="48" stroke="#0891B2" stroke-width="2"/>
  <text x="100" y="43" font-family="Arial" font-size="9" fill="#0891B2" text-anchor="middle" font-weight="bold">BACKLOG</text>

  <!-- User stories -->
  <rect x="50" y="58" width="100" height="18" rx="3" fill="#10B981" opacity="0.3" stroke="#10B981" stroke-width="2"/>
  <circle cx="58" cy="67" r="3" fill="#10B981"/>
  <text x="70" y="70" font-family="Arial" font-size="8" fill="#10B981" font-weight="bold">User Story #1</text>
  <text x="145" y="70" font-family="Arial" font-size="7" fill="#10B981" font-weight="bold">8sp</text>

  <rect x="50" y="82" width="100" height="18" rx="3" fill="#0891B2" opacity="0.3" stroke="#0891B2" stroke-width="2"/>
  <circle cx="58" cy="91" r="3" fill="#0891B2"/>
  <text x="70" y="94" font-family="Arial" font-size="8" fill="#0891B2" font-weight="bold">User Story #2</text>
  <text x="145" y="94" font-family="Arial" font-size="7" fill="#0891B2" font-weight="bold">5sp</text>

  <rect x="50" y="106" width="100" height="18" rx="3" fill="#0891B2" opacity="0.2" stroke="#0891B2" stroke-width="1.5"/>
  <circle cx="58" cy="115" r="3" fill="none" stroke="#0891B2" stroke-width="1.5"/>
  <text x="70" y="118" font-family="Arial" font-size="8" fill="#0891B2">User Story #3</text>
  <text x="145" y="118" font-family="Arial" font-size="7" fill="#0891B2">3sp</text>

  <rect x="50" y="130" width="100" height="18" rx="3" fill="#0891B2" opacity="0.1" stroke="#0891B2" stroke-width="1"/>
  <circle cx="58" cy="139" r="3" fill="none" stroke="#0891B2" stroke-width="1"/>
  <text x="70" y="142" font-family="Arial" font-size="8" fill="#0891B2" opacity="0.7">Story #4</text>

  <!-- Priority numbers -->
  <text x="32" y="70" font-family="Arial" font-size="10" fill="#10B981" text-anchor="middle" font-weight="bold">1</text>
  <text x="32" y="94" font-family="Arial" font-size="10" fill="#0891B2" text-anchor="middle" font-weight="bold">2</text>
  <text x="32" y="118" font-family="Arial" font-size="9" fill="#0891B2" text-anchor="middle">3</text>

  <!-- Scrum board (bottom left) -->
  <rect x="15" y="170" width="60" height="20" rx="2" fill="none" stroke="#7C3AED" stroke-width="2"/>
  <line x1="35" y1="170" x2="35" y2="190" stroke="#7C3AED" stroke-width="1"/>
  <line x1="55" y1="170" x2="55" y2="190" stroke="#7C3AED" stroke-width="1"/>
  <text x="25" y="182" font-family="Arial" font-size="6" fill="#7C3AED" text-anchor="middle">Todo</text>
  <text x="45" y="182" font-family="Arial" font-size="6" fill="#7C3AED" text-anchor="middle">Doing</text>
  <text x="65" y="182" font-family="Arial" font-size="6" fill="#7C3AED" text-anchor="middle">Done</text>

  <!-- Sprint icon (center bottom) -->
  <circle cx="100" cy="180" r="10" fill="none" stroke="#0891B2" stroke-width="2"/>
  <path d="M 95 176 L 100 180 L 95 184" fill="none" stroke="#0891B2" stroke-width="2"/>
  <path d="M 100 180 L 105 180" stroke="#0891B2" stroke-width="2"/>
  <text x="100" y="195" font-family="Arial" font-size="6" fill="#0891B2" text-anchor="middle">Sprint</text>

  <!-- Acceptance criteria (bottom right) -->
  <rect x="125" y="170" width="60" height="20" rx="2" fill="#10B981" opacity="0.1" stroke="#10B981" stroke-width="2"/>
  <line x1="130" y1="177" x2="135" y2="177" stroke="#10B981" stroke-width="1.5"/>
  <line x1="130" y1="182" x2="135" y2="182" stroke="#10B981" stroke-width="1.5"/>
  <text x="145" y="178" font-family="Arial" font-size="6" fill="#10B981">Criteria</text>
  <circle cx="132" cy="177" r="1.5" fill="#10B981"/>
  <circle cx="132" cy="182" r="1.5" fill="#10B981"/>

  <!-- Team icon (top right) -->
  <circle cx="175" cy="30" r="6" fill="none" stroke="#7C3AED" stroke-width="1.5"/>
  <circle cx="175" cy="28" r="2" fill="#7C3AED"/>
  <path d="M 169 35 Q 175 32, 181 35" fill="none" stroke="#7C3AED" stroke-width="1.5"/>

  <circle cx="190" cy="35" r="6" fill="none" stroke="#7C3AED" stroke-width="1.5"/>
  <circle cx="190" cy="33" r="2" fill="#7C3AED"/>
  <path d="M 184 40 Q 190 37, 196 40" fill="none" stroke="#7C3AED" stroke-width="1.5"/>

  <!-- Stakeholder icon (top left) -->
  <rect x="15" y="25" width="18" height="18" rx="2" fill="none" stroke="#0891B2" stroke-width="2"/>
  <circle cx="24" cy="31" r="3" fill="#0891B2"/>
  <path d="M 19 39 Q 24 36, 29 39" fill="none" stroke="#0891B2" stroke-width="1.5"/>

  <!-- "PRODUCT OWNER" text -->
  <text x="100" y="197" font-family="Arial" font-size="9" fill="#0891B2" text-anchor="middle" font-weight="bold">PRODUCT OWNER</text>
</svg>
