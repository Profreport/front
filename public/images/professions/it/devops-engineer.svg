<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Gradient background -->
  <defs>
    <linearGradient id="devopsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06B6D4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#devopsGrad)" opacity="0.1"/>

  <!-- CI/CD Pipeline (main element) -->
  <rect x="15" y="35" width="170" height="85" rx="4" fill="none" stroke="#06B6D4" stroke-width="3"/>
  <text x="100" y="50" font-family="Arial" font-size="10" fill="#06B6D4" text-anchor="middle" font-weight="bold">CI/CD PIPELINE</text>

  <!-- Pipeline stages -->
  <!-- Stage 1: Code -->
  <rect x="25" y="60" width="30" height="50" rx="2" fill="#8B5CF6" opacity="0.2" stroke="#8B5CF6" stroke-width="2"/>
  <text x="40" y="72" font-family="Arial" font-size="7" fill="#8B5CF6" text-anchor="middle" font-weight="bold">Code</text>
  <rect x="30" y="78" width="20" height="15" rx="1" fill="#1E293B"/>
  <line x1="32" y1="82" x2="47" y2="82" stroke="#8B5CF6" stroke-width="1"/>
  <line x1="32" y1="85" x2="45" y2="85" stroke="#06B6D4" stroke-width="1"/>
  <line x1="32" y1="88" x2="48" y2="88" stroke="#10B981" stroke-width="1"/>
  <circle cx="40" cy="100" r="4" fill="#10B981"/>
  <path d="M 38 100 L 39.5 101.5 L 43 98" fill="none" stroke="#FFF" stroke-width="1.5"/>

  <!-- Arrow 1 -->
  <path d="M 55 85 L 63 85" stroke="#10B981" stroke-width="2" marker-end="url(#arrowDevOps)"/>
  <defs>
    <marker id="arrowDevOps" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <polygon points="0 0, 3 3, 0 6" fill="#10B981"/>
    </marker>
  </defs>

  <!-- Stage 2: Build -->
  <rect x="63" y="60" width="30" height="50" rx="2" fill="#06B6D4" opacity="0.2" stroke="#06B6D4" stroke-width="2"/>
  <text x="78" y="72" font-family="Arial" font-size="7" fill="#06B6D4" text-anchor="middle" font-weight="bold">Build</text>
  <rect x="68" y="78" width="20" height="15" rx="1" fill="#1E293B"/>
  <text x="78" y="87" font-family="Courier" font-size="6" fill="#06B6D4" text-anchor="middle">docker</text>
  <text x="78" y="93" font-family="Courier" font-size="6" fill="#10B981" text-anchor="middle">build</text>
  <circle cx="78" cy="100" r="4" fill="#10B981"/>
  <path d="M 76 100 L 77.5 101.5 L 81 98" fill="none" stroke="#FFF" stroke-width="1.5"/>

  <!-- Arrow 2 -->
  <path d="M 93 85 L 101 85" stroke="#10B981" stroke-width="2" marker-end="url(#arrowDevOps)"/>

  <!-- Stage 3: Test -->
  <rect x="101" y="60" width="30" height="50" rx="2" fill="#10B981" opacity="0.2" stroke="#10B981" stroke-width="2"/>
  <text x="116" y="72" font-family="Arial" font-size="7" fill="#10B981" text-anchor="middle" font-weight="bold">Test</text>
  <circle cx="111" cy="85" r="3" fill="none" stroke="#10B981" stroke-width="1.5"/>
  <path d="M 109 85 L 110.5 86.5 L 113 83" fill="none" stroke="#10B981" stroke-width="1.5"/>
  <circle cx="121" cy="85" r="3" fill="none" stroke="#10B981" stroke-width="1.5"/>
  <path d="M 119 85 L 120.5 86.5 L 123 83" fill="none" stroke="#10B981" stroke-width="1.5"/>
  <text x="116" y="95" font-family="Arial" font-size="5" fill="#10B981" text-anchor="middle">All tests ✓</text>
  <circle cx="116" cy="100" r="4" fill="#10B981"/>
  <path d="M 114 100 L 115.5 101.5 L 119 98" fill="none" stroke="#FFF" stroke-width="1.5"/>

  <!-- Arrow 3 -->
  <path d="M 131 85 L 139 85" stroke="#10B981" stroke-width="2" marker-end="url(#arrowDevOps)"/>

  <!-- Stage 4: Deploy -->
  <rect x="139" y="60" width="38" height="50" rx="2" fill="#F59E0B" opacity="0.2" stroke="#F59E0B" stroke-width="2"/>
  <text x="158" y="72" font-family="Arial" font-size="7" fill="#F59E0B" text-anchor="middle" font-weight="bold">Deploy</text>
  <rect x="145" y="78" width="11" height="12" rx="1" fill="#06B6D4" opacity="0.4"/>
  <rect x="158" y="78" width="11" height="12" rx="1" fill="#06B6D4" opacity="0.4"/>
  <text x="151" y="87" font-family="Arial" font-size="8" fill="#06B6D4" text-anchor="middle">K8s</text>
  <text x="164" y="87" font-family="Arial" font-size="8" fill="#06B6D4" text-anchor="middle">K8s</text>
  <text x="158" y="97" font-family="Arial" font-size="5" fill="#F59E0B" text-anchor="middle">Production</text>
  <circle cx="158" cy="103" r="4" fill="#10B981"/>
  <text x="158" y="107" font-family="Arial" font-size="7" fill="#FFF" text-anchor="middle" font-weight="bold">✓</text>

  <!-- Infrastructure as Code (bottom left) -->
  <rect x="15" y="130" width="55" height="55" rx="3" fill="none" stroke="#8B5CF6" stroke-width="2"/>
  <text x="42" y="142" font-family="Arial" font-size="7" fill="#8B5CF6" text-anchor="middle" font-weight="bold">INFRASTRUCTURE</text>
  <text x="42" y="149" font-family="Arial" font-size="6" fill="#8B5CF6" text-anchor="middle" font-weight="bold">AS CODE</text>

  <!-- Terraform code -->
  <rect x="20" y="155" width="45" height="25" rx="1" fill="#1E293B" opacity="0.8"/>
  <text x="25" y="162" font-family="Courier" font-size="5" fill="#8B5CF6">resource</text>
  <text x="42" y="162" font-family="Courier" font-size="5" fill="#10B981"> "aws"</text>
  <text x="25" y="168" font-family="Courier" font-size="5" fill="#06B6D4">instance_type</text>
  <text x="25" y="174" font-family="Courier" font-size="5" fill="#F59E0B">count = 3</text>
  <text x="25" y="177" font-family="Courier" font-size="4" fill="#9CA3AF"># Terraform</text>

  <!-- Monitoring (bottom center) -->
  <rect x="80" y="130" width="55" height="55" rx="3" fill="#10B981" opacity="0.1" stroke="#10B981" stroke-width="2"/>
  <text x="107" y="142" font-family="Arial" font-size="7" fill="#10B981" text-anchor="middle" font-weight="bold">MONITORING</text>

  <!-- Metrics graph -->
  <line x1="85" y1="175" x2="130" y2="175" stroke="#10B981" stroke-width="1"/>
  <line x1="85" y1="175" x2="85" y2="150" stroke="#10B981" stroke-width="1"/>
  <polyline points="85,172 95,165 105,168 115,155 125,160" fill="none" stroke="#06B6D4" stroke-width="2"/>
  <circle cx="115" cy="155" r="2" fill="#EF4444"/>
  <text x="107" y="152" font-family="Arial" font-size="4" fill="#EF4444">Alert!</text>

  <!-- Prometheus/Grafana icons -->
  <circle cx="92" cy="180" r="3" fill="#F59E0B"/>
  <text x="92" y="180" font-family="Arial" font-size="4" fill="#FFF" text-anchor="middle" font-weight="bold">P</text>
  <rect x="98" y="177" width="6" height="6" rx="1" fill="#06B6D4"/>
  <text x="101" y="181" font-family="Arial" font-size="4" fill="#FFF" text-anchor="middle" font-weight="bold">G</text>

  <!-- Containers (bottom right) -->
  <rect x="145" y="130" width="40" height="55" rx="3" fill="none" stroke="#06B6D4" stroke-width="2"/>
  <text x="165" y="142" font-family="Arial" font-size="7" fill="#06B6D4" text-anchor="middle" font-weight="bold">CONTAINERS</text>

  <!-- Docker containers -->
  <rect x="150" y="148" width="13" height="12" rx="1" fill="#06B6D4" opacity="0.3" stroke="#06B6D4" stroke-width="1"/>
  <text x="156" y="156" font-family="Courier" font-size="5" fill="#06B6D4" text-anchor="middle">api</text>
  <rect x="165" y="148" width="13" height="12" rx="1" fill="#06B6D4" opacity="0.3" stroke="#06B6D4" stroke-width="1"/>
  <text x="171" y="156" font-family="Courier" font-size="5" fill="#06B6D4" text-anchor="middle">web</text>
  <rect x="150" y="163" width="13" height="12" rx="1" fill="#06B6D4" opacity="0.3" stroke="#06B6D4" stroke-width="1"/>
  <text x="156" y="171" font-family="Courier" font-size="5" fill="#06B6D4" text-anchor="middle">db</text>
  <rect x="165" y="163" width="13" height="12" rx="1" fill="#06B6D4" opacity="0.3" stroke="#06B6D4" stroke-width="1"/>
  <text x="171" y="171" font-family="Courier" font-size="5" fill="#06B6D4" text-anchor="middle">job</text>

  <!-- Kubernetes orchestration -->
  <circle cx="165" cy="180" r="3" fill="#8B5CF6" opacity="0.3"/>
  <text x="165" y="182" font-family="Arial" font-size="4" fill="#8B5CF6" text-anchor="middle" font-weight="bold">K8s</text>

  <!-- Docker logo (top left) -->
  <rect x="12" y="20" width="25" height="10" rx="2" fill="#06B6D4" opacity="0.2" stroke="#06B6D4" stroke-width="1.5"/>
  <rect x="16" y="23" width="4" height="3" fill="#06B6D4"/>
  <rect x="21" y="23" width="4" height="3" fill="#06B6D4"/>
  <rect x="26" y="23" width="4" height="3" fill="#06B6D4"/>
  <text x="24" y="16" font-family="Arial" font-size="5" fill="#06B6D4" text-anchor="middle">Docker</text>

  <!-- Cloud provider icons (top right) -->
  <circle cx="168" cy="22" r="5" fill="#F59E0B" opacity="0.3"/>
  <text x="168" y="25" font-family="Arial" font-size="6" fill="#F59E0B" text-anchor="middle" font-weight="bold">AWS</text>
  <circle cx="180" cy="22" r="5" fill="#06B6D4" opacity="0.3"/>
  <text x="180" y="25" font-family="Arial" font-size="6" fill="#06B6D4" text-anchor="middle" font-weight="bold">GCP</text>
  <text x="174" y="14" font-family="Arial" font-size="5" fill="#10B981" text-anchor="middle">Cloud</text>

  <!-- "DEVOPS" text -->
  <text x="100" y="197" font-family="Arial" font-size="11" fill="#06B6D4" text-anchor="middle" font-weight="bold">DEVOPS</text>
</svg>
