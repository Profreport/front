<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Gradient background -->
  <defs>
    <linearGradient id="pmGradIT" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0891B2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366F1;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#pmGradIT)" opacity="0.1"/>

  <!-- Gantt chart (main element) -->
  <rect x="30" y="35" width="140" height="90" rx="4" fill="none" stroke="#0891B2" stroke-width="3"/>
  <line x1="30" y1="50" x2="170" y2="50" stroke="#0891B2" stroke-width="2"/>
  <text x="100" y="46" font-family="Arial" font-size="9" fill="#0891B2" text-anchor="middle" font-weight="bold">PROJECT TIMELINE</text>

  <!-- Timeline grid -->
  <line x1="65" y1="50" x2="65" y2="125" stroke="#0891B2" stroke-width="1" opacity="0.3"/>
  <line x1="100" y1="50" x2="100" y2="125" stroke="#0891B2" stroke-width="1" opacity="0.3"/>
  <line x1="135" y1="50" x2="135" y2="125" stroke="#0891B2" stroke-width="1" opacity="0.3"/>

  <!-- Task bars (Gantt) -->
  <rect x="40" y="60" width="50" height="8" fill="#10B981" opacity="0.7"/>
  <text x="38" y="66" font-family="Arial" font-size="6" fill="#0891B2">Task 1</text>

  <rect x="55" y="72" width="35" height="8" fill="#6366F1" opacity="0.7"/>
  <text x="38" y="78" font-family="Arial" font-size="6" fill="#0891B2">Task 2</text>

  <rect x="45" y="84" width="60" height="8" fill="#F97316" opacity="0.7"/>
  <text x="38" y="90" font-family="Arial" font-size="6" fill="#0891B2">Task 3</text>

  <rect x="70" y="96" width="40" height="8" fill="#10B981" opacity="0.7"/>
  <text x="38" y="102" font-family="Arial" font-size="6" fill="#0891B2">Task 4</text>

  <rect x="85" y="108" width="45" height="8" fill="#EC4899" opacity="0.7"/>
  <text x="38" y="114" font-family="Arial" font-size="6" fill="#0891B2">Task 5</text>

  <!-- Milestones (diamonds) -->
  <path d="M 93 64 L 97 68 L 93 72 L 89 68 Z" fill="#EC4899" stroke="#EC4899" stroke-width="1"/>
  <path d="M 108 88 L 112 92 L 108 96 L 104 92 Z" fill="#10B981" stroke="#10B981" stroke-width="1"/>
  <path d="M 133 112 L 137 116 L 133 120 L 129 116 Z" fill="#6366F1" stroke="#6366F1" stroke-width="1"/>

  <!-- Critical path indicator -->
  <line x1="40" y1="120" x2="130" y2="120" stroke="#EC4899" stroke-width="2" stroke-dasharray="3,3"/>
  <text x="85" y="118" font-family="Arial" font-size="6" fill="#EC4899" font-weight="bold">Critical Path</text>

  <!-- Resource allocation (bottom left) -->
  <rect x="15" y="135" width="50" height="50" rx="3" fill="none" stroke="#6366F1" stroke-width="2"/>
  <text x="40" y="145" font-family="Arial" font-size="7" fill="#6366F1" text-anchor="middle" font-weight="bold">RESOURCES</text>

  <!-- Resource bars -->
  <rect x="20" y="150" width="35" height="5" fill="#10B981" opacity="0.5"/>
  <text x="18" y="154" font-family="Arial" font-size="5" fill="#6366F1">Dev</text>
  <text x="57" y="154" font-family="Arial" font-size="5" fill="#10B981">85%</text>

  <rect x="20" y="158" width="28" height="5" fill="#F97316" opacity="0.5"/>
  <text x="18" y="162" font-family="Arial" font-size="5" fill="#6366F1">QA</text>
  <text x="57" y="162" font-family="Arial" font-size="5" fill="#F97316">68%</text>

  <rect x="20" y="166" width="40" height="5" fill="#EC4899" opacity="0.5"/>
  <text x="18" y="170" font-family="Arial" font-size="5" fill="#6366F1">PM</text>
  <text x="57" y="170" font-family="Arial" font-size="5" fill="#EC4899">95%</text>

  <rect x="20" y="174" width="22" height="5" fill="#0891B2" opacity="0.5"/>
  <text x="18" y="178" font-family="Arial" font-size="5" fill="#6366F1">BA</text>
  <text x="57" y="178" font-family="Arial" font-size="5" fill="#0891B2">52%</text>

  <!-- Budget tracker (bottom center) -->
  <rect x="75" y="135" width="50" height="50" rx="3" fill="#F97316" opacity="0.1" stroke="#F97316" stroke-width="2"/>
  <text x="100" y="145" font-family="Arial" font-size="7" fill="#F97316" text-anchor="middle" font-weight="bold">BUDGET</text>

  <!-- Pie chart -->
  <circle cx="100" cy="163" r="15" fill="none" stroke="#0891B2" stroke-width="12" stroke-dasharray="40 60" transform="rotate(-90 100 163)"/>
  <circle cx="100" cy="163" r="15" fill="none" stroke="#10B981" stroke-width="12" stroke-dasharray="30 70" stroke-dashoffset="-40" transform="rotate(-90 100 163)"/>
  <text x="100" y="167" font-family="Arial" font-size="10" fill="#F97316" text-anchor="middle" font-weight="bold">68%</text>
  <text x="100" y="182" font-family="Arial" font-size="5" fill="#F97316" text-anchor="middle">Spent</text>

  <!-- Risk matrix (bottom right) -->
  <rect x="135" y="135" width="50" height="50" rx="3" fill="none" stroke="#EC4899" stroke-width="2"/>
  <text x="160" y="145" font-family="Arial" font-size="7" fill="#EC4899" text-anchor="middle" font-weight="bold">RISKS</text>

  <!-- Risk grid -->
  <line x1="160" y1="150" x2="160" y2="180" stroke="#EC4899" stroke-width="1"/>
  <line x1="140" y1="165" x2="180" y2="165" stroke="#EC4899" stroke-width="1"/>

  <!-- Risk items -->
  <circle cx="148" cy="157" r="3" fill="#10B981" opacity="0.7"/>
  <circle cx="170" cy="155" r="3" fill="#F97316" opacity="0.7"/>
  <circle cx="168" cy="172" r="3" fill="#EC4899" opacity="0.7"/>
  <circle cx="152" cy="170" r="3" fill="#F97316" opacity="0.7"/>

  <text x="140" y="183" font-family="Arial" font-size="5" fill="#EC4899">Impact →</text>

  <!-- WBS icon (top left) -->
  <rect x="15" y="25" width="12" height="8" rx="1" fill="#6366F1" opacity="0.3"/>
  <rect x="10" y="35" width="8" height="6" rx="1" fill="#6366F1" opacity="0.5"/>
  <rect x="20" y="35" width="8" height="6" rx="1" fill="#6366F1" opacity="0.5"/>
  <line x1="21" y1="33" x2="14" y2="35" stroke="#6366F1" stroke-width="1"/>
  <line x1="21" y1="33" x2="24" y2="35" stroke="#6366F1" stroke-width="1"/>
  <text x="21" y="49" font-family="Arial" font-size="6" fill="#6366F1" text-anchor="middle">WBS</text>

  <!-- Stakeholder icon (top right) -->
  <circle cx="175" cy="30" r="4" fill="none" stroke="#0891B2" stroke-width="1.5"/>
  <circle cx="165" cy="35" r="4" fill="none" stroke="#0891B2" stroke-width="1.5"/>
  <circle cx="185" cy="35" r="4" fill="none" stroke="#0891B2" stroke-width="1.5"/>
  <path d="M 170 40 Q 175 38, 180 40" fill="none" stroke="#0891B2" stroke-width="1.5"/>
  <text x="175" y="50" font-family="Arial" font-size="5" fill="#0891B2" text-anchor="middle">Stakeholders</text>

  <!-- "IT PROJECT MANAGER" text -->
  <text x="100" y="197" font-family="Arial" font-size="9" fill="#0891B2" text-anchor="middle" font-weight="bold">IT PROJECT MANAGER</text>
</svg>
