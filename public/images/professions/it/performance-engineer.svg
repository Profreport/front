<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Gradient background -->
  <defs>
    <linearGradient id="perfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EF4444;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#perfGrad)" opacity="0.1"/>

  <!-- Load Testing Tool (main element - left side) -->
  <rect x="20" y="35" width="75" height="90" rx="4" fill="#1E293B" stroke="#F59E0B" stroke-width="3"/>
  <text x="57" y="52" font-family="Arial" font-size="8" fill="#F59E0B" text-anchor="middle" font-weight="bold">LOAD TEST</text>
  <line x1="20" y1="58" x2="95" y2="58" stroke="#F59E0B" stroke-width="2"/>

  <!-- Virtual users counter -->
  <text x="57" y="72" font-family="Courier" font-size="7" fill="#10B981" text-anchor="middle">Users: 10,000</text>
  <rect x="28" y="76" width="58" height="8" rx="2" fill="none" stroke="#10B981" stroke-width="1"/>
  <rect x="29" y="77" width="50" height="6" rx="1" fill="#10B981"/>

  <!-- Request/Response stats -->
  <text x="28" y="92" font-family="Courier" font-size="6" fill="#06B6D4">Requests/sec: 850</text>
  <text x="28" y="100" font-family="Courier" font-size="6" fill="#F59E0B">Avg latency: 120ms</text>
  <text x="28" y="108" font-family="Courier" font-size="6" fill="#EF4444">Errors: 2.3%</text>

  <!-- Test controls -->
  <rect x="28" y="113" width="25" height="8" rx="2" fill="#10B981"/>
  <text x="40" y="119" font-family="Arial" font-size="5" fill="#FFF" text-anchor="middle" font-weight="bold">RUNNING</text>

  <!-- Performance Graph (right side) -->
  <rect x="105" y="35" width="75" height="90" rx="4" fill="none" stroke="#EF4444" stroke-width="3"/>
  <text x="142" y="48" font-family="Arial" font-size="7" fill="#EF4444" text-anchor="middle" font-weight="bold">RESPONSE TIME</text>

  <!-- Graph axes -->
  <line x1="112" y1="115" x2="172" y2="115" stroke="#EF4444" stroke-width="1"/>
  <line x1="112" y1="58" x2="112" y2="115" stroke="#EF4444" stroke-width="1"/>

  <!-- Response time line graph (showing spike under load) -->
  <polyline points="112,110 120,108 128,105 136,102 144,95 152,75 160,82 168,100 172,102"
            fill="none" stroke="#F59E0B" stroke-width="2.5"/>

  <!-- Peak annotation -->
  <circle cx="152" cy="75" r="3" fill="#EF4444"/>
  <text x="152" y="70" font-family="Arial" font-size="5" fill="#EF4444" text-anchor="middle">Peak</text>

  <!-- Y-axis labels -->
  <text x="108" y="60" font-family="Arial" font-size="4" fill="#EF4444" text-anchor="end">500ms</text>
  <text x="108" y="87" font-family="Arial" font-size="4" fill="#EF4444" text-anchor="end">250ms</text>
  <text x="108" y="116" font-family="Arial" font-size="4" fill="#EF4444" text-anchor="end">0ms</text>

  <!-- X-axis label -->
  <text x="142" y="123" font-family="Arial" font-size="5" fill="#EF4444" text-anchor="middle">Time (minutes)</text>

  <!-- Bottleneck Analysis (bottom left) -->
  <rect x="15" y="135" width="55" height="50" rx="3" fill="none" stroke="#EF4444" stroke-width="2"/>
  <text x="42" y="146" font-family="Arial" font-size="7" fill="#EF4444" text-anchor="middle" font-weight="bold">BOTTLENECKS</text>

  <!-- Warning icons -->
  <circle cx="25" cy="158" r="6" fill="none" stroke="#EF4444" stroke-width="2"/>
  <text x="25" y="162" font-family="Arial" font-size="8" fill="#EF4444" text-anchor="middle" font-weight="bold">!</text>
  <text x="38" y="160" font-family="Arial" font-size="5" fill="#EF4444">DB query slow</text>

  <circle cx="25" cy="172" r="6" fill="none" stroke="#F59E0B" stroke-width="2"/>
  <text x="25" y="176" font-family="Arial" font-size="8" fill="#F59E0B" text-anchor="middle" font-weight="bold">!</text>
  <text x="38" y="174" font-family="Arial" font-size="5" fill="#F59E0B">CPU 95%</text>

  <!-- Metrics Dashboard (bottom center) -->
  <rect x="80" y="135" width="55" height="50" rx="3" fill="#F59E0B" opacity="0.1" stroke="#F59E0B" stroke-width="2"/>
  <text x="107" y="146" font-family="Arial" font-size="7" fill="#F59E0B" text-anchor="middle" font-weight="bold">METRICS</text>

  <!-- Gauge charts -->
  <circle cx="95" cy="162" r="8" fill="none" stroke="#10B981" stroke-width="2" stroke-dasharray="30 80"/>
  <text x="95" y="165" font-family="Arial" font-size="6" fill="#10B981" text-anchor="middle" font-weight="bold">75</text>
  <text x="95" y="173" font-family="Arial" font-size="4" fill="#10B981" text-anchor="middle">RPS</text>

  <circle cx="119" cy="162" r="8" fill="none" stroke="#EF4444" stroke-width="2" stroke-dasharray="45 80"/>
  <text x="119" y="165" font-family="Arial" font-size="6" fill="#EF4444" text-anchor="middle" font-weight="bold">92</text>
  <text x="119" y="173" font-family="Arial" font-size="4" fill="#EF4444" text-anchor="middle">CPU%</text>

  <text x="107" y="181" font-family="Arial" font-size="5" fill="#F59E0B" text-anchor="middle">Latency p95: 450ms</text>

  <!-- Tools (bottom right) -->
  <rect x="145" y="135" width="40" height="50" rx="3" fill="none" stroke="#06B6D4" stroke-width="2"/>
  <text x="165" y="146" font-family="Arial" font-size="7" fill="#06B6D4" text-anchor="middle" font-weight="bold">TOOLS</text>

  <!-- JMeter icon -->
  <rect x="150" y="152" width="30" height="10" rx="2" fill="#EF4444" opacity="0.2" stroke="#EF4444" stroke-width="1"/>
  <text x="165" y="159" font-family="Arial" font-size="6" fill="#EF4444" text-anchor="middle" font-weight="bold">JMeter</text>

  <!-- K6 icon -->
  <rect x="150" y="165" width="30" height="10" rx="2" fill="#8B5CF6" opacity="0.2" stroke="#8B5CF6" stroke-width="1"/>
  <text x="165" y="172" font-family="Arial" font-size="6" fill="#8B5CF6" text-anchor="middle" font-weight="bold">K6</text>

  <!-- Gatling icon -->
  <rect x="150" y="178" width="30" height="6" rx="1" fill="#F59E0B" opacity="0.2" stroke="#F59E0B" stroke-width="1"/>
  <text x="165" y="182" font-family="Arial" font-size="5" fill="#F59E0B" text-anchor="middle">Gatling</text>

  <!-- Server/Load icon (top left) -->
  <rect x="15" y="18" width="25" height="12" rx="2" fill="none" stroke="#F59E0B" stroke-width="1.5"/>
  <line x1="18" y1="22" x2="37" y2="22" stroke="#F59E0B" stroke-width="1"/>
  <line x1="18" y1="25" x2="35" y2="25" stroke="#F59E0B" stroke-width="1"/>
  <circle cx="19" cy="27" r="1" fill="#10B981"/>
  <circle cx="22" cy="27" r="1" fill="#10B981"/>
  <circle cx="25" cy="27" r="1" fill="#EF4444"/>
  <text x="27" y="15" font-family="Arial" font-size="5" fill="#F59E0B" text-anchor="middle">Server Load</text>

  <!-- Stress test icon (top right) -->
  <circle cx="175" cy="22" r="8" fill="none" stroke="#EF4444" stroke-width="2"/>
  <path d="M 169 22 L 175 16 L 181 22 L 175 28 Z" fill="none" stroke="#EF4444" stroke-width="1.5"/>
  <text x="175" y="14" font-family="Arial" font-size="5" fill="#EF4444" text-anchor="middle">Stress</text>

  <!-- "PERFORMANCE ENGINEER" text -->
  <text x="100" y="197" font-family="Arial" font-size="9" fill="#F59E0B" text-anchor="middle" font-weight="bold">PERFORMANCE</text>
</svg>
