<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="infraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F59E0B;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <circle cx="100" cy="100" r="95" fill="url(#infraGrad)" opacity="0.1"/>

  <!-- Blueprint frame -->
  <rect x="25" y="25" width="150" height="120" rx="4" fill="none" stroke="#8B5CF6" stroke-width="3"/>
  <text x="100" y="18" font-family="Arial, sans-serif" font-size="8" fill="#8B5CF6" text-anchor="middle" font-weight="bold">ARCHITECTURE</text>

  <!-- On-premise block -->
  <rect x="35" y="35" width="55" height="45" rx="3" fill="#1E293B" stroke="#06B6D4" stroke-width="2"/>
  <text x="62" y="48" font-family="Arial, sans-serif" font-size="7" fill="#06B6D4" text-anchor="middle" font-weight="bold">ON-PREMISE</text>

  <!-- Servers -->
  <rect x="40" y="53" width="15" height="10" rx="1" fill="#06B6D4" opacity="0.4"/>
  <rect x="58" y="53" width="15" height="10" rx="1" fill="#10B981" opacity="0.4"/>
  <rect x="40" y="66" width="15" height="10" rx="1" fill="#F59E0B" opacity="0.4"/>
  <rect x="58" y="66" width="15" height="10" rx="1" fill="#8B5CF6" opacity="0.4"/>

  <!-- Cloud block -->
  <rect x="110" y="35" width="55" height="45" rx="3" fill="#1E293B" stroke="#10B981" stroke-width="2"/>
  <text x="137" y="48" font-family="Arial, sans-serif" font-size="7" fill="#10B981" text-anchor="middle" font-weight="bold">CLOUD</text>

  <!-- Cloud services -->
  <circle cx="120" cy="60" r="8" fill="#10B981" opacity="0.3" stroke="#10B981" stroke-width="1"/>
  <circle cx="137" cy="60" r="8" fill="#06B6D4" opacity="0.3" stroke="#06B6D4" stroke-width="1"/>
  <circle cx="154" cy="60" r="8" fill="#8B5CF6" opacity="0.3" stroke="#8B5CF6" stroke-width="1"/>

  <!-- Connection line -->
  <line x1="90" y1="57" x2="110" y2="57" stroke="#8B5CF6" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="100" y="53" font-family="Arial, sans-serif" font-size="5" fill="#8B5CF6" text-anchor="middle">VPN</text>

  <!-- DR section -->
  <rect x="35" y="90" width="130" height="45" rx="3" fill="#EF4444" opacity="0.1" stroke="#EF4444" stroke-width="2"/>
  <text x="100" y="103" font-family="Arial, sans-serif" font-size="7" fill="#EF4444" text-anchor="middle" font-weight="bold">DISASTER RECOVERY</text>

  <!-- Primary -->
  <rect x="45" y="108" width="40" height="20" rx="2" fill="#10B981" opacity="0.3" stroke="#10B981" stroke-width="1.5"/>
  <text x="65" y="120" font-family="Arial, sans-serif" font-size="6" fill="#10B981" text-anchor="middle">PRIMARY</text>

  <!-- Arrow -->
  <line x1="90" y1="118" x2="108" y2="118" stroke="#EF4444" stroke-width="2"/>
  <polygon points="108,115 115,118 108,121" fill="#EF4444"/>

  <!-- DR -->
  <rect x="115" y="108" width="40" height="20" rx="2" fill="#F59E0B" opacity="0.3" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="135" y="120" font-family="Arial, sans-serif" font-size="6" fill="#F59E0B" text-anchor="middle">STANDBY</text>

  <!-- Bottom info boxes -->
  <rect x="25" y="150" width="50" height="25" rx="2" fill="#06B6D4" opacity="0.15" stroke="#06B6D4" stroke-width="1.5"/>
  <text x="50" y="166" font-family="Arial, sans-serif" font-size="6" fill="#06B6D4" text-anchor="middle" font-weight="bold">Kubernetes</text>

  <rect x="80" y="150" width="40" height="25" rx="2" fill="#8B5CF6" opacity="0.15" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="100" y="166" font-family="Arial, sans-serif" font-size="6" fill="#8B5CF6" text-anchor="middle" font-weight="bold">Terraform</text>

  <rect x="125" y="150" width="50" height="25" rx="2" fill="#10B981" opacity="0.15" stroke="#10B981" stroke-width="1.5"/>
  <text x="150" y="166" font-family="Arial, sans-serif" font-size="6" fill="#10B981" text-anchor="middle" font-weight="bold">AWS/GCP</text>

  <!-- Title -->
  <text x="100" y="193" font-family="Arial, sans-serif" font-size="10" fill="#8B5CF6" text-anchor="middle" font-weight="bold">INFRA ARCHITECT</text>
</svg>
