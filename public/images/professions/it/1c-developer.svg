<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Gradient background -->
  <defs>
    <linearGradient id="oneСGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD600;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF6B00;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#oneСGrad)" opacity="0.1"/>

  <!-- 1C Logo style - large "1C" -->
  <text x="100" y="85" font-family="Arial Black, Arial" font-size="56" fill="#FFD600" text-anchor="middle" font-weight="bold">1С</text>

  <!-- Enterprise text below -->
  <text x="100" y="105" font-family="Arial" font-size="12" fill="#FF6B00" text-anchor="middle" font-weight="bold">Предприятие</text>

  <!-- Database cylinders (representing data) -->
  <ellipse cx="50" cy="140" rx="18" ry="6" fill="none" stroke="#FFD600" stroke-width="2"/>
  <line x1="32" y1="140" x2="32" y2="155" stroke="#FFD600" stroke-width="2"/>
  <line x1="68" y1="140" x2="68" y2="155" stroke="#FFD600" stroke-width="2"/>
  <ellipse cx="50" cy="155" rx="18" ry="6" fill="#FFD600" opacity="0.3" stroke="#FFD600" stroke-width="2"/>

  <!-- Document/Report icon -->
  <rect x="120" y="130" width="35" height="45" rx="3" fill="none" stroke="#FF6B00" stroke-width="2"/>
  <line x1="127" y1="140" x2="148" y2="140" stroke="#FF6B00" stroke-width="2"/>
  <line x1="127" y1="148" x2="148" y2="148" stroke="#FF6B00" stroke-width="2"/>
  <line x1="127" y1="156" x2="145" y2="156" stroke="#FF6B00" stroke-width="1.5"/>
  <line x1="127" y1="163" x2="145" y2="163" stroke="#FF6B00" stroke-width="1.5"/>

  <!-- Money/Accounting symbols (Ruble sign ₽) -->
  <text x="30" y="40" font-family="Arial" font-size="28" fill="#FFD600" font-weight="bold">₽</text>

  <!-- Chart/Analytics bars (right side) -->
  <rect x="150" y="50" width="8" height="25" rx="2" fill="#FFD600" opacity="0.7"/>
  <rect x="162" y="40" width="8" height="35" rx="2" fill="#FF6B00" opacity="0.7"/>
  <rect x="174" y="45" width="8" height="30" rx="2" fill="#FFD600" opacity="0.7"/>

  <!-- Config/Settings gear hint (top left) -->
  <circle cx="35" cy="65" r="10" fill="none" stroke="#FF6B00" stroke-width="2"/>
  <circle cx="35" cy="65" r="5" fill="none" stroke="#FF6B00" stroke-width="2"/>
  <line x1="35" y1="55" x2="35" y2="58" stroke="#FF6B00" stroke-width="2"/>
  <line x1="35" y1="72" x2="35" y2="75" stroke="#FF6B00" stroke-width="2"/>
  <line x1="45" y1="65" x2="42" y2="65" stroke="#FF6B00" stroke-width="2"/>
  <line x1="28" y1="65" x2="25" y2="65" stroke="#FF6B00" stroke-width="2"/>

  <!-- Bottom text -->
  <text x="100" y="195" font-family="Arial" font-size="10" fill="#FF6B00" text-anchor="middle" font-weight="bold">Бухгалтерия • Учёт • ERP</text>
</svg>
