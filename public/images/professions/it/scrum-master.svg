<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Gradient background -->
  <defs>
    <linearGradient id="scrumGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#scrumGrad)" opacity="0.1"/>

  <!-- Scrum board (main element) -->
  <rect x="30" y="35" width="140" height="90" rx="4" fill="none" stroke="#10B981" stroke-width="3"/>
  <line x1="30" y1="50" x2="170" y2="50" stroke="#10B981" stroke-width="2"/>
  <text x="100" y="46" font-family="Arial" font-size="9" fill="#10B981" text-anchor="middle" font-weight="bold">SCRUM BOARD</text>

  <!-- Columns -->
  <line x1="75" y1="50" x2="75" y2="125" stroke="#10B981" stroke-width="2"/>
  <line x1="123" y1="50" x2="123" y2="125" stroke="#10B981" stroke-width="2"/>

  <!-- Column headers -->
  <text x="52" y="62" font-family="Arial" font-size="8" fill="#10B981" text-anchor="middle" font-weight="bold">TODO</text>
  <text x="99" y="62" font-family="Arial" font-size="8" fill="#06B6D4" text-anchor="middle" font-weight="bold">DOING</text>
  <text x="146" y="62" font-family="Arial" font-size="8" fill="#059669" text-anchor="middle" font-weight="bold">DONE</text>

  <!-- Story cards in TODO -->
  <rect x="35" y="68" width="35" height="14" rx="2" fill="#10B981" opacity="0.2" stroke="#10B981" stroke-width="1"/>
  <text x="38" y="75" font-family="Arial" font-size="6" fill="#10B981" font-weight="bold">US-42</text>
  <text x="38" y="80" font-family="Arial" font-size="5" fill="#10B981">Login page</text>

  <rect x="35" y="85" width="35" height="14" rx="2" fill="#10B981" opacity="0.2" stroke="#10B981" stroke-width="1"/>
  <text x="38" y="92" font-family="Arial" font-size="6" fill="#10B981" font-weight="bold">US-43</text>
  <text x="38" y="97" font-family="Arial" font-size="5" fill="#10B981">Profile</text>

  <!-- Story cards in DOING -->
  <rect x="80" y="68" width="38" height="14" rx="2" fill="#06B6D4" opacity="0.3" stroke="#06B6D4" stroke-width="1"/>
  <text x="83" y="75" font-family="Arial" font-size="6" fill="#06B6D4" font-weight="bold">US-41</text>
  <text x="83" y="80" font-family="Arial" font-size="5" fill="#06B6D4">Dashboard</text>

  <!-- Story cards in DONE -->
  <rect x="128" y="68" width="37" height="14" rx="2" fill="#059669" opacity="0.3" stroke="#059669" stroke-width="1"/>
  <text x="131" y="75" font-family="Arial" font-size="6" fill="#059669" font-weight="bold">US-39</text>
  <text x="131" y="80" font-family="Arial" font-size="5" fill="#059669">API setup</text>

  <rect x="128" y="85" width="37" height="14" rx="2" fill="#059669" opacity="0.3" stroke="#059669" stroke-width="1"/>
  <text x="131" y="92" font-family="Arial" font-size="6" fill="#059669" font-weight="bold">US-40</text>
  <text x="131" y="97" font-family="Arial" font-size="5" fill="#059669">Database</text>

  <rect x="128" y="102" width="37" height="14" rx="2" fill="#059669" opacity="0.3" stroke="#059669" stroke-width="1"/>
  <text x="131" y="109" font-family="Arial" font-size="6" fill="#059669" font-weight="bold">US-38</text>
  <text x="131" y="114" font-family="Arial" font-size="5" fill="#059669">Auth</text>

  <!-- Sprint cycle (bottom left) -->
  <circle cx="45" cy="155" r="20" fill="none" stroke="#10B981" stroke-width="2"/>
  <path d="M 45 135 L 45 155 L 55 145" fill="none" stroke="#10B981" stroke-width="2"/>
  <text x="45" y="180" font-family="Arial" font-size="7" fill="#10B981" text-anchor="middle" font-weight="bold">2-WEEK</text>
  <text x="45" y="188" font-family="Arial" font-size="6" fill="#10B981" text-anchor="middle">SPRINT</text>

  <!-- Daily standup (bottom center-left) -->
  <circle cx="90" cy="148" r="5" fill="none" stroke="#06B6D4" stroke-width="1.5"/>
  <circle cx="90" cy="143" r="2.5" fill="#06B6D4"/>
  <path d="M 83 155 Q 90 152, 97 155" fill="none" stroke="#06B6D4" stroke-width="1.5"/>

  <circle cx="103" cy="148" r="5" fill="none" stroke="#06B6D4" stroke-width="1.5"/>
  <circle cx="103" cy="143" r="2.5" fill="#06B6D4"/>
  <path d="M 96 155 Q 103 152, 110 155" fill="none" stroke="#06B6D4" stroke-width="1.5"/>

  <circle cx="77" cy="148" r="5" fill="none" stroke="#06B6D4" stroke-width="1.5"/>
  <circle cx="77" cy="143" r="2.5" fill="#06B6D4"/>
  <path d="M 70 155 Q 77 152, 84 155" fill="none" stroke="#06B6D4" stroke-width="1.5"/>

  <text x="90" y="167" font-family="Arial" font-size="6" fill="#06B6D4" text-anchor="middle" font-weight="bold">Daily</text>
  <text x="90" y="174" font-family="Arial" font-size="5" fill="#06B6D4" text-anchor="middle">Standup</text>

  <!-- Retrospective (bottom center-right) -->
  <rect x="120" y="140" width="35" height="35" rx="3" fill="none" stroke="#10B981" stroke-width="2"/>
  <text x="137" y="150" font-family="Arial" font-size="7" fill="#10B981" text-anchor="middle" font-weight="bold">RETRO</text>

  <!-- Post-it notes -->
  <rect x="123" y="155" width="12" height="8" fill="#10B981" opacity="0.3"/>
  <rect x="137" y="155" width="12" height="8" fill="#F59E0B" opacity="0.3"/>
  <rect x="123" y="165" width="12" height="8" fill="#06B6D4" opacity="0.3"/>
  <rect x="137" y="165" width="12" height="8" fill="#10B981" opacity="0.3"/>

  <!-- Blocker removal (bottom right) -->
  <circle cx="175" cy="155" r="15" fill="none" stroke="#EF4444" stroke-width="2"/>
  <line x1="168" y1="148" x2="182" y2="162" stroke="#EF4444" stroke-width="3"/>
  <line x1="182" y1="148" x2="168" y2="162" stroke="#EF4444" stroke-width="3"/>
  <text x="175" y="178" font-family="Arial" font-size="6" fill="#EF4444" text-anchor="middle" font-weight="bold">Remove</text>
  <text x="175" y="185" font-family="Arial" font-size="5" fill="#EF4444" text-anchor="middle">Blockers</text>

  <!-- Velocity chart (top left) -->
  <rect x="15" y="30" width="25" height="20" rx="2" fill="none" stroke="#10B981" stroke-width="1.5"/>
  <rect x="18" y="44" width="3" height="4" fill="#10B981" opacity="0.5"/>
  <rect x="22" y="41" width="3" height="7" fill="#10B981" opacity="0.7"/>
  <rect x="26" y="38" width="3" height="10" fill="#10B981"/>
  <rect x="30" y="35" width="3" height="13" fill="#10B981"/>
  <text x="27" y="27" font-family="Arial" font-size="6" fill="#10B981" text-anchor="middle">Velocity</text>

  <!-- Servant leader icon (top right) -->
  <circle cx="180" cy="28" r="6" fill="none" stroke="#06B6D4" stroke-width="1.5"/>
  <circle cx="180" cy="25" r="2.5" fill="#06B6D4"/>
  <path d="M 173 35 Q 180 32, 187 35" fill="none" stroke="#06B6D4" stroke-width="1.5"/>
  <path d="M 175 40 L 175 42 L 178 42" fill="none" stroke="#10B981" stroke-width="1.5"/>
  <path d="M 185 40 L 185 42 L 182 42" fill="none" stroke="#10B981" stroke-width="1.5"/>
  <text x="180" y="50" font-family="Arial" font-size="5" fill="#06B6D4" text-anchor="middle">Servant</text>
  <text x="180" y="56" font-family="Arial" font-size="5" fill="#06B6D4" text-anchor="middle">Leader</text>

  <!-- Sprint goal (top center) -->
  <circle cx="100" cy="20" r="8" fill="none" stroke="#F59E0B" stroke-width="2"/>
  <path d="M 100 15 L 100 20 L 103 17" fill="none" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="100" y="12" font-family="Arial" font-size="6" fill="#F59E0B" text-anchor="middle" font-weight="bold">Sprint Goal</text>

  <!-- "SCRUM MASTER" text -->
  <text x="100" y="197" font-family="Arial" font-size="10" fill="#10B981" text-anchor="middle" font-weight="bold">SCRUM MASTER</text>
</svg>
