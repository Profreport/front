<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Gradient background -->
  <defs>
    <linearGradient id="infosecGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EF4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#infosecGrad)" opacity="0.1"/>

  <!-- Security Shield (main element) -->
  <path d="M 100 30 L 140 45 L 140 75 Q 140 95 100 110 Q 60 95 60 75 L 60 45 Z" fill="none" stroke="#EF4444" stroke-width="3"/>
  <path d="M 100 35 L 135 48 L 135 75 Q 135 92 100 105 Q 65 92 65 75 L 65 48 Z" fill="#EF4444" opacity="0.1"/>

  <!-- Lock icon inside shield -->
  <rect x="92" y="62" width="16" height="12" rx="2" fill="none" stroke="#EF4444" stroke-width="2"/>
  <path d="M 95 62 L 95 58 Q 95 54 100 54 Q 105 54 105 58 L 105 62" fill="none" stroke="#EF4444" stroke-width="2"/>
  <circle cx="100" cy="68" r="2" fill="#EF4444"/>

  <!-- Firewall (left) -->
  <rect x="15" y="50" width="35" height="60" rx="3" fill="none" stroke="#F59E0B" stroke-width="2"/>
  <text x="32" y="62" font-family="Arial" font-size="6" fill="#F59E0B" text-anchor="middle" font-weight="bold">FIREWALL</text>

  <!-- Firewall rules -->
  <line x1="20" y1="70" x2="45" y2="70" stroke="#10B981" stroke-width="2"/>
  <text x="22" y="69" font-family="Arial" font-size="4" fill="#10B981">✓ Allow</text>
  <line x1="20" y1="78" x2="45" y2="78" stroke="#EF4444" stroke-width="2"/>
  <text x="22" y="77" font-family="Arial" font-size="4" fill="#EF4444">✗ Block</text>
  <line x1="20" y1="86" x2="45" y2="86" stroke="#10B981" stroke-width="2"/>
  <text x="22" y="85" font-family="Arial" font-size="4" fill="#10B981">✓ Allow</text>

  <!-- Traffic indicator -->
  <text x="32" y="98" font-family="Arial" font-size="5" fill="#F59E0B" text-anchor="middle">Traffic</text>
  <path d="M 25 100 L 30 100 L 28 98 M 30 100 L 28 102" stroke="#F59E0B" stroke-width="1"/>

  <!-- SIEM / Monitoring (right) -->
  <rect x="150" y="50" width="35" height="60" rx="3" fill="#06B6D4" opacity="0.1" stroke="#06B6D4" stroke-width="2"/>
  <text x="167" y="62" font-family="Arial" font-size="6" fill="#06B6D4" text-anchor="middle" font-weight="bold">SIEM</text>

  <!-- Alert dashboard -->
  <rect x="155" y="68" width="25" height="38" rx="1" fill="#1E293B" opacity="0.8"/>
  <text x="158" y="74" font-family="Arial" font-size="4" fill="#EF4444">⚠ Alert: SSH brute</text>
  <text x="158" y="80" font-family="Arial" font-size="4" fill="#10B981">✓ Normal traffic</text>
  <text x="158" y="86" font-family="Arial" font-size="4" fill="#F59E0B">⚠ Suspicious IP</text>
  <text x="158" y="92" font-family="Arial" font-size="4" fill="#10B981">✓ Patch updated</text>
  <text x="158" y="98" font-family="Arial" font-size="4" fill="#EF4444">⚠ Port scan</text>
  <text x="158" y="104" font-family="Arial" font-size="4" fill="#10B981">✓ Backup OK</text>

  <!-- Compliance & Standards (bottom left) -->
  <rect x="15" y="125" width="55" height="60" rx="3" fill="none" stroke="#8B5CF6" stroke-width="2"/>
  <text x="42" y="137" font-family="Arial" font-size="7" fill="#8B5CF6" text-anchor="middle" font-weight="bold">COMPLIANCE</text>

  <!-- Standards badges -->
  <rect x="20" y="145" width="20" height="10" rx="1" fill="#8B5CF6" opacity="0.3" stroke="#8B5CF6" stroke-width="1"/>
  <text x="30" y="152" font-family="Arial" font-size="5" fill="#8B5CF6" text-anchor="middle" font-weight="bold">ISO 27001</text>

  <rect x="45" y="145" width="20" height="10" rx="1" fill="#06B6D4" opacity="0.3" stroke="#06B6D4" stroke-width="1"/>
  <text x="55" y="152" font-family="Arial" font-size="5" fill="#06B6D4" text-anchor="middle" font-weight="bold">GDPR</text>

  <rect x="20" y="160" width="20" height="10" rx="1" fill="#10B981" opacity="0.3" stroke="#10B981" stroke-width="1"/>
  <text x="30" y="167" font-family="Arial" font-size="5" fill="#10B981" text-anchor="middle" font-weight="bold">152-ФЗ</text>

  <rect x="45" y="160" width="20" height="10" rx="1" fill="#F59E0B" opacity="0.3" stroke="#F59E0B" stroke-width="1"/>
  <text x="55" y="167" font-family="Arial" font-size="5" fill="#F59E0B" text-anchor="middle" font-weight="bold">PCI DSS</text>

  <!-- Audit checklist -->
  <text x="20" y="178" font-family="Arial" font-size="4" fill="#10B981">✓ Security audit done</text>
  <text x="20" y="183" font-family="Arial" font-size="4" fill="#8B5CF6">○ Certification review</text>

  <!-- Risk Management (bottom center) -->
  <rect x="80" y="125" width="55" height="60" rx="3" fill="#EF4444" opacity="0.1" stroke="#EF4444" stroke-width="2"/>
  <text x="107" y="137" font-family="Arial" font-size="7" fill="#EF4444" text-anchor="middle" font-weight="bold">RISK MGT</text>

  <!-- Risk matrix -->
  <rect x="85" y="145" width="45" height="35" rx="1" fill="none" stroke="#EF4444" stroke-width="1"/>

  <!-- High risk -->
  <rect x="87" y="147" width="12" height="10" fill="#EF4444" opacity="0.6"/>
  <text x="93" y="154" font-family="Arial" font-size="4" fill="#FFF" text-anchor="middle">HIGH</text>

  <!-- Medium risk -->
  <rect x="101" y="147" width="12" height="10" fill="#F59E0B" opacity="0.6"/>
  <text x="107" y="154" font-family="Arial" font-size="4" fill="#FFF" text-anchor="middle">MED</text>

  <!-- Low risk -->
  <rect x="115" y="147" width="12" height="10" fill="#10B981" opacity="0.6"/>
  <text x="121" y="154" font-family="Arial" font-size="4" fill="#FFF" text-anchor="middle">LOW</text>

  <!-- Risk items -->
  <text x="87" y="165" font-family="Arial" font-size="4" fill="#EF4444">⚠ Outdated SSL cert</text>
  <text x="87" y="170" font-family="Arial" font-size="4" fill="#F59E0B">○ Weak passwords</text>
  <text x="87" y="175" font-family="Arial" font-size="4" fill="#10B981">✓ Backups tested</text>

  <!-- Security Training (bottom right) -->
  <rect x="145" y="125" width="40" height="60" rx="3" fill="none" stroke="#10B981" stroke-width="2"/>
  <text x="165" y="137" font-family="Arial" font-size="6" fill="#10B981" text-anchor="middle" font-weight="bold">TRAINING</text>

  <!-- Users training -->
  <circle cx="155" cy="150" r="4" fill="#10B981" opacity="0.3"/>
  <text x="155" y="152" font-family="Arial" font-size="5" fill="#10B981" text-anchor="middle">👤</text>
  <circle cx="165" cy="150" r="4" fill="#10B981" opacity="0.3"/>
  <text x="165" y="152" font-family="Arial" font-size="5" fill="#10B981" text-anchor="middle">👤</text>
  <circle cx="175" cy="150" r="4" fill="#10B981" opacity="0.3"/>
  <text x="175" y="152" font-family="Arial" font-size="5" fill="#10B981" text-anchor="middle">👤</text>

  <text x="165" y="162" font-family="Arial" font-size="5" fill="#10B981" text-anchor="middle">Security</text>
  <text x="165" y="168" font-family="Arial" font-size="5" fill="#10B981" text-anchor="middle">Awareness</text>

  <!-- Phishing test -->
  <text x="150" y="177" font-family="Arial" font-size="4" fill="#F59E0B">Phishing test:</text>
  <text x="150" y="182" font-family="Arial" font-size="4" fill="#10B981">85% success</text>

  <!-- Attack types (top) -->
  <rect x="55" y="15" width="90" height="10" rx="2" fill="#EF4444" opacity="0.2" stroke="#EF4444" stroke-width="1"/>
  <text x="100" y="22" font-family="Arial" font-size="5" fill="#EF4444" text-anchor="middle">Threats: Phishing, Malware, DDoS, SQL Injection</text>

  <!-- Security posture indicator (top left) -->
  <circle cx="20" cy="25" r="8" fill="none" stroke="#10B981" stroke-width="2"/>
  <text x="20" y="28" font-family="Arial" font-size="6" fill="#10B981" text-anchor="middle" font-weight="bold">✓</text>
  <text x="20" y="16" font-family="Arial" font-size="4" fill="#10B981" text-anchor="middle">Secure</text>

  <!-- Incident count (top right) -->
  <circle cx="180" cy="25" r="8" fill="#F59E0B" opacity="0.3"/>
  <text x="180" y="28" font-family="Arial" font-size="6" fill="#F59E0B" text-anchor="middle" font-weight="bold">3</text>
  <text x="180" y="16" font-family="Arial" font-size="4" fill="#F59E0B" text-anchor="middle">Incidents</text>

  <!-- "INFO SECURITY" text -->
  <text x="100" y="197" font-family="Arial" font-size="8" fill="#EF4444" text-anchor="middle" font-weight="bold">INFORMATION SECURITY</text>
</svg>
