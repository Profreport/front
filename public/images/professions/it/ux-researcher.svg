<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Gradient background -->
  <defs>
    <linearGradient id="uxresearchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06B6D4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#uxresearchGrad)" opacity="0.1"/>

  <!-- User Interview (center) -->
  <rect x="60" y="50" width="80" height="70" rx="3" fill="#1E293B" opacity="0.9" stroke="#06B6D4" stroke-width="3"/>
  <text x="100" y="45" font-family="Arial" font-size="7" fill="#06B6D4" text-anchor="middle" font-weight="bold">USER INTERVIEW</text>

  <!-- Interviewer and User -->
  <circle cx="80" cy="70" r="8" fill="#06B6D4" opacity="0.3"/>
  <text x="80" y="73" font-family="Arial" font-size="10" fill="#06B6D4" text-anchor="middle">👤</text>
  <text x="80" y="83" font-family="Arial" font-size="4" fill="#06B6D4" text-anchor="middle">Researcher</text>

  <circle cx="120" cy="70" r="8" fill="#10B981" opacity="0.3"/>
  <text x="120" y="73" font-family="Arial" font-size="10" fill="#10B981" text-anchor="middle">👤</text>
  <text x="120" y="83" font-family="Arial" font-size="4" fill="#10B981" text-anchor="middle">User</text>

  <!-- Interview questions -->
  <rect x="65" y="90" width="70" height="25" rx="1" fill="#0F172A"/>
  <text x="68" y="96" font-family="Arial" font-size="4" fill="#06B6D4">Q: How do you currently...</text>
  <text x="68" y="101" font-family="Arial" font-size="4" fill="#10B981">A: I usually struggle with...</text>
  <text x="68" y="106" font-family="Arial" font-size="4" fill="#06B6D4">Q: What frustrates you most?</text>
  <text x="68" y="111" font-family="Arial" font-size="4" fill="#10B981">A: The process is confusing...</text>

  <!-- Recording indicator -->
  <circle cx="130" cy="55" r="2" fill="#EF4444"/>
  <text x="135" y="57" font-family="Arial" font-size="3" fill="#EF4444">REC</text>

  <!-- Survey (top left) -->
  <rect x="15" y="15" width="40" height="55" rx="3" fill="none" stroke="#8B5CF6" stroke-width="2"/>
  <text x="35" y="10" font-family="Arial" font-size="6" fill="#8B5CF6" text-anchor="middle" font-weight="bold">SURVEY</text>

  <!-- Survey questions -->
  <rect x="20" y="20" width="30" height="45" rx="1" fill="#1E293B" opacity="0.8"/>
  <text x="22" y="26" font-family="Arial" font-size="4" fill="#8B5CF6">Satisfaction: 1-5</text>
  <circle cx="25" cy="30" r="1.5" fill="#10B981"/>
  <circle cx="29" cy="30" r="1.5" fill="#10B981"/>
  <circle cx="33" cy="30" r="1.5" fill="#10B981"/>
  <circle cx="37" cy="30" r="1.5" fill="#D1D5DB"/>
  <circle cx="41" cy="30" r="1.5" fill="#D1D5DB"/>

  <text x="22" y="38" font-family="Arial" font-size="4" fill="#8B5CF6">Ease of use: 1-5</text>
  <circle cx="25" cy="42" r="1.5" fill="#10B981"/>
  <circle cx="29" cy="42" r="1.5" fill="#10B981"/>
  <circle cx="33" cy="42" r="1.5" fill="#10B981"/>
  <circle cx="37" cy="42" r="1.5" fill="#10B981"/>
  <circle cx="41" cy="42" r="1.5" fill="#D1D5DB"/>

  <text x="22" y="50" font-family="Arial" font-size="4" fill="#8B5CF6">Would recommend?</text>
  <rect x="22" y="52" width="8" height="4" rx="0.5" fill="#10B981"/>
  <text x="26" y="55" font-family="Arial" font-size="3" fill="#FFF" text-anchor="middle">Yes</text>
  <rect x="32" y="52" width="8" height="4" rx="0.5" fill="#D1D5DB"/>
  <text x="36" y="55" font-family="Arial" font-size="3" fill="#6B7280" text-anchor="middle">No</text>

  <text x="22" y="62" font-family="Arial" font-size="3" fill="#10B981">250 responses</text>

  <!-- Analytics (top right) -->
  <rect x="145" y="15" width="40" height="55" rx="3" fill="#F59E0B" opacity="0.1" stroke="#F59E0B" stroke-width="2"/>
  <text x="165" y="10" font-family="Arial" font-size="6" fill="#F59E0B" text-anchor="middle" font-weight="bold">ANALYTICS</text>

  <!-- Analytics charts -->
  <rect x="150" y="20" width="30" height="25" rx="1" fill="#1E293B" opacity="0.8"/>
  <!-- Bar chart -->
  <rect x="152" y="35" width="3" height="8" fill="#10B981"/>
  <rect x="156" y="30" width="3" height="13" fill="#06B6D4"/>
  <rect x="160" y="32" width="3" height="11" fill="#8B5CF6"/>
  <rect x="164" y="28" width="3" height="15" fill="#F59E0B"/>
  <rect x="168" y="33" width="3" height="10" fill="#10B981"/>
  <text x="165" y="25" font-family="Arial" font-size="3" fill="#F59E0B" text-anchor="middle">User Behavior</text>

  <!-- Metrics -->
  <text x="152" y="52" font-family="Arial" font-size="4" fill="#10B981">Conv: 23.5%</text>
  <text x="152" y="58" font-family="Arial" font-size="4" fill="#06B6D4">Time: 3:45</text>
  <text x="152" y="64" font-family="Arial" font-size="4" fill="#EF4444">Drop: 45%</text>

  <!-- Usability Test (bottom left) -->
  <rect x="15" y="130" width="55" height="55" rx="3" fill="none" stroke="#10B981" stroke-width="2"/>
  <text x="42" y="125" font-family="Arial" font-size="6" fill="#10B981" text-anchor="middle" font-weight="bold">USABILITY TEST</text>

  <!-- Test participant -->
  <circle cx="35" cy="145" r="6" fill="#10B981" opacity="0.3"/>
  <text x="35" y="148" font-family="Arial" font-size="8" fill="#10B981" text-anchor="middle">👤</text>
  <text x="35" y="156" font-family="Arial" font-size="3" fill="#10B981" text-anchor="middle">Participant #5</text>

  <!-- Task scenario -->
  <rect x="20" y="160" width="45" height="20" rx="1" fill="#1E293B" opacity="0.8"/>
  <text x="22" y="165" font-family="Arial" font-size="3" fill="#10B981">Task: Find and book</text>
  <text x="22" y="169" font-family="Arial" font-size="3" fill="#10B981">a hotel in Moscow</text>
  <text x="22" y="174" font-family="Arial" font-size="4" fill="#10B981" font-weight="bold">✓ Completed</text>
  <text x="22" y="178" font-family="Arial" font-size="3" fill="#06B6D4">Time: 2:15 (target 3:00)</text>

  <!-- Personas (bottom center) -->
  <rect x="80" y="130" width="55" height="55" rx="3" fill="#EC4899" opacity="0.1" stroke="#EC4899" stroke-width="2"/>
  <text x="107" y="125" font-family="Arial" font-size="6" fill="#EC4899" text-anchor="middle" font-weight="bold">PERSONAS</text>

  <!-- Persona 1 -->
  <circle cx="92" cy="145" r="5" fill="#EC4899" opacity="0.3"/>
  <text x="92" y="147" font-family="Arial" font-size="6" fill="#EC4899" text-anchor="middle">👤</text>
  <text x="92" y="155" font-family="Arial" font-size="4" fill="#EC4899" text-anchor="middle" font-weight="bold">Anna</text>
  <text x="92" y="159" font-family="Arial" font-size="3" fill="#6B7280" text-anchor="middle">28, Manager</text>
  <text x="92" y="163" font-family="Arial" font-size="2" fill="#6B7280" text-anchor="middle">Tech-savvy</text>

  <!-- Persona 2 -->
  <circle cx="122" cy="145" r="5" fill="#8B5CF6" opacity="0.3"/>
  <text x="122" y="147" font-family="Arial" font-size="6" fill="#8B5CF6" text-anchor="middle">👤</text>
  <text x="122" y="155" font-family="Arial" font-size="4" fill="#8B5CF6" text-anchor="middle" font-weight="bold">Boris</text>
  <text x="122" y="159" font-family="Arial" font-size="3" fill="#6B7280" text-anchor="middle">52, Engineer</text>
  <text x="122" y="163" font-family="Arial" font-size="2" fill="#6B7280" text-anchor="middle">Conservative</text>

  <!-- Journey map -->
  <text x="85" y="173" font-family="Arial" font-size="4" fill="#EC4899">Journey:</text>
  <circle cx="88" cy="177" r="1.5" fill="#10B981"/>
  <line x1="89.5" y1="177" x2="94.5" y2="177" stroke="#10B981" stroke-width="1"/>
  <circle cx="96" cy="177" r="1.5" fill="#10B981"/>
  <line x1="97.5" y1="177" x2="102.5" y2="177" stroke="#F59E0B" stroke-width="1"/>
  <circle cx="104" cy="177" r="1.5" fill="#EF4444"/>
  <line x1="105.5" y1="177" x2="110.5" y2="177" stroke="#EF4444" stroke-width="1"/>
  <circle cx="112" cy="177" r="1.5" fill="#F59E0B"/>
  <line x1="113.5" y1="177" x2="118.5" y2="177" stroke="#10B981" stroke-width="1"/>
  <circle cx="120" cy="177" r="1.5" fill="#10B981"/>

  <!-- Insights (bottom right) -->
  <rect x="145" y="130" width="40" height="55" rx="3" fill="none" stroke="#06B6D4" stroke-width="2"/>
  <text x="165" y="125" font-family="Arial" font-size="6" fill="#06B6D4" text-anchor="middle" font-weight="bold">INSIGHTS</text>

  <!-- Insight notes -->
  <rect x="150" y="135" width="30" height="45" rx="1" fill="#1E293B" opacity="0.8"/>
  <circle cx="153" cy="140" r="1" fill="#EF4444"/>
  <text x="156" y="142" font-family="Arial" font-size="3" fill="#EF4444">Critical: Search</text>
  <text x="156" y="146" font-family="Arial" font-size="3" fill="#EF4444">is confusing</text>

  <circle cx="153" cy="152" r="1" fill="#F59E0B"/>
  <text x="156" y="154" font-family="Arial" font-size="3" fill="#F59E0B">Medium: Unclear</text>
  <text x="156" y="158" font-family="Arial" font-size="3" fill="#F59E0B">pricing</text>

  <circle cx="153" cy="164" r="1" fill="#10B981"/>
  <text x="156" y="166" font-family="Arial" font-size="3" fill="#10B981">Positive: Fast</text>
  <text x="156" y="170" font-family="Arial" font-size="3" fill="#10B981">checkout</text>

  <text x="165" y="178" font-family="Arial" font-size="3" fill="#06B6D4" text-anchor="middle">Based on 15 tests</text>

  <!-- Research methods badge (left) -->
  <circle cx="20" cy="90" r="8" fill="none" stroke="#06B6D4" stroke-width="2"/>
  <text x="20" y="93" font-family="Arial" font-size="6" fill="#06B6D4" text-anchor="middle" font-weight="bold">🔍</text>
  <text x="20" y="103" font-family="Arial" font-size="3" fill="#06B6D4" text-anchor="middle">Methods</text>

  <!-- Sample size (right) -->
  <circle cx="180" cy="90" r="8" fill="#10B981" opacity="0.3"/>
  <text x="180" y="93" font-family="Arial" font-size="6" fill="#10B981" text-anchor="middle" font-weight="bold">N</text>
  <text x="180" y="83" font-family="Arial" font-size="3" fill="#10B981" text-anchor="middle">Sample</text>
  <text x="180" y="103" font-family="Arial" font-size="3" fill="#10B981" text-anchor="middle">n=250</text>

  <!-- Research process badge (top) -->
  <rect x="70" y="5" width="60" height="8" rx="2" fill="#06B6D4" opacity="0.2" stroke="#06B6D4" stroke-width="1"/>
  <text x="100" y="11" font-family="Arial" font-size="5" fill="#06B6D4" text-anchor="middle" font-weight="bold">Research → Insights → Action</text>

  <!-- "UX RESEARCHER" text -->
  <text x="100" y="197" font-family="Arial" font-size="11" fill="#06B6D4" text-anchor="middle" font-weight="bold">UX RESEARCHER</text>
</svg>
