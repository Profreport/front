<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Gradient background -->
  <defs>
    <linearGradient id="embeddedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066CC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00D4FF;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#embeddedGrad)" opacity="0.1"/>

  <!-- Microcontroller chip (DIP package) -->
  <rect x="70" y="70" width="60" height="60" rx="4" fill="#0066CC" opacity="0.3" stroke="#0066CC" stroke-width="3"/>

  <!-- Chip label -->
  <text x="100" y="95" font-family="Courier" font-size="10" fill="#0066CC" text-anchor="middle" font-weight="bold">STM32</text>
  <text x="100" y="110" font-family="Courier" font-size="8" fill="#0066CC" text-anchor="middle">ARM</text>

  <!-- Chip pins (left side) -->
  <line x1="70" y1="75" x2="60" y2="75" stroke="#0066CC" stroke-width="2"/>
  <line x1="70" y1="85" x2="60" y2="85" stroke="#0066CC" stroke-width="2"/>
  <line x1="70" y1="95" x2="60" y2="95" stroke="#0066CC" stroke-width="2"/>
  <line x1="70" y1="105" x2="60" y2="105" stroke="#0066CC" stroke-width="2"/>
  <line x1="70" y1="115" x2="60" y2="115" stroke="#0066CC" stroke-width="2"/>
  <line x1="70" y1="125" x2="60" y2="125" stroke="#0066CC" stroke-width="2"/>

  <!-- Chip pins (right side) -->
  <line x1="130" y1="75" x2="140" y2="75" stroke="#0066CC" stroke-width="2"/>
  <line x1="130" y1="85" x2="140" y2="85" stroke="#0066CC" stroke-width="2"/>
  <line x1="130" y1="95" x2="140" y2="95" stroke="#0066CC" stroke-width="2"/>
  <line x1="130" y1="105" x2="140" y2="105" stroke="#0066CC" stroke-width="2"/>
  <line x1="130" y1="115" x2="140" y2="115" stroke="#0066CC" stroke-width="2"/>
  <line x1="130" y1="125" x2="140" y2="125" stroke="#0066CC" stroke-width="2"/>

  <!-- PCB traces (circuit board lines) -->
  <path d="M 140 75 L 155 75 L 155 85" fill="none" stroke="#00D4FF" stroke-width="2"/>
  <path d="M 140 95 L 150 95 L 150 110" fill="none" stroke="#00D4FF" stroke-width="2"/>
  <circle cx="155" cy="85" r="3" fill="#00D4FF"/>
  <circle cx="150" cy="110" r="3" fill="#00D4FF"/>

  <!-- Oscilloscope waveform (top right) -->
  <rect x="145" y="25" width="45" height="30" rx="3" fill="none" stroke="#0066CC" stroke-width="2"/>
  <path d="M 148 40 L 155 40 L 160 32 L 165 48 L 170 32 L 175 40 L 187 40" fill="none" stroke="#00D4FF" stroke-width="2"/>

  <!-- JTAG debugger connector (top left) -->
  <rect x="10" y="30" width="25" height="20" rx="2" fill="none" stroke="#0066CC" stroke-width="2"/>
  <circle cx="17" cy="37" r="2" fill="#0066CC"/>
  <circle cx="23" cy="37" r="2" fill="#0066CC"/>
  <circle cx="28" cy="37" r="2" fill="#0066CC"/>
  <circle cx="17" cy="43" r="2" fill="#0066CC"/>
  <circle cx="23" cy="43" r="2" fill="#0066CC"/>
  <circle cx="28" cy="43" r="2" fill="#0066CC"/>
  <text x="22" y="62" font-family="Arial" font-size="8" fill="#0066CC" text-anchor="middle">JTAG</text>

  <!-- Sensor/LED symbols -->
  <circle cx="30" cy="100" r="10" fill="none" stroke="#00D4FF" stroke-width="2"/>
  <circle cx="30" cy="100" r="5" fill="#00D4FF" opacity="0.3"/>
  <text x="30" y="125" font-family="Arial" font-size="7" fill="#00D4FF" text-anchor="middle">SENSOR</text>

  <!-- Binary/Hex code -->
  <text x="15" y="155" font-family="Courier" font-size="9" fill="#0066CC" opacity="0.7">0x4F</text>
  <text x="15" y="167" font-family="Courier" font-size="9" fill="#0066CC" opacity="0.7">0xA3</text>

  <!-- C programming language hint -->
  <circle cx="165" cy="155" r="18" fill="#0066CC" opacity="0.2"/>
  <text x="165" y="165" font-family="Arial" font-size="28" fill="#0066CC" text-anchor="middle" font-weight="bold">C</text>

  <!-- GPIO pins label -->
  <rect x="145" y="105" width="45" height="22" rx="2" fill="none" stroke="#00D4FF" stroke-width="2"/>
  <text x="167" y="113" font-family="Courier" font-size="7" fill="#00D4FF" text-anchor="middle">GPIO</text>
  <line x1="150" y1="118" x2="153" y2="118" stroke="#00D4FF" stroke-width="1.5"/>
  <line x1="156" y1="118" x2="159" y2="118" stroke="#00D4FF" stroke-width="1.5"/>
  <line x1="162" y1="118" x2="165" y2="118" stroke="#00D4FF" stroke-width="1.5"/>
  <line x1="168" y1="118" x2="171" y2="118" stroke="#00D4FF" stroke-width="1.5"/>
  <line x1="174" y1="118" x2="177" y2="118" stroke="#00D4FF" stroke-width="1.5"/>
  <line x1="180" y1="118" x2="183" y2="118" stroke="#00D4FF" stroke-width="1.5"/>

  <!-- IoT symbol (bottom center) -->
  <circle cx="100" cy="165" r="8" fill="none" stroke="#00D4FF" stroke-width="2"/>
  <circle cx="85" cy="175" r="5" fill="none" stroke="#00D4FF" stroke-width="1.5"/>
  <circle cx="115" cy="175" r="5" fill="none" stroke="#00D4FF" stroke-width="1.5"/>
  <line x1="92" y1="168" x2="85" y2="171" stroke="#00D4FF" stroke-width="1.5"/>
  <line x1="108" y1="168" x2="115" y2="171" stroke="#00D4FF" stroke-width="1.5"/>

  <!-- "EMBEDDED" text -->
  <text x="100" y="195" font-family="Arial" font-size="11" fill="#0066CC" text-anchor="middle" font-weight="bold">EMBEDDED</text>
</svg>
