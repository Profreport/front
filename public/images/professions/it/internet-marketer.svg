  <text x="165" y="162" font-family="Arial" font-size="3" fill="#06B6D4" text-anchor="middle">+46% прирост</text>

  <!-- Test stats -->
  <text x="152" y="168" font-family="Arial" font-size="2" fill="#6B7280">Достоверность:</text>
  <text x="165" y="173" font-family="Arial" font-size="4" fill="#10B981" text-anchor="middle" font-weight="bold">95%</text>
  <text x="152" y="178" font-family="Arial" font-size="2" fill="#6B7280">Sample: 5,240</text>

