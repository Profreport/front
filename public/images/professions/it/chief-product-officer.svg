<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Gradient background -->
  <defs>
    <linearGradient id="cpoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fc5c65;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fd9644;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#cpoGrad)" opacity="0.1"/>

  <!-- Strategic dashboard/board -->
  <rect x="35" y="35" width="130" height="90" rx="8" fill="white" stroke="#fc5c65" stroke-width="2"/>
  
  <!-- Dashboard title bars -->
  <rect x="35" y="35" width="130" height="15" rx="8" fill="#fc5c65"/>
  <circle cx="45" cy="42" r="2.5" fill="white"/>
  <circle cx="53" cy="42" r="2.5" fill="white"/>
  <circle cx="61" cy="42" r="2.5" fill="white"/>

  <!-- Growth chart (upward trend) -->
  <polyline points="50,95 65,85 80,90 95,70 110,75 125,55 140,60" 
            fill="none" stroke="#fc5c65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="50" cy="95" r="3" fill="#fc5c65"/>
  <circle cx="65" cy="85" r="3" fill="#fc5c65"/>
  <circle cx="80" cy="90" r="3" fill="#fc5c65"/>
  <circle cx="95" cy="70" r="3" fill="#fc5c65"/>
  <circle cx="110" cy="75" r="3" fill="#fc5c65"/>
  <circle cx="125" cy="55" r="3" fill="#fc5c65"/>
  <circle cx="140" cy="60" r="3" fill="#fc5c65"/>

  <!-- Chart bars -->
  <rect x="50" y="105" width="8" height="15" fill="#fc5c65" opacity="0.3" rx="2"/>
  <rect x="70" y="100" width="8" height="20" fill="#fc5c65" opacity="0.5" rx="2"/>
  <rect x="90" y="95" width="8" height="25" fill="#fc5c65" opacity="0.7" rx="2"/>
  <rect x="110" y="90" width="8" height="30" fill="#fc5c65" opacity="0.9" rx="2"/>

  <!-- Target/Goal icon -->
  <circle cx="45" cy="155" r="22" fill="none" stroke="#fc5c65" stroke-width="2"/>
  <circle cx="45" cy="155" r="15" fill="none" stroke="#fc5c65" stroke-width="2"/>
  <circle cx="45" cy="155" r="8" fill="none" stroke="#fc5c65" stroke-width="2"/>
  <circle cx="45" cy="155" r="3" fill="#fc5c65"/>

  <!-- Product icon (mobile device) -->
  <rect x="95" y="140" width="40" height="55" rx="5" fill="white" stroke="#fd9644" stroke-width="2"/>
  <line x1="105" y1="147" x2="125" y2="147" stroke="#fd9644" stroke-width="2" stroke-linecap="round"/>
  <rect x="100" y="152" width="30" height="35" rx="2" fill="#fd9644" opacity="0.2"/>
  <circle cx="115" cy="190" r="2.5" fill="#fd9644"/>

  <!-- Team/People icons -->
  <circle cx="155" cy="145" r="8" fill="#fc5c65" opacity="0.7"/>
  <path d="M 155 153 Q 147 158 147 165 L 163 165 Q 163 158 155 153" fill="#fc5c65" opacity="0.7"/>
  
  <circle cx="170" cy="150" r="7" fill="#fc5c65" opacity="0.5"/>
  <path d="M 170 157 Q 164 161 164 167 L 176 167 Q 176 161 170 157" fill="#fc5c65" opacity="0.5"/>
  
  <circle cx="178" cy="158" r="6" fill="#fc5c65" opacity="0.3"/>
  <path d="M 178 164 Q 173 167 173 172 L 183 172 Q 183 167 178 164" fill="#fc5c65" opacity="0.3"/>

  <!-- Crown symbol (leadership) -->
  <path d="M 80 165 L 85 175 L 90 170 L 95 175 L 100 170 L 105 175 L 110 165 Z" 
        fill="#fd9644" stroke="#fd9644" stroke-width="1.5"/>
  <circle cx="85" cy="163" r="2" fill="#fd9644"/>
  <circle cx="95" cy="161" r="2.5" fill="#fd9644"/>
  <circle cx="105" cy="163" r="2" fill="#fd9644"/>
</svg>
