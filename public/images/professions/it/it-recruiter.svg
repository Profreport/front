  <rect x="15" y="112" width="50" height="68" rx="1" fill="#1E293B" opacity="0.8"/>

  <text x="17" y="117" font-family="Arial" font-size="4" fill="#06B6D4" font-weight="bold">Senior Python Developer</text>
  <text x="17" y="121" font-family="Arial" font-size="2" fill="#6B7280">Удалённо • Full-time • ₽250-350K</text>

  <text x="17" y="126" font-family="Arial" font-size="3" fill="#D1D5DB" font-weight="bold">Requirements:</text>
  <text x="17" y="130" font-family="Arial" font-size="2" fill="#D1D5DB">• 5+ years Python development</text>
  <text x="17" y="133" font-family="Arial" font-size="2" fill="#D1D5DB">• Django/Flask experience</text>
  <text x="17" y="136" font-family="Arial" font-size="2" fill="#D1D5DB">• PostgreSQL/MySQL proficiency</text>
  <text x="17" y="139" font-family="Arial" font-size="2" fill="#D1D5DB">• REST API design</text>
  <text x="17" y="142" font-family="Arial" font-size="2" fill="#D1D5DB">• Docker/Kubernetes</text>

  <text x="17" y="147" font-family="Arial" font-size="3" fill="#D1D5DB" font-weight="bold">Nice to have:</text>
  <text x="17" y="151" font-family="Arial" font-size="2" fill="#D1D5DB">• FastAPI experience</text>
  <text x="17" y="154" font-family="Arial" font-size="2" fill="#D1D5DB">• AWS/GCP cloud</text>
  <text x="17" y="157" font-family="Arial" font-size="2" fill="#D1D5DB">• Microservices architecture</text>

  <text x="17" y="162" font-family="Arial" font-size="3" fill="#D1D5DB" font-weight="bold">Benefits:</text>
  <text x="17" y="166" font-family="Arial" font-size="2" fill="#10B981">✓ Flexible schedule</text>
  <text x="17" y="169" font-family="Arial" font-size="2" fill="#10B981">✓ Learning budget ₽100K/year</text>
  <text x="17" y="172" font-family="Arial" font-size="2" fill="#10B981">✓ Health insurance</text>
  <text x="17" y="175" font-family="Arial" font-size="2" fill="#10B981">✓ Stock options</text>

  <!-- Communication (bottom right) -->
  <rect x="80" y="145" width="110" height="40" rx="3" fill="none" stroke="#8B5CF6" stroke-width="2"/>
  <text x="135" y="157" font-family="Arial" font-size="6" fill="#8B5CF6" text-anchor="middle" font-weight="bold">OUTREACH</text>

  <!-- Email/Message preview -->
  <rect x="85" y="162" width="100" height="18" rx="1" fill="#1E293B" opacity="0.8"/>

  <text x="87" y="166" font-family="Arial" font-size="3" fill="#8B5CF6" font-weight="bold">To: aleksey.ivanov@email.com</text>
  <text x="87" y="169" font-family="Arial" font-size="2" fill="#6B7280">Subject: Exciting Senior Python opportunity</text>
  <text x="87" y="173" font-family="Arial" font-size="2" fill="#D1D5DB">Привет Алексей! Нашёл твой профиль на LinkedIn.</text>
  <text x="87" y="176" font-family="Arial" font-size="2" fill="#D1D5DB">Ищем Senior Python Dev в нашу команду...</text>

  <!-- Recruiter badge (top) -->
  <rect x="60" y="5" width="80" height="10" rx="2" fill="#3B82F6" opacity="0.3" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="100" y="12" font-family="Arial" font-size="6" fill="#3B82F6" text-anchor="middle" font-weight="bold">LinkedIn • ATS • Sourcing • Hiring</text>

  <!-- "IT RECRUITER" text -->
  <text x="100" y="197" font-family="Arial" font-size="11" fill="#3B82F6" text-anchor="middle" font-weight="bold">IT RECRUITER</text>
</svg>
