  <text x="100" y="12" font-family="Arial" font-size="6" fill="#8B5CF6" text-anchor="middle" font-weight="bold">WordPress • CMS • Editorial • Analytics</text>

  <!-- "CONTENT MANAGER" text -->
  <text x="100" y="197" font-family="Arial" font-size="10" fill="#8B5CF6" text-anchor="middle" font-weight="bold">CONTENT MANAGER</text>
