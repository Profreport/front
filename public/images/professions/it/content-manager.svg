  <rect x="62" y="80" width="74" height="2" fill="#E5E7EB"/>
  <rect x="62" y="83" width="70" height="2" fill="#E5E7EB"/>
  <rect x="62" y="86" width="76" height="2" fill="#E5E7EB"/>

  <!-- Image block -->
