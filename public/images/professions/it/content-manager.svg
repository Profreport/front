  <!-- CMS Header -->
  <rect x="55" y="50" width="90" height="7" rx="1" fill="#23282D"/>
  <circle cx="58" cy="53.5" r="1.5" fill="#8B5CF6"/>
  <text x="62" y="55" font-family="Arial" font-size="4" fill="#FFF" font-weight="bold">Dashboard</text>
  <text x="130" y="55" font-family="Arial" font-size="3" fill="#10B981">Published: 245</text>

  <!-- Editor Area -->
  <rect x="55" y="60" width="90" height="65" fill="#FFF"/>

  <!-- Title field -->
  <rect x="60" y="65" width="80" height="5" rx="1" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="0.5"/>
