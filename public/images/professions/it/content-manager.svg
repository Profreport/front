  <text x="120" y="159" font-family="Arial" font-size="2" fill="#F59E0B">Review</text>

  <!-- Published -->
  <text x="90" y="167" font-family="Arial" font-size="3" fill="#8B5CF6" text-anchor="middle">↓</text>

  <circle cx="90" cy="173" r="3" fill="#10B981" opacity="0.3"/>
  <text x="90" y="175" font-family="Arial" font-size="2" fill="#FFF" text-anchor="middle">12</text>
  <text x="95" y="174" font-family="Arial" font-size="2" fill="#10B981">Published</text>

  <!-- Scheduled -->
  <text x="107" y="174" font-family="Arial" font-size="3" fill="#8B5CF6" text-anchor="middle">→</text>

  <circle cx="115" cy="173" r="3" fill="#06B6D4" opacity="0.3"/>
  <text x="115" y="175" font-family="Arial" font-size="2" fill="#FFF" text-anchor="middle">7</text>
  <text x="120" y="174" font-family="Arial" font-size="2" fill="#06B6D4">Scheduled</text>

