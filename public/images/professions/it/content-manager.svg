  <text x="77" y="133.5" font-family="Arial" font-size="2" fill="#FFF" text-anchor="middle">Опубликовать</text>

  <text x="62" y="139" font-family="Arial" font-size="2" fill="#6B7280">Category: Статьи</text>
  <text x="62" y="143" font-family="Arial" font-size="2" fill="#6B7280">Tags: контент, SEO</text>

