  <text x="20" y="87" font-family="Arial" font-size="3" fill="#8B5CF6" text-anchor="middle">Quality</text>
  <text x="20" y="108" font-family="Arial" font-size="3" fill="#8B5CF6" text-anchor="middle">Content</text>

  <!-- Publishing badge (right) -->
  <circle cx="180" cy="95" r="8" fill="#10B981" opacity="0.3"/>
  <text x="180" y="98" font-family="Arial" font-size="6" fill="#10B981" text-anchor="middle" font-weight="bold">✓</text>
  <text x="180" y="87" font-family="Arial" font-size="3" fill="#10B981" text-anchor="middle">24/5</text>
  <text x="180" y="108" font-family="Arial" font-size="3" fill="#10B981" text-anchor="middle">Publishing</text>

  <!-- Tools badge (top) -->
