    <linearGradient id="contentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#contentGrad)" opacity="0.1"/>

  <!-- WordPress/CMS Interface (center) -->
  <rect x="50" y="45" width="100" height="85" rx="3" fill="#1E293B" opacity="0.9" stroke="#8B5CF6" stroke-width="3"/>
