  <text x="158" y="161" font-family="Arial" font-size="4" fill="#8B5CF6" text-anchor="middle">🖼</text>

  <rect x="166" y="155" width="12" height="10" rx="0.5" fill="#06B6D4" opacity="0.3"/>
  <text x="172" y="161" font-family="Arial" font-size="4" fill="#06B6D4" text-anchor="middle">📸</text>

  <rect x="152" y="167" width="12" height="10" rx="0.5" fill="#10B981" opacity="0.3"/>
  <text x="158" y="173" font-family="Arial" font-size="4" fill="#10B981" text-anchor="middle">🎬</text>

  <rect x="166" y="167" width="12" height="10" rx="0.5" fill="#F59E0B" opacity="0.3"/>
  <text x="172" y="173" font-family="Arial" font-size="4" fill="#F59E0B" text-anchor="middle">📄</text>

