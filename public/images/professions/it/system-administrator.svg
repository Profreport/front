  <rect x="110" y="53" width="50" height="15" rx="1" fill="#06B6D4" opacity="0.2" stroke="#06B6D4" stroke-width="1.5"/>
  <text x="135" y="62" font-family="Arial" font-size="6" fill="#06B6D4" text-anchor="middle" font-weight="bold">Switch 48p</text>
  <circle cx="113" cy="57" r="1" fill="#10B981"/>
  <circle cx="116" cy="57" r="1" fill="#10B981"/>
  <circle cx="119" cy="57" r="1" fill="#10B981"/>
  <circle cx="122" cy="57" r="1" fill="#10B981"/>
  <circle cx="125" cy="57" r="1" fill="#10B981"/>
  <circle cx="128" cy="57" r="1" fill="#10B981"/>
  <text x="135" y="66" font-family="Arial" font-size="4" fill="#06B6D4" text-anchor="middle">+ 42 ports</text>

