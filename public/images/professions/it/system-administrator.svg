<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Gradient background -->
  <defs>
    <linearGradient id="sysadminGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06B6D4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#sysadminGrad)" opacity="0.1"/>

  <!-- Server Rack (main element) -->
  <rect x="35" y="30" width="60" height="90" rx="3" fill="none" stroke="#06B6D4" stroke-width="3"/>
  <text x="65" y="24" font-family="Arial" font-size="6" fill="#06B6D4" text-anchor="middle" font-weight="bold">Server Rack</text>

  <!-- Server units -->
  <rect x="40" y="35" width="50" height="12" rx="1" fill="#06B6D4" opacity="0.3" stroke="#06B6D4" stroke-width="1.5"/>
  <circle cx="43" cy="41" r="1.5" fill="#10B981"/>
  <circle cx="47" cy="41" r="1.5" fill="#10B981"/>
  <text x="52" y="43" font-family="Arial" font-size="5" fill="#06B6D4">Web Server</text>

  <rect x="40" y="50" width="50" height="12" rx="1" fill="#06B6D4" opacity="0.3" stroke="#06B6D4" stroke-width="1.5"/>
  <circle cx="43" cy="56" r="1.5" fill="#10B981"/>
  <circle cx="47" cy="56" r="1.5" fill="#10B981"/>
  <text x="52" y="58" font-family="Arial" font-size="5" fill="#06B6D4">DB Server</text>

  <rect x="40" y="65" width="50" height="12" rx="1" fill="#06B6D4" opacity="0.3" stroke="#06B6D4" stroke-width="1.5"/>
  <circle cx="43" cy="71" r="1.5" fill="#10B981"/>
  <circle cx="47" cy="71" r="1.5" fill="#F59E0B"/>
  <text x="52" y="73" font-family="Arial" font-size="5" fill="#06B6D4">File Server</text>

  <rect x="40" y="80" width="50" height="12" rx="1" fill="#06B6D4" opacity="0.3" stroke="#06B6D4" stroke-width="1.5"/>
  <circle cx="43" cy="86" r="1.5" fill="#10B981"/>
  <circle cx="47" cy="86" r="1.5" fill="#10B981"/>
  <text x="52" y="88" font-family="Arial" font-size="5" fill="#06B6D4">Mail Server</text>

  <!-- Backup storage -->
  <rect x="40" y="95" width="50" height="12" rx="1" fill="#8B5CF6" opacity="0.2" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="52" y="103" font-family="Arial" font-size="5" fill="#8B5CF6">Backup Storage</text>
  <rect x="43" y="105" width="6" height="4" rx="0.5" fill="#8B5CF6" opacity="0.5"/>
  <rect x="50" y="105" width="6" height="4" rx="0.5" fill="#8B5CF6" opacity="0.5"/>
  <rect x="57" y="105" width="6" height="4" rx="0.5" fill="#8B5CF6" opacity="0.5"/>

  <!-- Network equipment (right side) -->
  <rect x="105" y="30" width="60" height="50" rx="3" fill="none" stroke="#10B981" stroke-width="2"/>
  <text x="135" y="24" font-family="Arial" font-size="6" fill="#10B981" text-anchor="middle" font-weight="bold">Network</text>

  <!-- Router -->
  <rect x="110" y="35" width="50" height="15" rx="1" fill="#10B981" opacity="0.2" stroke="#10B981" stroke-width="1.5"/>
  <text x="135" y="44" font-family="Arial" font-size="6" fill="#10B981" text-anchor="middle" font-weight="bold">Router</text>
  <circle cx="113" cy="39" r="1.5" fill="#10B981"/>
  <circle cx="117" cy="39" r="1.5" fill="#10B981"/>
  <circle cx="121" cy="39" r="1.5" fill="#10B981"/>
  <circle cx="125" cy="39" r="1.5" fill="#10B981"/>

