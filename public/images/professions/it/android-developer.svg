<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Gradient background -->
  <defs>
    <linearGradient id="androidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3DDC84;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#07C160;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#androidGrad)" opacity="0.1"/>

  <!-- Android robot simplified -->
  <!-- Head -->
  <rect x="70" y="60" width="60" height="40" rx="20" fill="#3DDC84"/>

  <!-- Antennas -->
  <line x1="80" y1="60" x2="75" y2="45" stroke="#3DDC84" stroke-width="3" stroke-linecap="round"/>
  <line x1="120" y1="60" x2="125" y2="45" stroke="#3DDC84" stroke-width="3" stroke-linecap="round"/>

  <!-- Eyes -->
  <circle cx="85" cy="75" r="3" fill="white"/>
  <circle cx="115" cy="75" r="3" fill="white"/>

  <!-- Body -->
  <rect x="70" y="100" width="60" height="50" rx="8" fill="#3DDC84"/>

  <!-- Arms -->
  <rect x="55" y="105" width="12" height="35" rx="6" fill="#3DDC84"/>
  <rect x="133" y="105" width="12" height="35" rx="6" fill="#3DDC84"/>

  <!-- Legs -->
  <rect x="78" y="150" width="14" height="30" rx="7" fill="#3DDC84"/>
  <rect x="108" y="150" width="14" height="30" rx="7" fill="#3DDC84"/>

  <!-- Phone frame -->
  <rect x="30" y="35" width="65" height="110" rx="8" fill="#1c1c1e" stroke="#3DDC84" stroke-width="2" opacity="0.3"/>
  <rect x="37" y="45" width="51" height="90" rx="4" fill="#3DDC84" opacity="0.2"/>

  <!-- Kotlin logo hint (K letter) -->
  <text x="160" y="185" font-family="Arial" font-size="28" fill="#7F52FF" font-weight="bold">K</text>

  <!-- Android Studio text -->
  <text x="145" y="170" font-family="Arial" font-size="10" fill="#3DDC84" font-weight="bold">Studio</text>
</svg>
