<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Gradient background -->
  <defs>
    <linearGradient id="gameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8E2DE2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4A00E0;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#gameGrad)" opacity="0.1"/>

  <!-- Game controller body -->
  <path d="M 50 80 Q 45 90, 50 100 L 65 110 Q 70 112, 75 110 L 80 100 Q 82 95, 100 95 Q 118 95, 120 100 L 125 110 Q 130 112, 135 110 L 150 100 Q 155 90, 150 80 L 140 70 Q 135 65, 100 65 Q 65 65, 60 70 Z" fill="#8E2DE2" opacity="0.3" stroke="#8E2DE2" stroke-width="3"/>

  <!-- D-pad (left controls) -->
  <rect x="60" y="85" width="8" height="20" rx="2" fill="#8E2DE2"/>
  <rect x="56" y="89" width="16" height="8" rx="2" fill="#8E2DE2"/>

  <!-- Action buttons (right) -->
  <circle cx="130" cy="88" r="5" fill="#4A00E0"/>
  <circle cx="140" cy="98" r="5" fill="#8E2DE2"/>
  <circle cx="120" cy="98" r="5" fill="#8E2DE2"/>
  <circle cx="130" cy="108" r="5" fill="#4A00E0"/>

  <!-- Unity cube hint (top left) -->
  <g transform="translate(30, 30)">
    <polygon points="15,5 25,10 25,20 15,25 5,20 5,10" fill="none" stroke="#8E2DE2" stroke-width="2"/>
    <line x1="15" y1="5" x2="15" y2="25" stroke="#8E2DE2" stroke-width="2"/>
    <line x1="15" y1="25" x2="5" y2="20" stroke="#8E2DE2" stroke-width="2"/>
    <line x1="15" y1="25" x2="25" y2="20" stroke="#8E2DE2" stroke-width="2"/>
  </g>

  <!-- Unreal Engine "U" hint (top right) -->
  <text x="158" y="48" font-family="Arial" font-size="24" fill="#4A00E0" font-weight="bold">U</text>

  <!-- Play button icon -->
  <circle cx="100" cy="140" r="20" fill="#8E2DE2" opacity="0.2" stroke="#8E2DE2" stroke-width="2"/>
  <polygon points="95,132 95,148 108,140" fill="#8E2DE2"/>

  <!-- VR headset hint (bottom) -->
  <rect x="70" y="165" width="60" height="20" rx="10" fill="none" stroke="#4A00E0" stroke-width="2"/>
  <circle cx="85" cy="175" r="6" fill="none" stroke="#4A00E0" stroke-width="2"/>
  <circle cx="115" cy="175" r="6" fill="none" stroke="#4A00E0" stroke-width="2"/>
  <line x1="70" y1="175" x2="60" y2="175" stroke="#4A00E0" stroke-width="2"/>
  <line x1="130" y1="175" x2="140" y2="175" stroke="#4A00E0" stroke-width="2"/>

  <!-- "GAME" text -->
  <text x="165" y="185" font-family="Arial" font-size="11" fill="#8E2DE2" font-weight="bold">GAME</text>
</svg>
