<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Gradient background -->
  <defs>
    <linearGradient id="backendGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#11998e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38ef7d;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#backendGrad)" opacity="0.1"/>

  <!-- Server icon (stacked rectangles) -->
  <rect x="50" y="40" width="100" height="30" rx="4" fill="#11998e" opacity="0.3" stroke="#11998e" stroke-width="2"/>
  <circle cx="65" cy="55" r="3" fill="#38ef7d"/>
  <circle cx="75" cy="55" r="3" fill="#38ef7d"/>
  <rect x="90" y="50" width="50" height="3" fill="#38ef7d" rx="1"/>
  <rect x="90" y="57" width="40" height="3" fill="#38ef7d" rx="1"/>

  <rect x="50" y="80" width="100" height="30" rx="4" fill="#11998e" opacity="0.5" stroke="#11998e" stroke-width="2"/>
  <circle cx="65" cy="95" r="3" fill="#38ef7d"/>
  <circle cx="75" cy="95" r="3" fill="#38ef7d"/>
  <rect x="90" y="90" width="50" height="3" fill="#38ef7d" rx="1"/>
  <rect x="90" y="97" width="35" height="3" fill="#38ef7d" rx="1"/>

  <rect x="50" y="120" width="100" height="30" rx="4" fill="#11998e" stroke="#11998e" stroke-width="2"/>
  <circle cx="65" cy="135" r="3" fill="#38ef7d"/>
  <circle cx="75" cy="135" r="3" fill="#38ef7d"/>
  <rect x="90" y="130" width="50" height="3" fill="#38ef7d" rx="1"/>
  <rect x="90" y="137" width="45" height="3" fill="#38ef7d" rx="1"/>

  <!-- Database icon -->
  <ellipse cx="100" cy="165" rx="35" ry="8" fill="none" stroke="#11998e" stroke-width="2"/>
  <line x1="65" y1="165" x2="65" y2="180" stroke="#11998e" stroke-width="2"/>
  <line x1="135" y1="165" x2="135" y2="180" stroke="#11998e" stroke-width="2"/>
  <ellipse cx="100" cy="180" rx="35" ry="8" fill="#11998e" opacity="0.3" stroke="#11998e" stroke-width="2"/>

  <!-- API text -->
  <text x="100" y="30" font-family="monospace" font-size="16" fill="#11998e" text-anchor="middle" font-weight="bold">API</text>
</svg>
