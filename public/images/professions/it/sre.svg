<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="sreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <circle cx="100" cy="100" r="95" fill="url(#sreGrad)" opacity="0.1"/>

  <!-- Server rack -->
  <rect x="70" y="35" width="60" height="80" rx="4" fill="#1E293B" stroke="#10B981" stroke-width="3"/>

  <!-- Server units -->
  <rect x="78" y="42" width="44" height="12" rx="2" fill="#10B981" opacity="0.3" stroke="#10B981" stroke-width="1.5"/>
  <circle cx="115" cy="48" r="3" fill="#10B981"/>

  <rect x="78" y="58" width="44" height="12" rx="2" fill="#06B6D4" opacity="0.3" stroke="#06B6D4" stroke-width="1.5"/>
  <circle cx="115" cy="64" r="3" fill="#06B6D4"/>

  <rect x="78" y="74" width="44" height="12" rx="2" fill="#10B981" opacity="0.3" stroke="#10B981" stroke-width="1.5"/>
  <circle cx="115" cy="80" r="3" fill="#10B981"/>

  <rect x="78" y="90" width="44" height="12" rx="2" fill="#06B6D4" opacity="0.3" stroke="#06B6D4" stroke-width="1.5"/>
  <circle cx="115" cy="96" r="3" fill="#06B6D4"/>

  <!-- Uptime indicator -->
  <rect x="55" y="125" width="90" height="35" rx="4" fill="#10B981" opacity="0.15" stroke="#10B981" stroke-width="2"/>
  <text x="100" y="140" font-family="Arial, sans-serif" font-size="10" fill="#10B981" text-anchor="middle" font-weight="bold">99.99%</text>
  <text x="100" y="152" font-family="Arial, sans-serif" font-size="8" fill="#10B981" text-anchor="middle">UPTIME</text>

  <!-- Monitoring graph left -->
  <rect x="20" y="50" width="40" height="30" rx="3" fill="#1E293B" stroke="#06B6D4" stroke-width="2"/>
  <polyline points="25,72 32,68 39,70 46,62 53,65" fill="none" stroke="#10B981" stroke-width="2"/>

  <!-- Alert icon right -->
  <rect x="140" y="50" width="40" height="30" rx="3" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/>
  <polygon points="160,58 152,74 168,74" fill="none" stroke="#F59E0B" stroke-width="2"/>
  <line x1="160" y1="64" x2="160" y2="68" stroke="#F59E0B" stroke-width="2"/>
  <circle cx="160" cy="71" r="1" fill="#F59E0B"/>

  <!-- Title -->
  <text x="100" y="185" font-family="Arial, sans-serif" font-size="14" fill="#10B981" text-anchor="middle" font-weight="bold">SRE</text>
</svg>
