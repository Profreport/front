<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Gradient background -->
  <defs>
    <linearGradient id="uxuiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EC4899;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#uxuiGrad)" opacity="0.1"/>

  <!-- Figma interface (center) -->
  <rect x="60" y="40" width="80" height="90" rx="3" fill="#1E293B" opacity="0.9" stroke="#8B5CF6" stroke-width="3"/>
  <text x="100" y="32" font-family="Arial" font-size="7" fill="#8B5CF6" text-anchor="middle" font-weight="bold">FIGMA</text>

  <!-- Top toolbar -->
  <rect x="65" y="45" width="70" height="8" rx="1" fill="#0F172A"/>
  <circle cx="70" cy="49" r="1.5" fill="#EC4899"/>
  <circle cx="75" cy="49" r="1.5" fill="#8B5CF6"/>
  <circle cx="80" cy="49" r="1.5" fill="#06B6D4"/>
  <rect x="87" y="47" width="8" height="4" rx="0.5" fill="#6B7280"/>
  <rect x="98" y="47" width="8" height="4" rx="0.5" fill="#6B7280"/>
  <text x="130" y="51" font-family="Arial" font-size="4" fill="#8B5CF6">100%</text>

  <!-- Artboard with UI mockup -->
  <rect x="70" y="58" width="60" height="65" rx="2" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Header -->
  <rect x="72" y="60" width="56" height="8" fill="#8B5CF6" opacity="0.2"/>
  <circle cx="76" cy="64" r="1.5" fill="#8B5CF6"/>
  <rect x="80" y="62" width="15" height="2" rx="0.5" fill="#8B5CF6"/>
  <rect x="110" cy="62" width="12" height="3" rx="0.5" fill="#EC4899"/>

  <!-- Content blocks -->
  <rect x="75" y="72" width="50" height="4" rx="0.5" fill="#D1D5DB"/>
  <rect x="75" y="78" width="35" height="3" rx="0.5" fill="#E5E7EB"/>
  <rect x="75" y="83" width="42" height="3" rx="0.5" fill="#E5E7EB"/>

  <!-- Cards -->
  <rect x="75" y="90" width="22" height="20" rx="1" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="0.5"/>
  <rect x="77" y="92" width="18" height="10" fill="#8B5CF6" opacity="0.3"/>
  <rect x="77" y="104" width="15" height="2" rx="0.5" fill="#6B7280"/>

  <rect x="100" y="90" width="22" height="20" rx="1" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="0.5"/>
  <rect x="102" y="92" width="18" height="10" fill="#EC4899" opacity="0.3"/>
  <rect x="102" y="104" width="15" height="2" rx="0.5" fill="#6B7280"/>

  <!-- Button -->
  <rect x="85" y="115" width="30" height="6" rx="1" fill="#8B5CF6"/>
  <text x="100" y="119" font-family="Arial" font-size="3" fill="#FFFFFF" text-anchor="middle">Get Started</text>

  <!-- Wireframe (left) -->
  <rect x="15" y="20" width="40" height="55" rx="3" fill="none" stroke="#6B7280" stroke-width="2" stroke-dasharray="3,2"/>
  <text x="35" y="15" font-family="Arial" font-size="6" fill="#6B7280" text-anchor="middle" font-weight="bold">WIREFRAME</text>

  <!-- Wireframe content -->
  <rect x="20" y="25" width="30" height="3" fill="#9CA3AF"/>
  <rect x="20" y="31" width="20" height="2" fill="#D1D5DB"/>
  <rect x="20" y="35" width="25" height="2" fill="#D1D5DB"/>
  <rect x="20" y="40" width="30" height="15" fill="none" stroke="#9CA3AF" stroke-width="1"/>
  <line x1="22" y1="42" x2="48" y2="53" stroke="#9CA3AF" stroke-width="1"/>
  <line x1="48" y1="42" x2="22" y2="53" stroke="#9CA3AF" stroke-width="1"/>
  <rect x="20" y="58" width="30" height="12" fill="none" stroke="#9CA3AF" stroke-width="1"/>
  <line x1="25" y1="60" x2="45" y2="60" stroke="#D1D5DB" stroke-width="0.5"/>
  <line x1="25" y1="63" x2="45" y2="63" stroke="#D1D5DB" stroke-width="0.5"/>
  <line x1="25" y1="66" x2="45" y2="66" stroke="#D1D5DB" stroke-width="0.5"/>

  <!-- User Research (top right) -->
  <rect x="145" y="20" width="40" height="55" rx="3" fill="#EC4899" opacity="0.1" stroke="#EC4899" stroke-width="2"/>
  <text x="165" y="15" font-family="Arial" font-size="6" fill="#EC4899" text-anchor="middle" font-weight="bold">USER RESEARCH</text>

  <!-- Personas -->
  <circle cx="155" cy="35" r="5" fill="#EC4899" opacity="0.3"/>
  <text x="155" y="37" font-family="Arial" font-size="6" fill="#EC4899" text-anchor="middle">👤</text>
  <text x="155" y="44" font-family="Arial" font-size="3" fill="#EC4899" text-anchor="middle">Anna, 28</text>
  <text x="155" y="48" font-family="Arial" font-size="2" fill="#6B7280" text-anchor="middle">Marketing Manager</text>

  <circle cx="175" cy="35" r="5" fill="#8B5CF6" opacity="0.3"/>
  <text x="175" y="37" font-family="Arial" font-size="6" fill="#8B5CF6" text-anchor="middle">👤</text>
  <text x="175" y="44" font-family="Arial" font-size="3" fill="#8B5CF6" text-anchor="middle">John, 35</text>
  <text x="175" y="48" font-family="Arial" font-size="2" fill="#6B7280" text-anchor="middle">Developer</text>

  <!-- User Journey -->
  <text x="150" y="58" font-family="Arial" font-size="4" fill="#EC4899">User Journey:</text>
  <circle cx="152" cy="62" r="1.5" fill="#10B981"/>
  <line x1="153.5" y1="62" x2="158.5" y2="62" stroke="#10B981" stroke-width="1"/>
  <circle cx="160" cy="62" r="1.5" fill="#10B981"/>
  <line x1="161.5" y1="62" x2="166.5" y2="62" stroke="#F59E0B" stroke-width="1"/>
  <circle cx="168" cy="62" r="1.5" fill="#EF4444"/>
  <text x="152" y="69" font-family="Arial" font-size="3" fill="#6B7280">Discover → Sign Up</text>

  <!-- Prototyping (bottom left) -->
  <rect x="15" y="135" width="55" height="50" rx="3" fill="none" stroke="#06B6D4" stroke-width="2"/>
  <text x="42" y="130" font-family="Arial" font-size="6" fill="#06B6D4" text-anchor="middle" font-weight="bold">PROTOTYPE</text>

  <!-- Interactive prototype -->
  <rect x="20" y="140" width="20" height="28" rx="2" fill="#FFFFFF" stroke="#06B6D4" stroke-width="1"/>
  <rect x="22" y="142" width="16" height="3" fill="#8B5CF6" opacity="0.3"/>
  <rect x="22" y="147" width="16" height="18" fill="#F3F4F6"/>
  <rect x="24" y="149" width="5" height="5" fill="#06B6D4" opacity="0.4"/>
  <rect x="30" y="149" width="5" height="5" fill="#EC4899" opacity="0.4"/>
  <rect x="24" y="156" width="12" height="2" fill="#D1D5DB"/>
  <rect x="24" y="160" width="12" height="2" fill="#D1D5DB"/>

  <!-- Arrow to next screen -->
  <path d="M 40 154 L 45 154" stroke="#06B6D4" stroke-width="1.5" marker-end="url(#arrowUX)"/>
  <defs>
    <marker id="arrowUX" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <polygon points="0 0, 3 3, 0 6" fill="#06B6D4"/>
    </marker>
  </defs>

  <!-- Second screen -->
  <rect x="47" y="140" width="20" height="28" rx="2" fill="#FFFFFF" stroke="#06B6D4" stroke-width="1"/>
  <text x="57" y="154" font-family="Arial" font-size="8" fill="#06B6D4" text-anchor="middle">✓</text>
  <text x="57" y="162" font-family="Arial" font-size="3" fill="#6B7280" text-anchor="middle">Success!</text>

  <!-- Click annotation -->
  <text x="42" y="175" font-family="Arial" font-size="3" fill="#06B6D4" text-anchor="middle">Click interaction</text>

  <!-- Usability Testing (bottom center) -->
  <rect x="80" y="135" width="55" height="50" rx="3" fill="#10B981" opacity="0.1" stroke="#10B981" stroke-width="2"/>
  <text x="107" y="130" font-family="Arial" font-size="6" fill="#10B981" text-anchor="middle" font-weight="bold">USABILITY TEST</text>

  <!-- Test metrics -->
  <text x="85" y="145" font-family="Arial" font-size="4" fill="#10B981">Task Success Rate:</text>
  <rect x="85" y="148" width="45" height="3" fill="#E5E7EB" rx="0.5"/>
  <rect x="85" y="148" width="38" height="3" fill="#10B981" rx="0.5"/>
  <text x="108" y="155" font-family="Arial" font-size="5" fill="#10B981" text-anchor="middle" font-weight="bold">85%</text>

  <text x="85" y="163" font-family="Arial" font-size="4" fill="#F59E0B">Time on Task:</text>
  <text x="108" y="170" font-family="Arial" font-size="5" fill="#F59E0B" text-anchor="middle" font-weight="bold">2:34</text>

  <text x="85" y="178" font-family="Arial" font-size="4" fill="#06B6D4">SUS Score:</text>
  <text x="108" y="183" font-family="Arial" font-size="5" fill="#06B6D4" text-anchor="middle" font-weight="bold">78/100</text>

  <!-- Design System (bottom right) -->
  <rect x="145" y="135" width="40" height="50" rx="3" fill="none" stroke="#8B5CF6" stroke-width="2"/>
  <text x="165" y="130" font-family="Arial" font-size="6" fill="#8B5CF6" text-anchor="middle" font-weight="bold">DESIGN SYSTEM</text>

  <!-- Color palette -->
  <circle cx="152" cy="145" r="4" fill="#8B5CF6"/>
  <circle cx="161" cy="145" r="4" fill="#EC4899"/>
  <circle cx="170" cy="145" r="4" fill="#06B6D4"/>
  <circle cx="179" cy="145" r="4" fill="#10B981"/>

  <!-- Typography -->
  <text x="150" y="157" font-family="Arial" font-size="5" fill="#1F2937" font-weight="bold">Heading</text>
  <text x="150" y="163" font-family="Arial" font-size="3" fill="#6B7280">Body text</text>

  <!-- Components -->
  <rect x="150" y="168" width="30" height="5" rx="1" fill="#8B5CF6"/>
  <text x="165" y="172" font-family="Arial" font-size="3" fill="#FFFFFF" text-anchor="middle">Button</text>

  <rect x="150" y="176" width="30" height="5" rx="1" fill="none" stroke="#8B5CF6" stroke-width="1"/>
  <text x="165" y="180" font-family="Arial" font-size="3" fill="#8B5CF6" text-anchor="middle">Outlined</text>

  <!-- User-centered badge (left) -->
  <circle cx="20" cy="95" r="8" fill="none" stroke="#EC4899" stroke-width="2"/>
  <text x="20" y="98" font-family="Arial" font-size="7" fill="#EC4899" text-anchor="middle">❤</text>
  <text x="20" y="108" font-family="Arial" font-size="3" fill="#EC4899" text-anchor="middle">User-Centered</text>

  <!-- Iteration indicator (right) -->
  <circle cx="180" cy="95" r="8" fill="#8B5CF6" opacity="0.2"/>
  <path d="M 176 95 Q 180 90 184 95 Q 180 100 176 95" fill="none" stroke="#8B5CF6" stroke-width="1.5"/>
  <polygon points="184,95 183,93 185,94" fill="#8B5CF6"/>
  <text x="180" y="108" font-family="Arial" font-size="3" fill="#8B5CF6" text-anchor="middle">Iterate</text>

  <!-- Tools badge (top) -->
  <rect x="70" y="5" width="60" height="8" rx="2" fill="#8B5CF6" opacity="0.2" stroke="#8B5CF6" stroke-width="1"/>
  <text x="100" y="11" font-family="Arial" font-size="5" fill="#8B5CF6" text-anchor="middle" font-weight="bold">Figma • Sketch • Adobe XD</text>

  <!-- "UX/UI DESIGNER" text -->
  <text x="100" y="197" font-family="Arial" font-size="11" fill="#8B5CF6" text-anchor="middle" font-weight="bold">UX/UI DESIGNER</text>
</svg>
