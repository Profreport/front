<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Gradient background -->
  <defs>
    <linearGradient id="3dGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06B6D4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#3dGrad)" opacity="0.1"/>

  <!-- 3D Cube (center isometric) -->
  <g transform="translate(100, 85)">
    <!-- Back face -->
    <path d="M -15 -25 L 15 -25 L 15 5 L -15 5 Z" fill="#1E293B" opacity="0.6"/>

    <!-- Top face -->
    <path d="M -15 -25 L 0 -35 L 30 -35 L 15 -25 Z" fill="#06B6D4" opacity="0.8"/>

    <!-- Right face -->
    <path d="M 15 -25 L 30 -35 L 30 -5 L 15 5 Z" fill="#8B5CF6" opacity="0.7"/>

    <!-- Wireframe overlay -->
    <path d="M -15 -25 L 15 -25 L 15 5 L -15 5 Z M -15 -25 L 0 -35 M 15 -25 L 30 -35 M 15 5 L 30 -5"
          stroke="#06B6D4" stroke-width="1.5" fill="none"/>
  </g>

  <!-- Blender interface (top left) -->
  <rect x="15" y="15" width="55" height="55" rx="3" fill="none" stroke="#F59E0B" stroke-width="2"/>
  <text x="42" y="27" font-family="Arial" font-size="7" fill="#F59E0B" text-anchor="middle" font-weight="bold">BLENDER</text>

  <!-- 3D viewport -->
  <rect x="20" y="32" width="45" height="33" rx="1" fill="#1E293B" opacity="0.8"/>

  <!-- 3D model in viewport -->
  <g transform="translate(42, 48)">
    <!-- Simple 3D sphere with shading -->
    <circle cx="0" cy="0" r="8" fill="#8B5CF6" opacity="0.3"/>
    <ellipse cx="-2" cy="-2" rx="6" ry="5" fill="#06B6D4" opacity="0.5"/>
    <circle cx="-3" cy="-3" r="2" fill="#FFF" opacity="0.8"/>
  </g>

  <!-- Grid floor -->
  <line x1="25" y1="60" x2="60" y2="60" stroke="#06B6D4" stroke-width="0.5" opacity="0.3"/>
  <line x1="25" y1="58" x2="60" y2="58" stroke="#06B6D4" stroke-width="0.5" opacity="0.3"/>

  <!-- Tools panel -->
  <text x="22" y="55" font-family="Arial" font-size="3" fill="#F59E0B">Move</text>
  <text x="35" y="55" font-family="Arial" font-size="3" fill="#10B981">Rotate</text>
  <text x="50" y="55" font-family="Arial" font-size="3" fill="#8B5CF6">Scale</text>

  <!-- Cinema 4D / C4D (top right) -->
  <rect x="130" y="15" width="55" height="55" rx="3" fill="#EC4899" opacity="0.1" stroke="#EC4899" stroke-width="2"/>
  <text x="157" y="27" font-family="Arial" font-size="7" fill="#EC4899" text-anchor="middle" font-weight="bold">C4D</text>

  <!-- Render preview -->
  <rect x="135" y="32" width="45" height="33" rx="1" fill="#1E293B" opacity="0.8"/>

  <!-- Product render -->
  <g transform="translate(157, 48)">
    <!-- Glossy product -->
    <rect x="-10" y="-8" width="20" height="16" rx="2" fill="#EC4899" opacity="0.6"/>
    <rect x="-8" y="-6" width="4" height="4" fill="#FFF" opacity="0.9"/>
    <path d="M -10 -8 Q -5 -10 0 -8" stroke="#FFF" stroke-width="1" fill="none" opacity="0.4"/>
  </g>

  <text x="157" y="62" font-family="Arial" font-size="3" fill="#EC4899" text-anchor="middle">Photo-realistic</text>

  <!-- Modeling (bottom left) -->
  <rect x="15" y="125" width="55" height="60" rx="3" fill="none" stroke="#10B981" stroke-width="2"/>
  <text x="42" y="137" font-family="Arial" font-size="7" fill="#10B981" text-anchor="middle" font-weight="bold">MODELING</text>

  <!-- Polygon mesh -->
  <g transform="translate(42, 160)">
    <!-- Low poly mesh -->
    <path d="M -15 0 L -5 -10 L 5 -10 L 15 0 L 5 10 L -5 10 Z"
          fill="none" stroke="#10B981" stroke-width="1.5"/>
    <circle cx="-15" cy="0" r="1.5" fill="#10B981"/>
    <circle cx="-5" cy="-10" r="1.5" fill="#10B981"/>
    <circle cx="5" cy="-10" r="1.5" fill="#10B981"/>
    <circle cx="15" cy="0" r="1.5" fill="#10B981"/>
    <circle cx="5" cy="10" r="1.5" fill="#10B981"/>
    <circle cx="-5" cy="10" r="1.5" fill="#10B981"/>
  </g>

  <text x="42" y="177" font-family="Arial" font-size="3" fill="#10B981" text-anchor="middle">Vertices: 6</text>
  <text x="42" y="181" font-family="Arial" font-size="3" fill="#10B981" text-anchor="middle">Polygons: 1</text>

  <!-- Texturing (bottom center) -->
  <rect x="80" y="125" width="55" height="60" rx="3" fill="#06B6D4" opacity="0.1" stroke="#06B6D4" stroke-width="2"/>
  <text x="107" y="137" font-family="Arial" font-size="7" fill="#06B6D4" text-anchor="middle" font-weight="bold">TEXTURING</text>

  <!-- UV mapping -->
  <rect x="85" y="143" width="45" height="37" rx="1" fill="#1E293B" opacity="0.8"/>

  <!-- UV layout -->
  <rect x="90" y="148" width="15" height="15" fill="none" stroke="#06B6D4" stroke-width="1"/>
  <text x="97" y="158" font-family="Arial" font-size="8" fill="#06B6D4" text-anchor="middle">UV</text>

  <!-- Material preview -->
  <circle cx="120" cy="155" r="8" fill="#8B5CF6"/>
  <ellipse cx="118" cy="153" rx="3" ry="2" fill="#FFF" opacity="0.6"/>

  <text x="107" y="175" font-family="Arial" font-size="3" fill="#06B6D4" text-anchor="middle">PBR Materials</text>
  <text x="107" y="179" font-family="Arial" font-size="3" fill="#06B6D4" text-anchor="middle">Albedo • Normal • Roughness</text>

  <!-- Rendering (bottom right) -->
  <rect x="145" y="125" width="40" height="60" rx="3" fill="none" stroke="#8B5CF6" stroke-width="2"/>
  <text x="165" y="137" font-family="Arial" font-size="6" fill="#8B5CF6" text-anchor="middle" font-weight="bold">RENDER</text>

  <!-- Render settings -->
  <rect x="150" y="143" width="30" height="37" rx="1" fill="#1E293B" opacity="0.8"/>

  <text x="152" y="149" font-family="Arial" font-size="4" fill="#8B5CF6">Cycles</text>
  <text x="152" y="154" font-family="Arial" font-size="3" fill="#06B6D4">Samples: 128</text>
  <text x="152" y="159" font-family="Arial" font-size="3" fill="#10B981">Denoising: On</text>

  <!-- Progress bar -->
  <rect x="152" y="163" width="24" height="3" fill="#1E293B"/>
  <rect x="152" y="163" width="18" height="3" fill="#8B5CF6"/>
  <text x="165" y="170" font-family="Arial" font-size="3" fill="#8B5CF6" text-anchor="middle">75%</text>

  <text x="165" y="176" font-family="Arial" font-size="3" fill="#8B5CF6" text-anchor="middle">ETA: 2:34</text>

  <!-- Lighting setup (left side) -->
  <circle cx="20" cy="95" r="8" fill="none" stroke="#F59E0B" stroke-width="2"/>
  <circle cx="20" cy="95" r="4" fill="#F59E0B" opacity="0.4"/>
  <line x1="20" y1="87" x2="20" y2="83" stroke="#F59E0B" stroke-width="1.5"/>
  <line x1="20" y1="103" x2="20" y2="107" stroke="#F59E0B" stroke-width="1.5"/>
  <line x1="12" y1="95" x2="8" y2="95" stroke="#F59E0B" stroke-width="1.5"/>
  <line x1="28" y1="95" x2="32" y2="95" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="20" y="82" font-family="Arial" font-size="3" fill="#F59E0B" text-anchor="middle">3-Point</text>
  <text x="20" y="113" font-family="Arial" font-size="3" fill="#F59E0B" text-anchor="middle">Lighting</text>

  <!-- Camera view (right side) -->
  <rect x="172" y="87" width="16" height="16" rx="2" fill="none" stroke="#06B6D4" stroke-width="2"/>
  <circle cx="180" cy="95" r="4" fill="none" stroke="#06B6D4" stroke-width="1.5"/>
  <path d="M 176 95 L 178 95" stroke="#06B6D4" stroke-width="1"/>
  <path d="M 182 95 L 184 95" stroke="#06B6D4" stroke-width="1"/>
  <text x="180" y="82" font-family="Arial" font-size="3" fill="#06B6D4" text-anchor="middle">Camera</text>
  <text x="180" y="113" font-family="Arial" font-size="3" fill="#06B6D4" text-anchor="middle">View</text>

  <!-- Tools badge (top) -->
  <rect x="65" y="5" width="70" height="10" rx="2" fill="#06B6D4" opacity="0.3" stroke="#06B6D4" stroke-width="1.5"/>
  <text x="100" y="12" font-family="Arial" font-size="6" fill="#06B6D4" text-anchor="middle" font-weight="bold">Blender • C4D • Maya • 3ds Max</text>

  <!-- "3D DESIGNER" text -->
  <text x="100" y="197" font-family="Arial" font-size="11" fill="#06B6D4" text-anchor="middle" font-weight="bold">3D DESIGNER</text>
</svg>
