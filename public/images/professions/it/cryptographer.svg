<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Gradient background -->
  <defs>
    <linearGradient id="cryptoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#cryptoGrad)" opacity="0.1"/>

  <!-- Main encryption lock (center) -->
  <rect x="75" y="70" width="50" height="40" rx="4" fill="#1E293B" opacity="0.9" stroke="#8B5CF6" stroke-width="3"/>
  <path d="M 85 70 L 85 60 Q 85 50 100 50 Q 115 50 115 60 L 115 70" fill="none" stroke="#8B5CF6" stroke-width="3"/>
  <circle cx="100" cy="90" r="6" fill="#8B5CF6"/>
  <line x1="100" y1="96" x2="100" y2="104" stroke="#8B5CF6" stroke-width="3"/>

  <!-- Binary encryption text inside lock -->
  <text x="80" y="82" font-family="Courier" font-size="4" fill="#06B6D4">0101110</text>
  <text x="80" y="87" font-family="Courier" font-size="4" fill="#10B981">1001011</text>

  <!-- Mathematical formulas (top) -->
  <rect x="15" y="15" width="70" height="40" rx="3" fill="none" stroke="#F59E0B" stroke-width="2"/>
  <text x="50" y="27" font-family="Arial" font-size="7" fill="#F59E0B" text-anchor="middle" font-weight="bold">MATHEMATICS</text>

  <!-- Number theory formulas -->
  <text x="20" y="37" font-family="Times New Roman" font-size="5" fill="#F59E0B" font-style="italic">p ≡ 3 (mod 4)</text>
  <text x="20" y="43" font-family="Times New Roman" font-size="5" fill="#8B5CF6" font-style="italic">φ(n) = (p-1)(q-1)</text>
  <text x="20" y="49" font-family="Times New Roman" font-size="5" fill="#06B6D4" font-style="italic">gcd(e, φ(n)) = 1</text>

  <!-- Algorithms (top right) -->
  <rect x="115" y="15" width="70" height="40" rx="3" fill="#8B5CF6" opacity="0.1" stroke="#8B5CF6" stroke-width="2"/>
  <text x="150" y="27" font-family="Arial" font-size="7" fill="#8B5CF6" text-anchor="middle" font-weight="bold">ALGORITHMS</text>

  <!-- Algorithm list -->
  <text x="120" y="35" font-family="Arial" font-size="4" fill="#8B5CF6">RSA-4096</text>
  <text x="120" y="40" font-family="Arial" font-size="4" fill="#06B6D4">AES-256</text>
  <text x="120" y="45" font-family="Arial" font-size="4" fill="#10B981">ECC (secp256k1)</text>
  <text x="120" y="50" font-family="Arial" font-size="4" fill="#F59E0B">SHA-256/SHA-3</text>

  <!-- Plaintext to Ciphertext (left flow) -->
  <rect x="15" y="70" width="50" height="15" rx="2" fill="#10B981" opacity="0.3" stroke="#10B981" stroke-width="2"/>
  <text x="40" y="79" font-family="Arial" font-size="6" fill="#10B981" text-anchor="middle" font-weight="bold">PLAINTEXT</text>
  <text x="40" y="83" font-family="Courier" font-size="4" fill="#10B981" text-anchor="middle">Hello World</text>

  <!-- Encryption arrow -->
  <path d="M 65 77 L 75 77" stroke="#8B5CF6" stroke-width="2" marker-end="url(#arrowCrypto)"/>
  <text x="70" y="75" font-family="Arial" font-size="3" fill="#8B5CF6" text-anchor="middle">encrypt</text>
  <defs>
    <marker id="arrowCrypto" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <polygon points="0 0, 3 3, 0 6" fill="#8B5CF6"/>
    </marker>
  </defs>

  <!-- Ciphertext (right flow) -->
  <rect x="135" y="70" width="50" height="15" rx="2" fill="#EF4444" opacity="0.3" stroke="#EF4444" stroke-width="2"/>
  <text x="160" y="79" font-family="Arial" font-size="6" fill="#EF4444" text-anchor="middle" font-weight="bold">CIPHERTEXT</text>
  <text x="160" y="83" font-family="Courier" font-size="3" fill="#EF4444" text-anchor="middle">3f7a9b2c8e1d...</text>

  <!-- Decryption arrow -->
  <path d="M 125 93 L 135 93" stroke="#10B981" stroke-width="2" marker-end="url(#arrowCrypto2)"/>
  <text x="130" y="91" font-family="Arial" font-size="3" fill="#10B981" text-anchor="middle">decrypt</text>
  <defs>
    <marker id="arrowCrypto2" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <polygon points="0 0, 3 3, 0 6" fill="#10B981"/>
    </marker>
  </defs>

  <!-- Cryptographic protocols (bottom left) -->
  <rect x="15" y="120" width="55" height="65" rx="3" fill="none" stroke="#06B6D4" stroke-width="2"/>
  <text x="42" y="132" font-family="Arial" font-size="7" fill="#06B6D4" text-anchor="middle" font-weight="bold">PROTOCOLS</text>

  <!-- Protocol list -->
  <text x="20" y="142" font-family="Arial" font-size="4" fill="#06B6D4">TLS 1.3</text>
  <circle cx="60" cy="140" r="1.5" fill="#10B981"/>
  <text x="20" y="148" font-family="Arial" font-size="4" fill="#8B5CF6">IPsec VPN</text>
  <circle cx="60" cy="146" r="1.5" fill="#10B981"/>
  <text x="20" y="154" font-family="Arial" font-size="4" fill="#10B981">SSH (Ed25519)</text>
  <circle cx="60" cy="152" r="1.5" fill="#10B981"/>
  <text x="20" y="160" font-family="Arial" font-size="4" fill="#F59E0B">PGP/GPG</text>
  <circle cx="60" cy="158" r="1.5" fill="#10B981"/>
  <text x="20" y="166" font-family="Arial" font-size="4" fill="#EF4444">Blockchain</text>
  <circle cx="60" cy="164" r="1.5" fill="#F59E0B"/>
  <text x="20" y="172" font-family="Arial" font-size="4" fill="#06B6D4">Zero-Knowledge</text>
  <circle cx="60" cy="170" r="1.5" fill="#8B5CF6"/>
  <text x="20" y="178" font-family="Arial" font-size="4" fill="#10B981">Post-Quantum</text>
  <circle cx="60" cy="176" r="1.5" fill="#F59E0B"/>

  <!-- Quantum threat (bottom center) -->
  <rect x="80" y="120" width="55" height="65" rx="3" fill="#EF4444" opacity="0.1" stroke="#EF4444" stroke-width="2"/>
  <text x="107" y="132" font-family="Arial" font-size="7" fill="#EF4444" text-anchor="middle" font-weight="bold">QUANTUM</text>
  <text x="107" y="139" font-family="Arial" font-size="6" fill="#EF4444" text-anchor="middle">THREAT</text>

  <!-- Quantum computer icon -->
  <circle cx="107" cy="155" r="12" fill="none" stroke="#EF4444" stroke-width="2"/>
  <circle cx="107" cy="155" r="8" fill="#EF4444" opacity="0.3"/>
  <text x="107" y="159" font-family="Arial" font-size="8" fill="#EF4444" text-anchor="middle">Q</text>

  <!-- Threat timeline -->
  <text x="107" y="173" font-family="Arial" font-size="4" fill="#EF4444" text-anchor="middle">Shor's Algorithm</text>
  <text x="107" y="178" font-family="Arial" font-size="4" fill="#F59E0B" text-anchor="middle">RSA vulnerable</text>
  <text x="107" y="183" font-family="Arial" font-size="3" fill="#EF4444" text-anchor="middle">Q-Day: 2030-2040?</text>

  <!-- Post-Quantum Crypto (bottom right) -->
  <rect x="145" y="120" width="40" height="65" rx="3" fill="none" stroke="#10B981" stroke-width="2"/>
  <text x="165" y="132" font-family="Arial" font-size="6" fill="#10B981" text-anchor="middle" font-weight="bold">POST-</text>
  <text x="165" y="138" font-family="Arial" font-size="6" fill="#10B981" text-anchor="middle" font-weight="bold">QUANTUM</text>

  <!-- PQC algorithms -->
  <rect x="150" y="145" width="30" height="35" rx="1" fill="#1E293B" opacity="0.8"/>
  <text x="152" y="151" font-family="Arial" font-size="4" fill="#10B981">CRYSTALS-</text>
  <text x="152" y="156" font-family="Arial" font-size="4" fill="#10B981">Kyber</text>
  <text x="152" y="162" font-family="Arial" font-size="4" fill="#06B6D4">CRYSTALS-</text>
  <text x="152" y="167" font-family="Arial" font-size="4" fill="#06B6D4">Dilithium</text>
  <text x="152" y="173" font-family="Arial" font-size="4" fill="#8B5CF6">SPHINCS+</text>
  <text x="152" y="178" font-family="Arial" font-size="4" fill="#F59E0B">FrodoKEM</text>

  <!-- Key length indicator (left side) -->
  <rect x="10" y="90" width="8" height="25" rx="1" fill="#8B5CF6" opacity="0.3"/>
  <text x="14" y="102" font-family="Arial" font-size="3" fill="#8B5CF6" text-anchor="middle" font-weight="bold" transform="rotate(-90 14 102)">4096-bit RSA</text>

  <!-- Security level badge (right side) -->
  <circle cx="190" cy="100" r="8" fill="none" stroke="#10B981" stroke-width="2"/>
  <text x="190" y="103" font-family="Arial" font-size="6" fill="#10B981" text-anchor="middle" font-weight="bold">256</text>
  <text x="190" y="92" font-family="Arial" font-size="3" fill="#10B981" text-anchor="middle">Security</text>
  <text x="190" y="113" font-family="Arial" font-size="3" fill="#10B981" text-anchor="middle">bits</text>

  <!-- NIST badge (top) -->
  <rect x="75" y="5" width="50" height="10" rx="2" fill="#06B6D4" opacity="0.3" stroke="#06B6D4" stroke-width="1.5"/>
  <text x="100" y="12" font-family="Arial" font-size="6" fill="#06B6D4" text-anchor="middle" font-weight="bold">NIST APPROVED</text>

  <!-- "CRYPTOGRAPHER" text -->
  <text x="100" y="197" font-family="Arial" font-size="11" fill="#8B5CF6" text-anchor="middle" font-weight="bold">CRYPTOGRAPHER</text>
</svg>
