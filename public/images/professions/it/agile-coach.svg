<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Gradient background -->
  <defs>
    <linearGradient id="coachGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#coachGrad)" opacity="0.1"/>

  <!-- Multiple teams (main element) -->
  <!-- Team 1 -->
  <rect x="20" y="40" width="50" height="35" rx="3" fill="none" stroke="#8B5CF6" stroke-width="2"/>
  <text x="45" y="52" font-family="Arial" font-size="7" fill="#8B5CF6" text-anchor="middle" font-weight="bold">TEAM 1</text>
  <circle cx="30" cy="62" r="4" fill="#8B5CF6" opacity="0.3"/>
  <circle cx="40" cy="62" r="4" fill="#8B5CF6" opacity="0.3"/>
  <circle cx="50" cy="62" r="4" fill="#8B5CF6" opacity="0.3"/>
  <circle cx="60" cy="62" r="4" fill="#8B5CF6" opacity="0.3"/>
  <circle cx="35" cy="69" r="3" fill="#10B981"/>
  <text x="35" y="71" font-family="Arial" font-size="5" fill="#FFF" text-anchor="middle" font-weight="bold">C</text>

  <!-- Team 2 -->
  <rect x="80" y="40" width="50" height="35" rx="3" fill="none" stroke="#10B981" stroke-width="2"/>
  <text x="105" y="52" font-family="Arial" font-size="7" fill="#10B981" text-anchor="middle" font-weight="bold">TEAM 2</text>
  <circle cx="90" cy="62" r="4" fill="#10B981" opacity="0.3"/>
  <circle cx="100" cy="62" r="4" fill="#10B981" opacity="0.3"/>
  <circle cx="110" cy="62" r="4" fill="#10B981" opacity="0.3"/>
  <circle cx="120" cy="62" r="4" fill="#10B981" opacity="0.3"/>
  <circle cx="105" cy="69" r="3" fill="#10B981"/>
  <text x="105" y="71" font-family="Arial" font-size="5" fill="#FFF" text-anchor="middle" font-weight="bold">C</text>

  <!-- Team 3 -->
  <rect x="140" y="40" width="45" height="35" rx="3" fill="none" stroke="#06B6D4" stroke-width="2"/>
  <text x="162" y="52" font-family="Arial" font-size="7" fill="#06B6D4" text-anchor="middle" font-weight="bold">TEAM 3</text>
  <circle cx="150" cy="62" r="4" fill="#06B6D4" opacity="0.3"/>
  <circle cx="160" cy="62" r="4" fill="#06B6D4" opacity="0.3"/>
  <circle cx="170" cy="62" r="4" fill="#06B6D4" opacity="0.3"/>
  <circle cx="160" cy="69" r="3" fill="#10B981"/>
  <text x="160" y="71" font-family="Arial" font-size="5" fill="#FFF" text-anchor="middle" font-weight="bold">C</text>

  <!-- Agile Coach at center (coaching all teams) -->
  <circle cx="100" cy="105" r="15" fill="#8B5CF6" opacity="0.2" stroke="#8B5CF6" stroke-width="2"/>
  <circle cx="100" cy="100" r="5" fill="#8B5CF6"/>
  <path d="M 93 112 Q 100 108, 107 112" fill="none" stroke="#8B5CF6" stroke-width="2"/>
  <text x="100" y="130" font-family="Arial" font-size="7" fill="#8B5CF6" text-anchor="middle" font-weight="bold">AGILE</text>
  <text x="100" y="138" font-family="Arial" font-size="7" fill="#8B5CF6" text-anchor="middle" font-weight="bold">COACH</text>

  <!-- Connection lines from coach to teams -->
  <line x1="88" y1="95" x2="45" y2="75" stroke="#8B5CF6" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="100" y1="90" x2="105" y2="75" stroke="#10B981" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="112" y1="95" x2="162" y2="75" stroke="#06B6D4" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Workshop (bottom left) -->
  <rect x="15" y="145" width="50" height="40" rx="3" fill="none" stroke="#F59E0B" stroke-width="2"/>
  <text x="40" y="156" font-family="Arial" font-size="7" fill="#F59E0B" text-anchor="middle" font-weight="bold">WORKSHOP</text>

  <!-- People attending workshop -->
  <circle cx="22" cy="167" r="3" fill="#F59E0B" opacity="0.4"/>
  <circle cx="30" cy="167" r="3" fill="#F59E0B" opacity="0.4"/>
  <circle cx="38" cy="167" r="3" fill="#F59E0B" opacity="0.4"/>
  <circle cx="46" cy="167" r="3" fill="#F59E0B" opacity="0.4"/>
  <circle cx="54" cy="167" r="3" fill="#F59E0B" opacity="0.4"/>
  <circle cx="26" cy="175" r="3" fill="#F59E0B" opacity="0.4"/>
  <circle cx="34" cy="175" r="3" fill="#F59E0B" opacity="0.4"/>
  <circle cx="42" cy="175" r="3" fill="#F59E0B" opacity="0.4"/>
  <circle cx="50" cy="175" r="3" fill="#F59E0B" opacity="0.4"/>

  <!-- Presenter icon -->
  <rect x="20" y="162" width="5" height="3" fill="#F59E0B"/>
  <text x="40" y="165" font-family="Arial" font-size="5" fill="#F59E0B" text-anchor="middle">Scrum Training</text>

  <!-- Transformation roadmap (bottom center) -->
  <rect x="75" y="145" width="55" height="40" rx="3" fill="#8B5CF6" opacity="0.1" stroke="#8B5CF6" stroke-width="2"/>
  <text x="102" y="156" font-family="Arial" font-size="7" fill="#8B5CF6" text-anchor="middle" font-weight="bold">TRANSFORMATION</text>

  <!-- Roadmap steps -->
  <circle cx="82" cy="167" r="4" fill="#10B981"/>
  <text x="82" y="169" font-family="Arial" font-size="6" fill="#FFF" text-anchor="middle" font-weight="bold">1</text>
  <line x1="86" y1="167" x2="95" y2="167" stroke="#8B5CF6" stroke-width="2"/>

  <circle cx="99" cy="167" r="4" fill="#06B6D4"/>
  <text x="99" y="169" font-family="Arial" font-size="6" fill="#FFF" text-anchor="middle" font-weight="bold">2</text>
  <line x1="103" y1="167" x2="112" y2="167" stroke="#8B5CF6" stroke-width="2"/>

  <circle cx="116" cy="167" r="4" fill="#8B5CF6" opacity="0.5"/>
  <text x="116" y="169" font-family="Arial" font-size="6" fill="#FFF" text-anchor="middle" font-weight="bold">3</text>
  <line x1="120" y1="167" x2="123" y2="167" stroke="#8B5CF6" stroke-width="2" stroke-dasharray="2,2"/>

  <circle cx="127" cy="167" r="4" fill="none" stroke="#8B5CF6" stroke-width="1.5" stroke-dasharray="2,2"/>
  <text x="127" y="169" font-family="Arial" font-size="6" fill="#8B5CF6" text-anchor="middle">4</text>

  <text x="82" y="178" font-family="Arial" font-size="5" fill="#10B981">Assess</text>
  <text x="99" y="178" font-family="Arial" font-size="5" fill="#06B6D4">Train</text>
  <text x="116" y="178" font-family="Arial" font-size="5" fill="#8B5CF6">Coach</text>
  <text x="127" y="178" font-family="Arial" font-size="5" fill="#8B5CF6">Scale</text>

  <!-- Metrics dashboard (bottom right) -->
  <rect x="140" y="145" width="45" height="40" rx="3" fill="none" stroke="#10B981" stroke-width="2"/>
  <text x="162" y="156" font-family="Arial" font-size="7" fill="#10B981" text-anchor="middle" font-weight="bold">METRICS</text>

  <!-- Trend charts -->
  <polyline points="145,165 150,162 155,160 160,163 165,158 170,155 175,157 180,153" fill="none" stroke="#10B981" stroke-width="2"/>
  <text x="162" y="173" font-family="Arial" font-size="5" fill="#10B981" text-anchor="middle">Velocity ↑</text>

  <rect x="145" y="175" width="8" height="8" fill="#10B981" opacity="0.3"/>
  <rect x="154" y="177" width="8" height="6" fill="#10B981" opacity="0.5"/>
  <rect x="163" y="175" width="8" height="8" fill="#10B981" opacity="0.7"/>
  <rect x="172" y="173" width="8" height="10" fill="#10B981"/>

  <!-- SAFe/LeSS icon (top left) -->
  <rect x="15" y="25" width="25" height="10" rx="2" fill="#8B5CF6" opacity="0.2" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="27" y="32" font-family="Arial" font-size="7" fill="#8B5CF6" text-anchor="middle" font-weight="bold">SAFe</text>
  <text x="27" y="22" font-family="Arial" font-size="5" fill="#8B5CF6" text-anchor="middle">Enterprise</text>

  <!-- Culture change icon (top right) -->
  <circle cx="175" cy="25" r="8" fill="none" stroke="#10B981" stroke-width="2"/>
  <path d="M 175 20 L 175 25 L 178 23" fill="none" stroke="#10B981" stroke-width="2"/>
  <circle cx="175" cy="25" r="4" fill="#10B981" opacity="0.2"/>
  <text x="175" y="38" font-family="Arial" font-size="5" fill="#10B981" text-anchor="middle">Culture</text>

  <!-- Community of Practice (top center) -->
  <circle cx="100" cy="22" r="3" fill="#06B6D4"/>
  <circle cx="92" cy="25" r="3" fill="#06B6D4"/>
  <circle cx="108" cy="25" r="3" fill="#06B6D4"/>
  <circle cx="96" cy="30" r="3" fill="#06B6D4"/>
  <circle cx="104" cy="30" r="3" fill="#06B6D4"/>
  <text x="100" y="15" font-family="Arial" font-size="6" fill="#06B6D4" text-anchor="middle" font-weight="bold">CoP</text>

  <!-- "AGILE COACH" text -->
  <text x="100" y="197" font-family="Arial" font-size="10" fill="#8B5CF6" text-anchor="middle" font-weight="bold">AGILE COACH</text>
</svg>
