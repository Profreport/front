        stroke="#10B981" stroke-width="1.5" fill="none"/>

  <!-- Grid lines -->
  <line x1="153" y1="156" x2="177" y2="156" stroke="#374151" stroke-width="0.3"/>
  <line x1="153" y1="161" x2="177" y2="161" stroke="#374151" stroke-width="0.3"/>
  <line x1="153" y1="166" x2="177" y2="166" stroke="#374151" stroke-width="0.3"/>

  <!-- Y-axis labels -->
