  <text x="20" y="98" font-family="Arial" font-size="6" fill="#10B981" text-anchor="middle" font-weight="bold">↑</text>
  <text x="20" y="87" font-family="Arial" font-size="3" fill="#10B981" text-anchor="middle">Traffic</text>
  <text x="20" y="108" font-family="Arial" font-size="3" fill="#10B981" text-anchor="middle">+45%</text>

  <!-- Analytics badge (right) -->
  <circle cx="180" cy="95" r="8" fill="#06B6D4" opacity="0.3"/>
  <text x="180" y="98" font-family="Arial" font-size="6" fill="#06B6D4" text-anchor="middle" font-weight="bold">📊</text>
  <text x="180" y="87" font-family="Arial" font-size="3" fill="#06B6D4" text-anchor="middle">Data</text>
  <text x="180" y="108" font-family="Arial" font-size="3" fill="#06B6D4" text-anchor="middle">Driven</text>

