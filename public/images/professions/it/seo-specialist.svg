  <text x="152" y="159" font-family="Arial" font-size="2" fill="#6B7280" text-anchor="end">5</text>
  <text x="152" y="164" font-family="Arial" font-size="2" fill="#6B7280" text-anchor="end">10</text>
  <text x="152" y="169" font-family="Arial" font-size="2" fill="#6B7280" text-anchor="end">20</text>

  <!-- Summary -->
  <text x="165" y="176" font-family="Arial" font-size="3" fill="#10B981" text-anchor="middle">Avg: #8 → #5</text>
