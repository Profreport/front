  <rect x="90" y="155" width="11" height="2" fill="#8B5CF6" opacity="0.3"/>
  <rect x="90" y="159" width="11" height="2" fill="#06B6D4" opacity="0.3"/>
  <rect x="90" y="163" width="9" height="2" fill="#10B981" opacity="0.3"/>
