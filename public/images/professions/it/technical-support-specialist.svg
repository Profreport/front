  <text x="64" y="67" font-family="Arial" font-size="3" fill="#EF4444" font-weight="bold">HIGH</text>
  <text x="64" y="70" font-family="Arial" font-size="3" fill="#D1D5DB">#1428 - Cannot access email</text>
  <text x="64" y="73" font-family="Arial" font-size="2" fill="#6B7280">User: Ivanov • Opened: 15 min ago</text>
