<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="dbaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <circle cx="100" cy="100" r="95" fill="url(#dbaGrad)" opacity="0.1"/>

  <!-- Main Database cylinder -->
  <ellipse cx="100" cy="50" rx="45" ry="15" fill="#8B5CF6" opacity="0.3" stroke="#8B5CF6" stroke-width="3"/>
  <rect x="55" y="50" width="90" height="70" fill="#8B5CF6" opacity="0.15"/>
  <line x1="55" y1="50" x2="55" y2="120" stroke="#8B5CF6" stroke-width="3"/>
  <line x1="145" y1="50" x2="145" y2="120" stroke="#8B5CF6" stroke-width="3"/>
  <ellipse cx="100" cy="120" rx="45" ry="15" fill="#8B5CF6" opacity="0.2" stroke="#8B5CF6" stroke-width="3"/>

  <!-- Data rows inside -->
  <ellipse cx="100" cy="70" rx="40" ry="10" fill="none" stroke="#06B6D4" stroke-width="1.5" opacity="0.6"/>
  <ellipse cx="100" cy="90" rx="40" ry="10" fill="none" stroke="#06B6D4" stroke-width="1.5" opacity="0.6"/>

  <!-- SQL query box -->
  <rect x="25" y="135" width="70" height="40" rx="3" fill="#1E293B" stroke="#06B6D4" stroke-width="2"/>
  <text x="32" y="150" font-family="Courier, monospace" font-size="7" fill="#10B981">SELECT * FROM</text>
  <text x="32" y="162" font-family="Courier, monospace" font-size="7" fill="#06B6D4">users WHERE...</text>

  <!-- Performance indicator -->
  <rect x="105" y="135" width="70" height="40" rx="3" fill="#10B981" opacity="0.15" stroke="#10B981" stroke-width="2"/>
  <text x="140" y="152" font-family="Arial, sans-serif" font-size="9" fill="#10B981" text-anchor="middle" font-weight="bold">2.3ms</text>
  <text x="140" y="165" font-family="Arial, sans-serif" font-size="7" fill="#10B981" text-anchor="middle">Query Time</text>

  <!-- Title -->
  <text x="100" y="195" font-family="Arial, sans-serif" font-size="12" fill="#8B5CF6" text-anchor="middle" font-weight="bold">DATABASE ADMIN</text>
</svg>
