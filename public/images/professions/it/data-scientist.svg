<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Gradient background -->
  <defs>
    <linearGradient id="dataGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EC4899;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#dataGrad)" opacity="0.1"/>

  <!-- Chart/Graph (main element) - line chart -->
  <rect x="30" y="40" width="140" height="90" rx="4" fill="none" stroke="#8B5CF6" stroke-width="2"/>

  <!-- X and Y axes -->
  <line x1="40" y1="120" x2="160" y2="120" stroke="#8B5CF6" stroke-width="2"/>
  <line x1="40" y1="50" x2="40" y2="120" stroke="#8B5CF6" stroke-width="2"/>

  <!-- Data line chart -->
  <polyline points="40,110 60,100 80,85 100,70 120,80 140,60 160,65" fill="none" stroke="#EC4899" stroke-width="3"/>

  <!-- Data points -->
  <circle cx="40" cy="110" r="3" fill="#EC4899"/>
  <circle cx="60" cy="100" r="3" fill="#EC4899"/>
  <circle cx="80" cy="85" r="3" fill="#EC4899"/>
  <circle cx="100" cy="70" r="3" fill="#EC4899"/>
  <circle cx="120" cy="80" r="3" fill="#EC4899"/>
  <circle cx="140" cy="60" r="3" fill="#EC4899"/>
  <circle cx="160" cy="65" r="3" fill="#EC4899"/>

  <!-- Trend arrow -->
  <line x1="45" y1="105" x2="75" y2="75" stroke="#8B5CF6" stroke-width="2" marker-end="url(#arrowData)"/>
  <defs>
    <marker id="arrowData" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto">
      <polygon points="0 0, 5 3, 0 6" fill="#8B5CF6"/>
    </marker>
  </defs>

  <!-- Python logo hint (bottom left) -->
  <circle cx="30" cy="150" r="12" fill="#8B5CF6" opacity="0.2"/>
  <text x="30" y="156" font-family="Arial" font-size="14" fill="#8B5CF6" text-anchor="middle" font-weight="bold">Py</text>

  <!-- Statistical formula hint (bottom center-left) -->
  <text x="70" y="155" font-family="Arial" font-size="16" fill="#EC4899" font-weight="bold">Σx²</text>

  <!-- Machine Learning brain/neural network hint (bottom right) -->
  <circle cx="130" cy="150" r="5" fill="none" stroke="#8B5CF6" stroke-width="1.5"/>
  <circle cx="145" cy="145" r="5" fill="none" stroke="#8B5CF6" stroke-width="1.5"/>
  <circle cx="145" cy="155" r="5" fill="none" stroke="#8B5CF6" stroke-width="1.5"/>
  <circle cx="160" cy="150" r="5" fill="none" stroke="#8B5CF6" stroke-width="1.5"/>
  <!-- Connections -->
  <line x1="135" y1="150" x2="140" y2="147" stroke="#EC4899" stroke-width="1"/>
  <line x1="135" y1="150" x2="140" y2="153" stroke="#EC4899" stroke-width="1"/>
  <line x1="150" y1="145" x2="155" y2="148" stroke="#EC4899" stroke-width="1"/>
  <line x1="150" y1="155" x2="155" y2="152" stroke="#EC4899" stroke-width="1"/>
  <text x="145" y="170" font-family="Arial" font-size="7" fill="#8B5CF6" text-anchor="middle">ML</text>

  <!-- Jupyter notebook icon (top left) -->
  <rect x="15" y="25" width="25" height="20" rx="2" fill="none" stroke="#EC4899" stroke-width="2"/>
  <circle cx="20" cy="32" r="2" fill="#EC4899"/>
  <circle cx="27" cy="32" r="2" fill="#EC4899"/>
  <circle cx="33" cy="32" r="2" fill="#EC4899"/>
  <line x1="18" y1="38" x2="35" y2="38" stroke="#EC4899" stroke-width="1"/>
  <text x="27" y="23" font-family="Arial" font-size="7" fill="#EC4899" text-anchor="middle">ipynb</text>

  <!-- Bar chart (top right) -->
  <rect x="165" y="45" width="6" height="20" fill="#8B5CF6" opacity="0.6"/>
  <rect x="173" y="35" width="6" height="30" fill="#EC4899" opacity="0.6"/>
  <rect x="181" y="40" width="6" height="25" fill="#8B5CF6" opacity="0.6"/>

  <!-- Database/SQL icon (bottom far right) -->
  <ellipse cx="180" cy="160" rx="10" ry="4" fill="none" stroke="#EC4899" stroke-width="2"/>
  <line x1="170" y1="160" x2="170" y2="168" stroke="#EC4899" stroke-width="2"/>
  <line x1="190" y1="160" x2="190" y2="168" stroke="#EC4899" stroke-width="2"/>
  <ellipse cx="180" cy="168" rx="10" ry="4" fill="#EC4899" opacity="0.3" stroke="#EC4899" stroke-width="2"/>

  <!-- A/B test icon (center bottom) -->
  <text x="95" y="180" font-family="Arial" font-size="18" fill="#8B5CF6" font-weight="bold">A/B</text>

  <!-- "DATA SCIENCE" text -->
  <text x="100" y="195" font-family="Arial" font-size="10" fill="#8B5CF6" text-anchor="middle" font-weight="bold">DATA SCIENCE</text>
</svg>
