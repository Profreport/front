<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Gradient background -->
  <defs>
    <linearGradient id="smmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EC4899;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#smmGrad)" opacity="0.1"/>

  <!-- VK Interface (center) -->
  <rect x="55" y="50" width="90" height="75" rx="3" fill="#1E293B" opacity="0.9" stroke="#EC4899" stroke-width="3"/>
  <text x="100" y="43" font-family="Arial" font-size="7" fill="#EC4899" text-anchor="middle" font-weight="bold">VK COMMUNITY</text>

  <!-- VK header -->
  <rect x="60" y="55" width="80" height="7" rx="1" fill="#0077FF"/>
  <circle cx="63" cy="58.5" r="2" fill="#FFF"/>
  <text x="67" y="60" font-family="Arial" font-size="4" fill="#FFF" font-weight="bold">Brand Community</text>
  <text x="130" y="60" font-family="Arial" font-size="3" fill="#FFF">24.5K подписчиков</text>

  <!-- Post card -->
  <rect x="60" y="65" width="80" height="55" fill="#0F172A"/>

  <!-- Post header -->
  <circle cx="65" cy="70" r="3" fill="#EC4899" opacity="0.4"/>
  <text x="70" y="71" font-family="Arial" font-size="3" fill="#EC4899" font-weight="bold">Бренд</text>
  <text x="70" y="74" font-family="Arial" font-size="2" fill="#6B7280">2 часа назад</text>

  <!-- Post text -->
  <text x="63" y="80" font-family="Arial" font-size="3" fill="#D1D5DB">🔥 Специальное предложение!</text>
  <text x="63" y="84" font-family="Arial" font-size="3" fill="#D1D5DB">Скидка 30% на все товары</text>
  <text x="63" y="88" font-family="Arial" font-size="3" fill="#D1D5DB">до конца недели 🎉</text>

  <!-- Post image placeholder -->
  <rect x="63" y="92" width="72" height="18" rx="1" fill="#8B5CF6" opacity="0.3"/>
  <text x="99" y="102" font-family="Arial" font-size="5" fill="#8B5CF6" text-anchor="middle">📸 Image</text>

  <!-- Engagement metrics -->
  <rect x="63" y="112" width="72" height="5" fill="#1E293B"/>
  <text x="65" y="115" font-family="Arial" font-size="3" fill="#EF4444">❤ 342</text>
  <text x="85" y="115" font-family="Arial" font-size="3" fill="#06B6D4">💬 28</text>
  <text x="105" y="115" font-family="Arial" font-size="3" fill="#10B981">↗ 15</text>
  <text x="125" y="115" font-family="Arial" font-size="3" fill="#F59E0B">👁 2.8K</text>

  <!-- Content Calendar (top left) -->
  <rect x="15" y="15" width="50" height="50" rx="3" fill="none" stroke="#06B6D4" stroke-width="2"/>
  <text x="40" y="27" font-family="Arial" font-size="6" fill="#06B6D4" text-anchor="middle" font-weight="bold">CALENDAR</text>

  <!-- Calendar grid -->
  <rect x="20" y="32" width="40" height="28" rx="1" fill="#1E293B" opacity="0.8"/>

  <!-- Week days -->
  <text x="22" y="36" font-family="Arial" font-size="2" fill="#6B7280">ПН ВТ СР ЧТ ПТ СБ ВС</text>

  <!-- Calendar cells with posts -->
  <rect x="22" y="38" width="4" height="4" rx="0.5" fill="#10B981" opacity="0.3"/>
  <text x="24" y="41" font-family="Arial" font-size="2" fill="#10B981" text-anchor="middle">1</text>

  <rect x="27" y="38" width="4" height="4" rx="0.5" fill="none" stroke="#374151" stroke-width="0.3"/>
  <text x="29" y="41" font-family="Arial" font-size="2" fill="#6B7280" text-anchor="middle">2</text>

  <rect x="32" y="38" width="4" height="4" rx="0.5" fill="#EC4899" opacity="0.3"/>
  <text x="34" y="41" font-family="Arial" font-size="2" fill="#EC4899" text-anchor="middle">3</text>

  <rect x="37" y="38" width="4" height="4" rx="0.5" fill="none" stroke="#374151" stroke-width="0.3"/>
  <text x="39" y="41" font-family="Arial" font-size="2" fill="#6B7280" text-anchor="middle">4</text>

  <rect x="42" y="38" width="4" height="4" rx="0.5" fill="#8B5CF6" opacity="0.3"/>
  <text x="44" y="41" font-family="Arial" font-size="2" fill="#8B5CF6" text-anchor="middle">5</text>

  <rect x="47" y="38" width="4" height="4" rx="0.5" fill="#F59E0B" opacity="0.3"/>
  <text x="49" y="41" font-family="Arial" font-size="2" fill="#F59E0B" text-anchor="middle">6</text>

  <rect x="52" y="38" width="4" height="4" rx="0.5" fill="none" stroke="#374151" stroke-width="0.3"/>
  <text x="54" y="41" font-family="Arial" font-size="2" fill="#6B7280" text-anchor="middle">7</text>

  <!-- Post types legend -->
  <circle cx="23" cy="47" r="1" fill="#10B981"/>
  <text x="26" y="48" font-family="Arial" font-size="2" fill="#10B981">Продающий</text>

  <circle cx="23" cy="51" r="1" fill="#EC4899"/>
  <text x="26" y="52" font-family="Arial" font-size="2" fill="#EC4899">Вовлекающий</text>

  <circle cx="23" cy="55" r="1" fill="#8B5CF6"/>
  <text x="26" y="56" font-family="Arial" font-size="2" fill="#8B5CF6">Обучающий</text>

  <circle cx="23" cy="59" r="1" fill="#F59E0B"/>
  <text x="26" y="60" font-family="Arial" font-size="2" fill="#F59E0B">Развлекательный</text>

  <!-- Analytics (top right) -->
  <rect x="135" y="15" width="50" height="50" rx="3" fill="#10B981" opacity="0.1" stroke="#10B981" stroke-width="2"/>
  <text x="160" y="27" font-family="Arial" font-size="6" fill="#10B981" text-anchor="middle" font-weight="bold">METRICS</text>

  <!-- Engagement stats -->
  <rect x="140" y="32" width="40" height="28" rx="1" fill="#1E293B" opacity="0.8"/>

  <text x="142" y="37" font-family="Arial" font-size="4" fill="#10B981">Охват:</text>
  <text x="142" y="42" font-family="Arial" font-size="6" fill="#10B981" font-weight="bold">48.2K</text>
  <circle cx="165" cy="40" r="1" fill="#10B981"/>
  <text x="168" y="42" font-family="Arial" font-size="3" fill="#10B981">+15%</text>

  <text x="142" y="49" font-family="Arial" font-size="4" fill="#06B6D4">Вовлечённость:</text>
  <text x="142" y="54" font-family="Arial" font-size="6" fill="#06B6D4" font-weight="bold">4.8%</text>
  <circle cx="165" cy="52" r="1" fill="#10B981"/>
  <text x="168" y="54" font-family="Arial" font-size="3" fill="#10B981">+0.6%</text>

  <text x="142" y="59" font-family="Arial" font-size="3" fill="#8B5CF6">Новых подписчиков: +245</text>

  <!-- Telegram (bottom left) -->
  <rect x="15" y="130" width="55" height="55" rx="3" fill="none" stroke="#0088CC" stroke-width="2"/>
  <text x="42" y="142" font-family="Arial" font-size="6" fill="#0088CC" text-anchor="middle" font-weight="bold">TELEGRAM</text>

  <!-- Telegram channel -->
  <rect x="20" y="147" width="45" height="33" rx="1" fill="#1E293B" opacity="0.8"/>

  <!-- Channel header -->
  <circle cx="25" cy="152" r="3" fill="#0088CC" opacity="0.4"/>
  <text x="30" y="153" font-family="Arial" font-size="3" fill="#0088CC" font-weight="bold">Канал бренда</text>
  <text x="30" y="156" font-family="Arial" font-size="2" fill="#6B7280">12.3K подписчиков</text>

  <!-- Post preview -->
  <rect x="22" y="160" width="40" height="15" rx="1" fill="#0F172A"/>
  <text x="24" y="164" font-family="Arial" font-size="2" fill="#D1D5DB">Новый пост в канале 📢</text>
  <text x="24" y="168" font-family="Arial" font-size="2" fill="#D1D5DB">Полезная информация для</text>
  <text x="24" y="172" font-family="Arial" font-size="2" fill="#D1D5DB">наших подписчиков...</text>

  <text x="42" y="179" font-family="Arial" font-size="3" fill="#0088CC" text-anchor="middle">👁 3.2K просмотров</text>

  <!-- Instagram* (bottom center) -->
  <rect x="80" y="130" width="55" height="55" rx="3" fill="#E1306C" opacity="0.1" stroke="#E1306C" stroke-width="2"/>
  <text x="107" y="142" font-family="Arial" font-size="5" fill="#E1306C" text-anchor="middle" font-weight="bold">INSTAGRAM*</text>
  <text x="107" y="147" font-family="Arial" font-size="2" fill="#6B7280" text-anchor="middle">*Meta запрещена в РФ</text>

  <!-- Instagram post -->
  <rect x="85" y="152" width="45" height="28" rx="1" fill="#1E293B" opacity="0.8"/>

  <!-- Image post -->
  <rect x="88" y="155" width="18" height="18" rx="1" fill="#E1306C" opacity="0.3"/>
  <text x="97" y="166" font-family="Arial" font-size="6" fill="#E1306C" text-anchor="middle">📷</text>

  <!-- Stories -->
  <circle cx="113" cy="158" r="3" fill="#F59E0B" opacity="0.4" stroke="#F59E0B" stroke-width="1"/>
  <text x="113" y="160" font-family="Arial" font-size="2" fill="#FFF" text-anchor="middle">1</text>
  <text x="113" y="166" font-family="Arial" font-size="2" fill="#F59E0B" text-anchor="middle">Stories</text>

  <circle cx="123" cy="158" r="3" fill="#EC4899" opacity="0.4" stroke="#EC4899" stroke-width="1"/>
  <text x="123" y="160" font-family="Arial" font-size="2" fill="#FFF" text-anchor="middle">5</text>
  <text x="123" y="166" font-family="Arial" font-size="2" fill="#EC4899" text-anchor="middle">Reels</text>

  <text x="107" y="178" font-family="Arial" font-size="3" fill="#E1306C" text-anchor="middle">❤ 2.4K · 💬 86 · ↗ 152</text>

  <!-- Community Management (bottom right) -->
  <rect x="145" y="130" width="40" height="55" rx="3" fill="none" stroke="#F59E0B" stroke-width="2"/>
  <text x="165" y="142" font-family="Arial" font-size="5" fill="#F59E0B" text-anchor="middle" font-weight="bold">COMMENTS</text>

  <!-- Comments list -->
  <rect x="150" y="147" width="30" height="33" rx="1" fill="#1E293B" opacity="0.8"/>

  <!-- Comment 1 -->
  <circle cx="153" cy="151" r="2" fill="#10B981" opacity="0.4"/>
  <text x="157" y="152" font-family="Arial" font-size="2" fill="#10B981">Отличный пост! 👍</text>

  <!-- Comment 2 -->
  <circle cx="153" cy="157" r="2" fill="#06B6D4" opacity="0.4"/>
  <text x="157" y="158" font-family="Arial" font-size="2" fill="#06B6D4">Когда новая акция?</text>
  <text x="157" y="161" font-family="Arial" font-size="2" fill="#F59E0B">→ Ответ: Скоро! 😊</text>

  <!-- Comment 3 -->
  <circle cx="153" cy="166" r="2" fill="#EF4444" opacity="0.4"/>
  <text x="157" y="167" font-family="Arial" font-size="2" fill="#EF4444">Не пришёл заказ ❌</text>
  <text x="157" y="170" font-family="Arial" font-size="2" fill="#F59E0B">→ Пишите в ЛС 📩</text>

  <text x="165" y="177" font-family="Arial" font-size="2" fill="#F59E0B" text-anchor="middle">Время ответа: ~15 мин</text>

  <!-- Engagement badge (left) -->
  <circle cx="20" cy="95" r="8" fill="none" stroke="#EC4899" stroke-width="2"/>
  <text x="20" y="98" font-family="Arial" font-size="6" fill="#EC4899" text-anchor="middle" font-weight="bold">❤</text>
  <text x="20" y="87" font-family="Arial" font-size="3" fill="#EC4899" text-anchor="middle">Engagement</text>
  <text x="20" y="108" font-family="Arial" font-size="3" fill="#EC4899" text-anchor="middle">5.2%</text>

  <!-- Community badge (right) -->
  <circle cx="180" cy="95" r="8" fill="#10B981" opacity="0.3"/>
  <text x="180" y="98" font-family="Arial" font-size="6" fill="#10B981" text-anchor="middle" font-weight="bold">👥</text>
  <text x="180" y="87" font-family="Arial" font-size="3" fill="#10B981" text-anchor="middle">Community</text>
  <text x="180" y="108" font-family="Arial" font-size="3" fill="#10B981" text-anchor="middle">Growth</text>

  <!-- Tools badge (top) -->
  <rect x="65" y="5" width="70" height="10" rx="2" fill="#EC4899" opacity="0.3" stroke="#EC4899" stroke-width="1.5"/>
  <text x="100" y="12" font-family="Arial" font-size="6" fill="#EC4899" text-anchor="middle" font-weight="bold">VK • TG • Content • Analytics</text>

  <!-- "SMM SPECIALIST" text -->
  <text x="100" y="197" font-family="Arial" font-size="11" fill="#EC4899" text-anchor="middle" font-weight="bold">SMM SPECIALIST</text>
</svg>
