<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Gradient background -->
  <defs>
    <linearGradient id="qaLeadGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#qaLeadGrad)" opacity="0.1"/>

  <!-- QA Team (main element) -->
  <rect x="25" y="40" width="150" height="70" rx="4" fill="none" stroke="#10B981" stroke-width="3"/>
  <text x="100" y="56" font-family="Arial" font-size="9" fill="#10B981" text-anchor="middle" font-weight="bold">QA TEAM</text>

  <!-- Team members -->
  <circle cx="50" cy="75" r="10" fill="none" stroke="#06B6D4" stroke-width="2"/>
  <circle cx="50" cy="71" r="4" fill="#06B6D4"/>
  <path d="M 43 83 Q 50 80, 57 83" fill="none" stroke="#06B6D4" stroke-width="2"/>
  <text x="50" y="98" font-family="Arial" font-size="6" fill="#06B6D4" text-anchor="middle">Manual QA</text>

  <circle cx="80" cy="75" r="10" fill="none" stroke="#8B5CF6" stroke-width="2"/>
  <circle cx="80" cy="71" r="4" fill="#8B5CF6"/>
  <path d="M 73 83 Q 80 80, 87 83" fill="none" stroke="#8B5CF6" stroke-width="2"/>
  <text x="80" y="98" font-family="Arial" font-size="6" fill="#8B5CF6" text-anchor="middle">Automation</text>

  <circle cx="110" cy="75" r="10" fill="none" stroke="#10B981" stroke-width="2"/>
  <circle cx="110" cy="71" r="4" fill="#10B981"/>
  <path d="M 103 83 Q 110 80, 117 83" fill="none" stroke="#10B981" stroke-width="2"/>
  <text x="110" y="98" font-family="Arial" font-size="6" fill="#10B981" text-anchor="middle">Manual QA</text>

  <circle cx="140" cy="75" r="10" fill="none" stroke="#F59E0B" stroke-width="2"/>
  <circle cx="140" cy="71" r="4" fill="#F59E0B"/>
  <path d="M 133 83 Q 140 80, 147 83" fill="none" stroke="#F59E0B" stroke-width="2"/>
  <text x="140" y="98" font-family="Arial" font-size="6" fill="#F59E0B" text-anchor="middle">Performance</text>

  <!-- Lead at center above team -->
  <circle cx="100" cy="25" r="12" fill="#10B981" opacity="0.2" stroke="#10B981" stroke-width="3"/>
  <circle cx="100" cy="21" r="5" fill="#10B981"/>
  <path d="M 91 32 Q 100 28, 109 32" fill="none" stroke="#10B981" stroke-width="2"/>
  <text x="100" y="13" font-family="Arial" font-size="7" fill="#10B981" text-anchor="middle" font-weight="bold">QA LEAD</text>

  <!-- Connection lines from lead to team -->
  <line x1="95" y1="35" x2="50" y2="65" stroke="#10B981" stroke-width="1.5" stroke-dasharray="2,2"/>
  <line x1="98" y1="36" x2="80" y2="65" stroke="#10B981" stroke-width="1.5" stroke-dasharray="2,2"/>
  <line x1="102" y1="36" x2="110" y2="65" stroke="#10B981" stroke-width="1.5" stroke-dasharray="2,2"/>
  <line x1="105" y1="35" x2="140" y2="65" stroke="#10B981" stroke-width="1.5" stroke-dasharray="2,2"/>

  <!-- Test Strategy Document (bottom left) -->
  <rect x="15" y="120" width="50" height="60" rx="3" fill="none" stroke="#8B5CF6" stroke-width="2"/>
  <text x="40" y="132" font-family="Arial" font-size="7" fill="#8B5CF6" text-anchor="middle" font-weight="bold">TEST STRATEGY</text>

  <!-- Strategy content -->
  <line x1="20" y1="140" x2="60" y2="140" stroke="#8B5CF6" stroke-width="1"/>
  <line x1="20" y1="145" x2="55" y2="145" stroke="#8B5CF6" stroke-width="1"/>
  <line x1="20" y1="150" x2="58" y2="150" stroke="#8B5CF6" stroke-width="1"/>

  <text x="40" y="160" font-family="Arial" font-size="5" fill="#8B5CF6" text-anchor="middle">• Manual: 40%</text>
  <text x="40" y="167" font-family="Arial" font-size="5" fill="#8B5CF6" text-anchor="middle">• Automation: 50%</text>
  <text x="40" y="174" font-family="Arial" font-size="5" fill="#8B5CF6" text-anchor="middle">• Performance: 10%</text>

  <!-- Quality Metrics (bottom center) -->
  <rect x="75" y="120" width="50" height="60" rx="3" fill="#10B981" opacity="0.1" stroke="#10B981" stroke-width="2"/>
  <text x="100" y="132" font-family="Arial" font-size="7" fill="#10B981" text-anchor="middle" font-weight="bold">METRICS</text>

  <!-- Gauge chart -->
  <circle cx="100" cy="152" r="12" fill="none" stroke="#10B981" stroke-width="3" stroke-dasharray="40 80"/>
  <text x="100" y="156" font-family="Arial" font-size="10" fill="#10B981" text-anchor="middle" font-weight="bold">92%</text>
  <text x="100" y="169" font-family="Arial" font-size="5" fill="#10B981" text-anchor="middle">Test Pass Rate</text>

  <!-- Bug stats -->
  <text x="100" y="177" font-family="Arial" font-size="5" fill="#EF4444" text-anchor="middle">Critical: 0</text>

  <!-- Release Management (bottom right) -->
  <rect x="135" y="120" width="50" height="60" rx="3" fill="none" stroke="#06B6D4" stroke-width="2"/>
  <text x="160" y="132" font-family="Arial" font-size="7" fill="#06B6D4" text-anchor="middle" font-weight="bold">RELEASE</text>

  <!-- Go/No-Go decision -->
  <circle cx="160" cy="152" r="15" fill="none" stroke="#10B981" stroke-width="3"/>
  <text x="160" y="158" font-family="Arial" font-size="18" fill="#10B981" text-anchor="middle" font-weight="bold">✓</text>
  <text x="160" y="171" font-family="Arial" font-size="6" fill="#10B981" text-anchor="middle" font-weight="bold">GO</text>

  <!-- Planning icon (top left) -->
  <rect x="15" y="18" width="20" height="14" rx="2" fill="none" stroke="#8B5CF6" stroke-width="1.5"/>
  <line x1="18" y1="22" x2="32" y2="22" stroke="#8B5CF6" stroke-width="1"/>
  <line x1="18" y1="25" x2="30" y2="25" stroke="#8B5CF6" stroke-width="1"/>
  <line x1="18" y1="28" x2="28" y2="28" stroke="#8B5CF6" stroke-width="1"/>
  <text x="25" y="15" font-family="Arial" font-size="5" fill="#8B5CF6" text-anchor="middle">Planning</text>

  <!-- Mentoring icon (top right) -->
  <circle cx="168" cy="22" r="5" fill="none" stroke="#F59E0B" stroke-width="1.5"/>
  <circle cx="168" cy="19" r="2" fill="#F59E0B"/>
  <path d="M 163 28 Q 168 26, 173 28" fill="none" stroke="#F59E0B" stroke-width="1.5"/>

  <circle cx="180" cy="26" r="4" fill="none" stroke="#F59E0B" stroke-width="1.5"/>
  <circle cx="180" cy="24" r="1.5" fill="#F59E0B"/>
  <path d="M 176 30 Q 180 28, 184 30" fill="none" stroke="#F59E0B" stroke-width="1.5"/>

  <text x="174" y="15" font-family="Arial" font-size="5" fill="#F59E0B" text-anchor="middle">Mentoring</text>

  <!-- "QA LEAD" text -->
  <text x="100" y="197" font-family="Arial" font-size="10" fill="#10B981" text-anchor="middle" font-weight="bold">QA LEAD</text>
</svg>
