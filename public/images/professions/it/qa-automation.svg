<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Gradient background -->
  <defs>
    <linearGradient id="qaAutoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#qaAutoGrad)" opacity="0.1"/>

  <!-- Code Editor with Test Code (main element) -->
  <rect x="25" y="30" width="90" height="85" rx="4" fill="#1E293B" stroke="#8B5CF6" stroke-width="3"/>
  <line x1="25" y1="42" x2="115" y2="42" stroke="#8B5CF6" stroke-width="2"/>
  <text x="70" y="39" font-family="Arial" font-size="7" fill="#8B5CF6" text-anchor="middle" font-weight="bold">test_login.py</text>

  <!-- Python test code -->
  <text x="30" y="52" font-family="Courier" font-size="5" fill="#F59E0B">from</text>
  <text x="44" y="52" font-family="Courier" font-size="5" fill="#06B6D4"> selenium </text>
  <text x="66" y="52" font-family="Courier" font-size="5" fill="#F59E0B">import</text>

  <text x="30" y="60" font-family="Courier" font-size="5" fill="#F59E0B">def</text>
  <text x="42" y="60" font-family="Courier" font-size="5" fill="#10B981"> test_login</text>
  <text x="68" y="60" font-family="Courier" font-size="5" fill="#FFF">(driver):</text>

  <text x="34" y="68" font-family="Courier" font-size="5" fill="#9CA3AF"># Navigate to login</text>

  <text x="34" y="76" font-family="Courier" font-size="5" fill="#FFF">driver.find(</text>
  <text x="59" y="76" font-family="Courier" font-size="5" fill="#10B981">"#email"</text>
  <text x="75" y="76" font-family="Courier" font-size="5" fill="#FFF">)</text>

  <text x="34" y="84" font-family="Courier" font-size="5" fill="#FFF">.send_keys(</text>
  <text x="60" y="84" font-family="Courier" font-size="5" fill="#10B981">"test@"</text>
  <text x="75" y="84" font-family="Courier" font-size="5" fill="#FFF">)</text>

  <text x="34" y="92" font-family="Courier" font-size="5" fill="#FFF">button.click()</text>

  <text x="34" y="100" font-family="Courier" font-size="5" fill="#F59E0B">assert</text>
  <text x="50" y="100" font-family="Courier" font-size="5" fill="#FFF"> dashboard </text>
  <text x="78" y="100" font-family="Courier" font-size="5" fill="#F59E0B">in</text>

  <text x="34" y="108" font-family="Courier" font-size="5" fill="#9CA3AF"># Test passed ✓</text>

  <!-- Terminal with test run (right side) -->
  <rect x="125" y="30" width="60" height="85" rx="4" fill="#1E293B" stroke="#06B6D4" stroke-width="3"/>
  <circle cx="130" cy="36" r="2" fill="#EF4444"/>
  <circle cx="136" cy="36" r="2" fill="#F59E0B"/>
  <circle cx="142" cy="36" r="2" fill="#10B981"/>

  <!-- Terminal output -->
  <text x="130" y="50" font-family="Courier" font-size="5" fill="#10B981">$ pytest tests/</text>
  <text x="130" y="58" font-family="Courier" font-size="5" fill="#06B6D4">========================</text>
  <text x="130" y="66" font-family="Courier" font-size="5" fill="#FFF">test_login.py</text>
  <text x="165" y="66" font-family="Courier" font-size="6" fill="#10B981">✓</text>
  <text x="130" y="74" font-family="Courier" font-size="5" fill="#FFF">test_register.py</text>
  <text x="170" y="74" font-family="Courier" font-size="6" fill="#10B981">✓</text>
  <text x="130" y="82" font-family="Courier" font-size="5" fill="#FFF">test_checkout.py</text>
  <text x="172" y="82" font-family="Courier" font-size="6" fill="#10B981">✓</text>
  <text x="130" y="90" font-family="Courier" font-size="5" fill="#06B6D4">========================</text>
  <text x="130" y="98" font-family="Courier" font-size="5" fill="#10B981">127 passed</text>
  <text x="155" y="98" font-family="Courier" font-size="5" fill="#F59E0B"> 2 failed</text>
  <text x="130" y="106" font-family="Courier" font-size="5" fill="#06B6D4">in 45.3s</text>

  <!-- CI/CD Pipeline (bottom) -->
  <rect x="20" y="125" width="160" height="55" rx="4" fill="none" stroke="#10B981" stroke-width="3"/>
  <text x="100" y="136" font-family="Arial" font-size="8" fill="#10B981" text-anchor="middle" font-weight="bold">CI/CD PIPELINE</text>

  <!-- Pipeline stages -->
  <rect x="28" y="142" width="30" height="30" rx="2" fill="#06B6D4" opacity="0.2" stroke="#06B6D4" stroke-width="1.5"/>
  <text x="43" y="152" font-family="Arial" font-size="6" fill="#06B6D4" text-anchor="middle" font-weight="bold">Build</text>
  <circle cx="43" cy="162" r="6" fill="#10B981"/>
  <path d="M 41 162 L 42.5 163.5 L 46 160" fill="none" stroke="#FFF" stroke-width="1.5"/>

  <path d="M 58 157 L 68 157" fill="none" stroke="#10B981" stroke-width="2" marker-end="url(#arrowAuto)"/>
  <defs>
    <marker id="arrowAuto" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <polygon points="0 0, 3 3, 0 6" fill="#10B981"/>
    </marker>
  </defs>

  <rect x="68" y="142" width="30" height="30" rx="2" fill="#8B5CF6" opacity="0.2" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="83" y="150" font-family="Arial" font-size="6" fill="#8B5CF6" text-anchor="middle" font-weight="bold">Test</text>
  <text x="83" y="157" font-family="Arial" font-size="5" fill="#8B5CF6" text-anchor="middle">UI Tests</text>
  <circle cx="83" cy="164" r="6" fill="#10B981"/>
  <path d="M 81 164 L 82.5 165.5 L 86 162" fill="none" stroke="#FFF" stroke-width="1.5"/>

  <path d="M 98 157 L 108 157" fill="none" stroke="#10B981" stroke-width="2" marker-end="url(#arrowAuto)"/>

  <rect x="108" y="142" width="30" height="30" rx="2" fill="#F59E0B" opacity="0.2" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="123" y="150" font-family="Arial" font-size="6" fill="#F59E0B" text-anchor="middle" font-weight="bold">API</text>
  <text x="123" y="157" font-family="Arial" font-size="5" fill="#F59E0B" text-anchor="middle">Tests</text>
  <circle cx="123" cy="164" r="6" fill="#10B981"/>
  <path d="M 121 164 L 122.5 165.5 L 126 162" fill="none" stroke="#FFF" stroke-width="1.5"/>

  <path d="M 138 157 L 148 157" fill="none" stroke="#10B981" stroke-width="2" marker-end="url(#arrowAuto)"/>

  <rect x="148" y="142" width="24" height="30" rx="2" fill="#10B981" opacity="0.2" stroke="#10B981" stroke-width="1.5"/>
  <text x="160" y="152" font-family="Arial" font-size="6" fill="#10B981" text-anchor="middle" font-weight="bold">Deploy</text>
  <circle cx="160" cy="162" r="6" fill="#10B981"/>
  <text x="160" y="166" font-family="Arial" font-size="8" fill="#FFF" text-anchor="middle" font-weight="bold">✓</text>

  <!-- Selenium logo (top left) -->
  <circle cx="22" cy="20" r="8" fill="#10B981" opacity="0.2"/>
  <text x="22" y="24" font-family="Arial" font-size="8" fill="#10B981" text-anchor="middle" font-weight="bold">Se</text>
  <text x="22" y="13" font-family="Arial" font-size="5" fill="#10B981" text-anchor="middle">Selenium</text>

  <!-- Playwright logo (top center) -->
  <rect x="86" y="14" width="28" height="10" rx="2" fill="#8B5CF6" opacity="0.2" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="100" y="21" font-family="Arial" font-size="6" fill="#8B5CF6" text-anchor="middle" font-weight="bold">Playwright</text>
  <text x="100" y="12" font-family="Arial" font-size="4" fill="#8B5CF6" text-anchor="middle">Automation</text>

  <!-- Test speed indicator (top right) -->
  <circle cx="175" cy="20" r="8" fill="none" stroke="#F59E0B" stroke-width="2"/>
  <path d="M 175 15 L 175 20 L 179 17" fill="none" stroke="#F59E0B" stroke-width="2"/>
  <text x="175" y="12" font-family="Arial" font-size="5" fill="#F59E0B" text-anchor="middle">Fast</text>

  <!-- "QA AUTOMATION" text -->
  <text x="100" y="197" font-family="Arial" font-size="9" fill="#8B5CF6" text-anchor="middle" font-weight="bold">QA AUTOMATION</text>
</svg>
