<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Gradient background -->
  <defs>
    <linearGradient id="architectGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667EEA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764BA2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#architectGrad)" opacity="0.1"/>

  <!-- Main architectural diagram - layered architecture -->
  <!-- Presentation Layer -->
  <rect x="50" y="30" width="100" height="20" rx="3" fill="none" stroke="#667EEA" stroke-width="2"/>
  <text x="100" y="44" font-family="Arial" font-size="9" fill="#667EEA" text-anchor="middle" font-weight="bold">Presentation</text>

  <!-- Business Layer -->
  <rect x="50" y="60" width="100" height="20" rx="3" fill="none" stroke="#764BA2" stroke-width="2"/>
  <text x="100" y="74" font-family="Arial" font-size="9" fill="#764BA2" text-anchor="middle" font-weight="bold">Business Logic</text>

  <!-- Data Layer -->
  <rect x="50" y="90" width="100" height="20" rx="3" fill="none" stroke="#667EEA" stroke-width="2"/>
  <text x="100" y="104" font-family="Arial" font-size="9" fill="#667EEA" text-anchor="middle" font-weight="bold">Data Access</text>

  <!-- Arrows connecting layers -->
  <line x1="100" y1="50" x2="100" y2="60" stroke="#764BA2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="100" y1="80" x2="100" y2="90" stroke="#764BA2" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto">
      <polygon points="0 0, 5 3, 0 6" fill="#764BA2"/>
    </marker>
  </defs>

  <!-- Microservices blocks (bottom) -->
  <rect x="20" y="130" width="35" height="30" rx="4" fill="#667EEA" opacity="0.2" stroke="#667EEA" stroke-width="2"/>
  <text x="37" y="148" font-family="Arial" font-size="8" fill="#667EEA" text-anchor="middle" font-weight="bold">Auth</text>

  <rect x="65" y="130" width="35" height="30" rx="4" fill="#764BA2" opacity="0.2" stroke="#764BA2" stroke-width="2"/>
  <text x="82" y="148" font-family="Arial" font-size="8" fill="#764BA2" text-anchor="middle" font-weight="bold">API</text>

  <rect x="110" y="130" width="35" height="30" rx="4" fill="#667EEA" opacity="0.2" stroke="#667EEA" stroke-width="2"/>
  <text x="127" y="148" font-family="Arial" font-size="8" fill="#667EEA" text-anchor="middle" font-weight="bold">DB</text>

  <rect x="155" y="130" width="35" height="30" rx="4" fill="#764BA2" opacity="0.2" stroke="#764BA2" stroke-width="2"/>
  <text x="172" y="148" font-family="Arial" font-size="8" fill="#764BA2" text-anchor="middle" font-weight="bold">Cache</text>

  <!-- Connections between microservices -->
  <line x1="55" y1="145" x2="65" y2="145" stroke="#667EEA" stroke-width="1.5"/>
  <line x1="100" y1="145" x2="110" y2="145" stroke="#764BA2" stroke-width="1.5"/>
  <line x1="145" y1="145" x2="155" y2="145" stroke="#667EEA" stroke-width="1.5"/>

  <!-- UML class diagram hint (top left) -->
  <rect x="15" y="35" width="25" height="30" rx="2" fill="none" stroke="#764BA2" stroke-width="2"/>
  <line x1="15" y1="43" x2="40" y2="43" stroke="#764BA2" stroke-width="2"/>
  <line x1="15" y1="52" x2="40" y2="52" stroke="#764BA2" stroke-width="2"/>
  <line x1="18" y1="47" x2="37" y2="47" stroke="#764BA2" stroke-width="1"/>
  <line x1="18" y1="57" x2="37" y2="57" stroke="#764BA2" stroke-width="1"/>

  <!-- Cloud icon (top right) -->
  <path d="M 165 45 Q 165 40, 170 40 Q 175 40, 175 35 Q 180 35, 180 40 Q 185 40, 185 45 Q 185 50, 180 50 L 170 50 Q 165 50, 165 45 Z" fill="none" stroke="#667EEA" stroke-width="2"/>
  <text x="175" y="62" font-family="Arial" font-size="7" fill="#667EEA" text-anchor="middle">Cloud</text>

  <!-- Blueprint/Design tools (compass and ruler) -->
  <circle cx="37" cy="90" r="2" fill="#764BA2"/>
  <line x1="37" y1="88" x2="37" y2="78" stroke="#764BA2" stroke-width="2"/>
  <line x1="37" y1="90" x2="43" y2="98" stroke="#764BA2" stroke-width="2"/>
  <circle cx="43" cy="98" r="1.5" fill="#764BA2"/>

  <!-- Patterns book/documentation (bottom left) -->
  <rect x="15" y="170" width="30" height="20" rx="2" fill="none" stroke="#667EEA" stroke-width="2"/>
  <line x1="20" y1="175" x2="40" y2="175" stroke="#667EEA" stroke-width="1"/>
  <line x1="20" y1="180" x2="40" y2="180" stroke="#667EEA" stroke-width="1"/>
  <line x1="20" y1="185" x2="35" y2="185" stroke="#667EEA" stroke-width="1"/>

  <!-- Scalability arrows (bottom right) -->
  <line x1="155" y1="175" x2="180" y2="175" stroke="#764BA2" stroke-width="2" marker-end="url(#arrowhead2)"/>
  <line x1="155" y1="183" x2="185" y2="183" stroke="#764BA2" stroke-width="2" marker-end="url(#arrowhead2)"/>
  <defs>
    <marker id="arrowhead2" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto">
      <polygon points="0 0, 5 3, 0 6" fill="#764BA2"/>
    </marker>
  </defs>
  <text x="167" y="172" font-family="Arial" font-size="7" fill="#764BA2">Scale</text>

  <!-- "ARCHITECT" text -->
  <text x="100" y="195" font-family="Arial" font-size="12" fill="#667EEA" text-anchor="middle" font-weight="bold">ARCHITECT</text>
</svg>
